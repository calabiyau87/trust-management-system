<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Trust Ops Sign-In</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef2f5;
        --surface: #ffffff;
        --surface-muted: #f4f7f9;
        --text: #13212d;
        --muted: #5f6f7d;
        --border: #d6dfe6;
        --accent: #235d57;
        --accent-strong: #16413d;
        --danger: #b04545;
        --ok: #2f7351;
        --shadow: 0 24px 72px rgba(21, 34, 50, 0.16);
        --shadow-soft: 0 4px 14px rgba(21, 34, 50, 0.05);
        --radius: 28px;
        --radius-sm: 8px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(35, 93, 87, 0.14), transparent 32%),
          radial-gradient(circle at bottom right, rgba(16, 65, 61, 0.12), transparent 34%),
          linear-gradient(180deg, #f5f8fb 0%, #edf2f6 100%);
      }

      h1,
      p {
        margin: 0;
      }

      a {
        color: inherit;
      }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding:
          calc(28px + env(safe-area-inset-top))
          calc(18px + env(safe-area-inset-right))
          calc(28px + env(safe-area-inset-bottom))
          calc(18px + env(safe-area-inset-left));
      }

      .verification-card {
        width: min(560px, 100%);
        display: grid;
        gap: 18px;
        padding: 32px;
        justify-items: center;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .verification-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .verification-brand .mark {
        width: 44px;
        height: 44px;
        display: inline-grid;
        place-items: center;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(35, 93, 87, 0.22), rgba(35, 93, 87, 0.12));
        border: 1px solid rgba(35, 93, 87, 0.14);
        color: var(--accent-strong);
        font-weight: 800;
      }

      .verification-eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .verification-title {
        margin: 0;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.04;
        letter-spacing: -0.04em;
      }

      .verification-copy {
        margin: 0;
        max-width: 34ch;
        color: var(--muted);
        font-size: 15px;
      }

      .verification-box {
        width: 100%;
        display: grid;
        gap: 12px;
        padding: 20px;
        justify-items: center;
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 22px;
        background: var(--surface-muted);
        box-shadow: var(--shadow-soft);
      }

      #google-signin-button {
        display: flex;
        justify-content: center;
        min-height: 48px;
      }

      .verification-status {
        min-height: 22px;
        color: var(--muted);
        font-size: 14px;
      }

      .verification-status.visible {
        color: var(--accent);
      }

      .verification-status.error {
        color: var(--danger);
      }

      .verification-return {
        display: grid;
        gap: 10px;
        justify-items: center;
      }

      a.primary,
      .continue-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        min-width: 220px;
        padding: 8px 11px;
        border: 1px solid var(--accent);
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        text-decoration: none;
        touch-action: manipulation;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      a.primary:hover,
      .continue-link:hover {
        border-color: var(--accent-strong);
        background: var(--accent-strong);
        box-shadow: var(--shadow-soft);
        transform: translateY(-1px);
      }

      a.primary:focus-visible,
      .continue-link:focus-visible {
        outline: 0;
        box-shadow: 0 0 0 3px rgba(35, 93, 87, 0.14);
      }

      a.primary:visited,
      .continue-link:visited {
        color: #fff;
      }

      .verification-note {
        margin: 0;
        max-width: 34ch;
        color: var(--muted);
        font-size: 13px;
      }

      .verification-hint {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }

      @media (max-width: 900px) {
        .verification-card {
          padding: 24px;
        }

        .verification-title {
          font-size: clamp(24px, 7vw, 32px);
        }
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="page">
      <section class="verification-card">
        <div class="verification-brand">
          <div class="mark">TO</div>
          <div>
            <p class="verification-eyebrow">Trust Ops verification</p>
            <h1 class="verification-title">Verify your Google account.</h1>
          </div>
        </div>
        <p class="verification-copy">Use the Google account on the Trust Ops users list.</p>
        <div class="verification-box">
          <div id="google-signin-button"></div>
          <div id="status" class="verification-status"></div>
          <div id="error" class="verification-status error"></div>
          <div id="return-slot"></div>
        </div>
        <p class="verification-note">You will return to Trust Ops automatically after verification.</p>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const state = {
        clientId: params.get("client_id") || "",
        returnUrl: params.get("return_url") || "",
        appName: params.get("app_name") || "Trust Ops",
        initialized: false,
        credential: "",
        returning: false
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function setError(message) {
        const error = document.getElementById("error");
        error.textContent = message || "";
        error.classList.toggle("visible", Boolean(message));
      }

      function setStatus(message) {
        const status = document.getElementById("status");
        status.textContent = message || "";
        status.classList.toggle("visible", Boolean(message));
      }

      function returnUrlOrigin() {
        try {
          return state.returnUrl ? new URL(state.returnUrl).origin : "";
        } catch (error) {
          return "";
        }
      }

      function buildReturnUrl(token) {
        try {
          const url = new URL(state.returnUrl);
          url.searchParams.set("trust_ops_token", token);
          url.hash = `id_token=${encodeURIComponent(token)}`;
          return url.toString();
        } catch (error) {
          setError("Open this page from Trust Ops again.");
          return "";
        }
      }

      function renderReturnStep(token) {
        const slot = document.getElementById("return-slot");
        const redirectUrl = buildReturnUrl(token);
        if (!slot) return;
        if (!redirectUrl) {
          slot.innerHTML = "<div class=\"verification-status error visible\">Open this page from Trust Ops again.</div>";
          return;
        }
        slot.innerHTML = `
          <div class="verification-return">
            <div class="verification-status visible">Verification complete.</div>
            <a class="continue-link" href="${escapeHtml(redirectUrl)}" target="_top" rel="noopener noreferrer" data-return-to-trust-ops>Return to Trust Ops</a>
            <div class="verification-hint">If this page stays open, tap Return to Trust Ops.</div>
          </div>`;
        const returnLink = slot.querySelector("[data-return-to-trust-ops]");
        if (returnLink) {
          returnLink.addEventListener("click", (event) => {
            event.preventDefault();
            returnToTrustOps(token, redirectUrl);
          });
        }
      }

      function closePopupSoon() {
        window.setTimeout(() => {
          try {
            window.close();
          } catch (error) {}
        }, 200);
      }

      function returnToTrustOps(token, redirectUrl) {
        const opener = window.opener;
        if (opener) {
          try {
            opener.location.replace(redirectUrl);
            closePopupSoon();
            return;
          } catch (error) {}
          try {
            opener.postMessage({
              type: "trust-ops-auth",
              token,
              app_name: state.appName,
              return_url: state.returnUrl
            }, returnUrlOrigin() || "*");
            closePopupSoon();
            return;
          } catch (error) {}
        }
        window.location.replace(redirectUrl);
      }

      function finishAuth(token) {
        const redirectUrl = buildReturnUrl(token);
        if (!redirectUrl) {
          return;
        }
        state.credential = token;
        window.name = JSON.stringify({
          trust_ops_token: token,
          app_name: state.appName,
          ts: Date.now()
        });
        setError("");
        setStatus("Verification complete. Returning to Trust Ops...");
        renderReturnStep(token);
        if (!state.returning) {
          state.returning = true;
          window.setTimeout(() => returnToTrustOps(token, redirectUrl), 180);
        }
      }

      function handleCredentialResponse(response) {
        const token = response?.credential || "";
        if (!token) {
          setError("Google Sign-In did not return an ID token.");
          return;
        }
        if (!state.returnUrl) {
          setError("Open this page from Trust Ops again.");
          return;
        }
        finishAuth(token);
      }

      function renderButton() {
        const slot = document.getElementById("google-signin-button");
        slot.innerHTML = "";
        if (!state.clientId || !state.returnUrl) {
          slot.innerHTML = "<div class=\"verification-hint\">Open this page from Trust Ops again.</div>";
          return;
        }
        if (!window.google || !google.accounts || !google.accounts.id) {
          slot.innerHTML = "<div class=\"verification-hint\">Loading Google Sign-In...</div>";
          setTimeout(renderButton, 100);
          return;
        }
        if (!state.initialized) {
          google.accounts.id.initialize({
            client_id: state.clientId,
            callback: handleCredentialResponse,
            auto_select: false,
            cancel_on_tap_outside: false
          });
          state.initialized = true;
        }
        google.accounts.id.renderButton(slot, {
          theme: "outline",
          size: "large",
          shape: "pill",
          text: "signin_with",
          logo_alignment: "left"
        });
      }

      function boot() {
        renderButton();
      }

      window.addEventListener("load", boot);
    </script>
  </body>
</html>
