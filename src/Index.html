      document.addEventListener("click", async (event) => {
        if (event.target.classList?.contains("modal-backdrop")) {
          closeTopModal();
          return;
        }
        const permissionGroupViewToggle = event.target.closest("[data-action='toggle-permission-group-view']");
        if (permissionGroupViewToggle) {
          const form = permissionGroupViewToggle.closest('[data-form="user"]');
          const section = form ? permissionGroupSection(form, permissionGroupViewToggle.dataset.permissionGroupKey) : null;
          if (section) {
            const body = section.querySelector("[data-permission-group-body]");
            setPermissionGroupExpanded(section, Boolean(body && body.hidden));
          }
          return;
        }
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          state.tab = tabButton.dataset.tab;
          state.status = "";
          render();
          return;
        }
        const settingsButton = event.target.closest("[data-settings-section]");
        if (settingsButton) {
          state.settingsSection = settingsButton.dataset.settingsSection;
          saveStoredString("settingsSection", state.settingsSection);
          render();
          return;
        }
        const sortButton = event.target.closest("[data-sort-table]");
        if (sortButton) {
          closeActionMenus();
          setTableSort(sortButton.dataset.sortTable, sortButton.dataset.sortColumn, sortButton.dataset.sortDirection || "asc");
          render();
          return;
        }
        const boardGroupToggle = event.target.closest("[data-board-group-key]");
        if (boardGroupToggle) {
          closeActionMenus();
          const key = boardGroupToggle.dataset.boardGroupKey;
          setBoardGroupExpanded(key, !isBoardGroupExpanded(key));
          render();
          return;
        }
        const projectNodeToggle = event.target.closest("[data-project-id][data-action='toggle-project-node']");
        if (projectNodeToggle) {
          closeActionMenus();
          const projectId = projectNodeToggle.dataset.projectId;
          setProjectNodeExpanded(projectId, !isProjectNodeExpanded(projectId));
          render();
          return;
        }
        const taskNodeToggle = event.target.closest("[data-task-id][data-action='toggle-task-node']");
        if (taskNodeToggle) {
          closeActionMenus();
          const taskId = taskNodeToggle.dataset.taskId;
          const tableKey = taskNodeToggle.closest("[data-task-table-key]")?.dataset.taskTableKey || "board";
          setTaskNodeExpanded(tableKey, taskId, !isTaskNodeExpanded(tableKey, taskId));
          render();
          return;
        }
        const actionElement = event.target.closest("[data-action]");
        const action = actionElement?.dataset.action;
        const actionPopoverSurface = event.target.closest("[data-action-popover-floating], [data-action-popover]");
        const actionPopoverStackSource = actionPopoverSurface?.dataset.stackSource || actionPopoverSurface?.closest(".modal-backdrop")?.dataset.stackSource || "";
        const actionMenuTrigger = event.target.closest("[data-action-menu-trigger]");
        if (actionMenuTrigger) {
          const menu = actionMenuTrigger.closest("[data-action-popover]");
          if (menu) {
            toggleActionPopover(menu);
          }
          return;
        }
        if (!isInsideActiveActionPopover(event.target)) {
          closeActionMenus();
        }
        if (!action) return;
        try {
          closeActionMenus();
          if (action === "sign-out") {
            signOut();
            return;
          }
          if (action === "close-modal") {
            state.pendingCategorySave = null;
            state.pendingMigrationImport = null;
            closeTopModal();
          } else if (action === "toggle-settings-sidebar") {
            state.settingsSidebarCollapsed = !state.settingsSidebarCollapsed;
            saveStoredBool("settingsSidebarCollapsed", state.settingsSidebarCollapsed);
            render();
          } else if (action === "toggle-sidebar") {
            const key = event.target.closest("[data-sidebar-key]")?.dataset.sidebarKey;
            if (key && key in state) {
              state[key] = !state[key];
              saveStoredBool(key, state[key]);
              render();
            }
          } else if (action === "toggle-organization-group") {
            state.settingsGroupOpen = !state.settingsGroupOpen;
            saveStoredBool("settingsGroupOpen", state.settingsGroupOpen);
            render();
          } else if (action === "new-task") {
            openTaskModal();
          } else if (action === "new-subtask") {
            openTaskModal(null, { parentTaskId: event.target.closest("[data-task-id]").dataset.taskId });
          } else if (action === "save-board-view") {
            openBoardViewModal();
          } else if (action === "clear-board-filters") {
            state.boardFilters = {};
            state.boardGrouping = "";
            state.selectedBoardViewId = "";
            state.boardGroupExpanded = {};
            render();
          } else if (action === "delete-board-view") {
            const view = selectedBoardView();
            if (view) openConfirmModal(`Delete saved view "${view["View Name"]}"?`, "confirm-delete-board-view", "data-board-view-id", view["Board View ID"]);
          } else if (action === "confirm-delete-board-view") {
            await callServer("archiveBoardView", event.target.closest("[data-board-view-id]").dataset.boardViewId);
            state.selectedBoardViewId = "";
            clearModals();
            await refreshBoardData("Board view deleted.");
          } else if (action === "refresh-project-dashboard") {
            await refreshProjectDashboardData("Project dashboard refreshed.");
          } else if (action === "toggle-project-tasks") {
            state.projectTasksExpanded = !state.projectTasksExpanded;
            saveStoredBool("projectTasksExpanded", state.projectTasksExpanded);
            render();
          } else if (action === "select-project-dashboard") {
            state.projectFilters.projectId = event.target.closest("[data-project-id]").dataset.projectId;
            await refreshProjectDashboardData("Project selected.");
          } else if (action === "clear-project-filter") {
            state.projectFilters.projectId = "";
            await refreshProjectDashboardData("Project selection cleared.");
          } else if (action === "archive-project-dashboard") {
            openConfirmModal("Archive this project?", "confirm-archive-project-dashboard", "data-project-id", event.target.closest("[data-project-id]").dataset.projectId);
          } else if (action === "confirm-archive-project-dashboard") {
            await callServer("archiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            clearModals();
            await refreshData({ message: "Project archived." });
          } else if (action === "unarchive-project") {
            await callServer("unarchiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            await refreshData({ message: "Project restored." });
          } else if (action === "edit-task") {
            const task = state.data.tasks.find((item) => item["Task ID"] === event.target.closest("[data-task-id]").dataset.taskId);
            openTaskModal(task);
          } else if (action === "delete-task") {
            openConfirmModal("Delete this task? Existing audit history will be preserved.", "confirm-delete-task", "data-task-id", event.target.closest("[data-task-id]").dataset.taskId);
          } else if (action === "confirm-delete-task") {
            await callServer("archiveTask", event.target.closest("[data-task-id]").dataset.taskId);
            clearModals();
            await refreshBoardData("Task deleted.");
          } else if (action === "complete-task") {
            await callServer("completeTask", event.target.closest("[data-task-id]").dataset.taskId);
            await refreshBoardData("Task completed.");
        } else if (action === "add-time") {
            const taskId = event.target.closest("[data-task-id]").dataset.taskId;
            state.tab = "time";
            render();
            const taskSelect = document.querySelector('[name="taskId"]');
            if (taskSelect) taskSelect.value = taskId;
          } else if (action === "view-project-user-entries") {
            const button = event.target.closest("[data-project-id][data-user-key]");
            const projectId = button?.dataset.projectId || "";
            const selectedProject = state.data.projectDashboard?.selectedProject;
            if (selectedProject && String(selectedProject.project?.["Project ID"] || "") === String(projectId)) {
              openProjectEntriesModal(selectedProject, {
                userId: button.dataset.userId || "",
                userKey: button.dataset.userKey || button.dataset.userId || "",
                userLabel: button.dataset.userLabel || ""
              });
            }
          } else if (action === "edit-time") {
            const entryId = event.target.closest("[data-entry-id]").dataset.entryId;
            const inProjectEntriesModal = actionPopoverStackSource === "project-entries" || Boolean(event.target.closest("[data-project-entries-modal='true']"));
            const sourceEntries = inProjectEntriesModal
              ? (state.data.projectDashboard?.selectedProject?.entries || [])
              : (state.data.tracker.entries || []);
            const entry = sourceEntries.find((item) => item["Time Entry ID"] === entryId) || (state.data.tracker.entries || []).find((item) => item["Time Entry ID"] === entryId);
            if (!entry) return;
            openTimeModal(entry, inProjectEntriesModal ? { stack: true, stackSource: "project-entries" } : {});
          } else if (action === "delete-time") {
            const entryId = event.target.closest("[data-entry-id]").dataset.entryId;
            const inProjectEntriesModal = actionPopoverStackSource === "project-entries" || Boolean(event.target.closest("[data-project-entries-modal='true']"));
            openConfirmModal(
              "Delete this time entry?",
              "confirm-delete-time",
              "data-entry-id",
              entryId,
              "Delete",
              "Confirm Delete",
              inProjectEntriesModal ? { stack: true, stackSource: "project-entries" } : {}
            );
          } else if (action === "confirm-delete-time") {
            const confirmModal = event.target.closest(".modal-backdrop");
            const stackSource = confirmModal?.dataset.stackSource || "";
            const entryId = event.target.closest("[data-entry-id]").dataset.entryId;
            const result = await callServer("deleteTimeEntry", {
              timeEntryId: entryId,
              overrideReason: state.data.permissions.canOverrideLockedPeriod ? "Deleted by permitted user from Time Tracker" : "",
              requestReason: "Delete requested from Time Tracker"
            });
            if (stackSource === "project-entries") {
              closeTopModal();
              if (result.requestCreated) {
                setStatus("Time entry deleted or request created.");
              } else {
                await refreshProjectDashboardData("Time entry deleted or request created.");
                if (state.projectEntriesModal) {
                  const projectDetail = state.data.projectDashboard?.selectedProject;
                  if (projectDetail) {
                    openProjectEntriesModal(projectDetail, state.projectEntriesModal);
                  }
                }
              }
            } else {
              clearModals();
              await refreshTrackerData("Time entry deleted or request created.");
            }
          } else if (action === "lock-period") {
            const periodId = state.data.paySummary?.payPeriod?.["Pay Period ID"];
            const saved = await callServer("lockPayPeriod", periodId);
            state.data.payPeriods = (state.data.payPeriods || []).map((period) => period["Pay Period ID"] === saved["Pay Period ID"] ? saved : period);
            await refreshPaySummaryData("Pay period locked.");
          } else if (action === "unlock-period") {
            const periodId = state.data.paySummary?.payPeriod?.["Pay Period ID"];
            const saved = await callServer("unlockPayPeriod", periodId);
            state.data.payPeriods = (state.data.payPeriods || []).map((period) => period["Pay Period ID"] === saved["Pay Period ID"] ? saved : period);
            await refreshPaySummaryData("Pay period unlocked.");
          } else if (action === "approve-time-request") {
            await callServer("approveTimeEditRequest", event.target.closest("[data-request-id]").dataset.requestId, "Approved in Time Tracker");
            await refreshTrackerData("Request approved.");
          } else if (action === "reject-time-request") {
            await callServer("rejectTimeEditRequest", event.target.closest("[data-request-id]").dataset.requestId, "Rejected in Time Tracker");
            await refreshTrackerData("Request rejected.");
          } else if (action === "remove-profile-image") {
            openConfirmModal("Remove this profile image? This will delete the uploaded file if one exists.", "confirm-remove-profile-image", "data-user-id", state.data.currentUser["User ID"], "Remove", "Confirm Remove");
          } else if (action === "confirm-remove-profile-image") {
            await callServer("removeProfileImage", event.target.closest("[data-user-id]").dataset.userId);
            clearModals();
            await refreshData({ message: "Profile image removed." });
          } else if (action === "new-user") {
            openUserModal();
          } else if (action === "edit-user") {
            openUserModal(state.data.users.find((user) => user["User ID"] === event.target.closest("[data-user-id]").dataset.userId));
          } else if (action === "delete-user") {
            openConfirmModal("Archive this user?", "confirm-delete-user", "data-user-id", event.target.closest("[data-user-id]").dataset.userId);
          } else if (action === "confirm-delete-user") {
            await callServer("archiveUser", event.target.closest("[data-user-id]").dataset.userId);
            clearModals();
            await refreshData({ message: "User archived." });
          } else if (action === "new-project") {
            openProjectModal();
          } else if (action === "edit-project") {
            openProjectModal(state.data.projects.find((project) => project["Project ID"] === event.target.closest("[data-project-id]").dataset.projectId));
          } else if (action === "edit-project-dashboard") {
            openProjectModal(state.data.projects.find((project) => project["Project ID"] === event.target.closest("[data-project-id]").dataset.projectId));
          } else if (action === "new-subproject") {
            openProjectModal(null, { parentProjectId: event.target.closest("[data-project-id]").dataset.projectId });
          } else if (action === "edit-project-task") {
            const taskId = event.target.closest("[data-task-id]").dataset.taskId;
            const selectedProject = state.data.projectDashboard?.selectedProject;
            const task = (selectedProject?.tasks || []).find((item) => item["Task ID"] === taskId) || state.data.tasks.find((item) => item["Task ID"] === taskId);
            if (task) openTaskModal(task);
          } else if (action === "delete-project") {
            openConfirmModal("Archive this project?", "confirm-delete-project", "data-project-id", event.target.closest("[data-project-id]").dataset.projectId);
          } else if (action === "confirm-delete-project") {
            await callServer("archiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            clearModals();
            await refreshData({ message: "Project archived." });
          } else if (action === "new-category") {
            openCategoryModal();
          } else if (action === "edit-category") {
            openCategoryModal(state.data.categories.find((category) => category["Category ID"] === event.target.closest("[data-category-id]").dataset.categoryId));
          } else if (action === "delete-category") {
            openConfirmModal("Archive this category?", "confirm-delete-category", "data-category-id", event.target.closest("[data-category-id]").dataset.categoryId);
          } else if (action === "confirm-delete-category") {
            await callServer("archiveCategory", event.target.closest("[data-category-id]").dataset.categoryId);
            clearModals();
            await refreshData({ message: "Category archived." });
          } else if (action === "new-tag") {
            openTagModal();
          } else if (action === "new-tag-from-task") {
            openTagModal(null, { stack: true, returnToTask: true, prefill: event.target.closest("[data-tag-name]").dataset.tagName });
            setTimeout(() => document.querySelector('#modal-root .modal-backdrop:last-child [name="tag"]')?.focus(), 0);
          } else if (action === "add-tag-selection") {
            const picker = event.target.closest("[data-tag-picker]");
            const hidden = picker.querySelector('input[name="tags"]');
            const selected = selectedList(hidden.value);
            const tagName = event.target.closest("[data-tag-name]").dataset.tagName;
            if (selected.indexOf(tagName) === -1) selected.push(tagName);
            hidden.value = selected.join(", ");
            picker.querySelector("[data-tag-search]").value = "";
            updateTagPicker(picker);
          } else if (action === "remove-tag-selection") {
            const picker = event.target.closest("[data-tag-picker]");
            const hidden = picker.querySelector('input[name="tags"]');
            const tagName = event.target.closest("[data-tag-name]").dataset.tagName;
            hidden.value = selectedList(hidden.value).filter((item) => item !== tagName).join(", ");
            updateTagPicker(picker);
          } else if (action === "edit-tag") {

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function cropProfileImage(file, maxSize = 512) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const image = new Image();
            image.onload = () => {
              const size = Math.min(maxSize, image.width, image.height);
              const canvas = document.createElement("canvas");
              canvas.width = size;
              canvas.height = size;
              const context = canvas.getContext("2d");
              const sourceSize = Math.min(image.width, image.height);
              const sourceX = Math.floor((image.width - sourceSize) / 2);
              const sourceY = Math.floor((image.height - sourceSize) / 2);
              context.fillStyle = "#ffffff";
              context.fillRect(0, 0, size, size);
              context.drawImage(image, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);
              resolve(canvas.toDataURL("image/jpeg", 0.9));
            };
            image.onerror = reject;
            image.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error);
          reader.readAsText(file);
        });
      }

      function parseLegacyCsv(text) {
        const rows = [];
        const currentRow = [];
        let currentValue = "";
        let inQuotes = false;
        const source = String(text || "").replace(/\uFEFF/g, "");
        for (let index = 0; index < source.length; index += 1) {
          const char = source[index];
          const next = source[index + 1];
          if (inQuotes) {
            if (char === '"' && next === '"') {
              currentValue += '"';
              index += 1;
            } else if (char === '"') {
              inQuotes = false;
            } else {
              currentValue += char;
            }
            continue;
          }
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentValue);
            currentValue = "";
          } else if (char === '\n') {
            currentRow.push(currentValue);
            if (currentRow.some((cell) => String(cell || "").trim())) rows.push(currentRow.slice());
            currentRow.length = 0;
            currentValue = "";
          } else if (char !== '\r') {
            currentValue += char;
          }
        }
        currentRow.push(currentValue);
        if (currentRow.some((cell) => String(cell || "").trim())) rows.push(currentRow.slice());
        if (!rows.length) return [];
        const headers = rows.shift().map((header) => String(header || "").trim());
        return rows
          .filter((row) => row.some((cell) => String(cell || "").trim()))
          .map((row, index) => {
            const record = { _rowNumber: index + 2 };
            headers.forEach((header, headerIndex) => {
              if (!header) return;
              record[header] = row[headerIndex] !== undefined ? row[headerIndex] : "";
            });
            return record;
          });
      }

      function normalizeLegacySheetName(name) {
        const key = String(name || "").toLowerCase().replace(/[^a-z]/g, "");
        const map = {
          assignmentboard: "Assignment Board",
          timelog: "Time Log",
          paysummary: "Pay Summary",
          projects: "Projects",
          users: "Users",
          timecategories: "Time Categories",
          prioritylist: "Priority List",
          tags: "Tags",
          importedtasks: "Imported Tasks"
        };
        return map[key] || String(name || "").replace(/\.csv$/i, "").trim();
      }

      async function buildLegacyMigrationPayload(form) {
        const sourceType = form.sourceType.value;
        if (sourceType === "sheet") {
          return {
            sourceType: "sheet",
            spreadsheetId: String(form.spreadsheetId.value || "").trim(),
            importMode: form.importMode.value
          };
        }
        const files = Array.from(form.legacyFiles?.files || []);
        if (!files.length) {
          throw new Error("Select at least one CSV file.");
        }
        const tables = {};
        for (const file of files) {
          const rows = parseLegacyCsv(await readFileAsText(file));
          tables[normalizeLegacySheetName(file.name)] = rows;
        }
        return {
          sourceType: "csv",
          tables,
          importMode: form.importMode.value
        };
      }

            form.reset();
            clearModals();
            await refreshData({ message: "Category saved." });
          } else if (formType === "migration") {
            const payload = await buildLegacyMigrationPayload(form);
            const preview = await callServer("getLegacyMigrationPreview", payload);
            const duplicates = preview.duplicates || [];
            if (payload.importMode !== "overwrite" && duplicates.length) {
              openLegacyDuplicateReview(preview, payload);
              return;
            }
            if (payload.importMode === "overwrite") {
              state.pendingMigrationImport = { payload, preview };
              openConfirmModal("Overwrite existing canonical data with the imported data? The original owner row will be preserved.", "confirm-legacy-import", "data-pending-import", "true", "Overwrite", "Confirm Overwrite");
              return;
            }
            const result = await callServer("importLegacyWorkbook", payload);
            const summary = `Imported legacy data: ${result.projects.created + result.projects.updated} projects, ${result.users.created + result.users.updated} users, ${result.tags.imported || (result.tags.created + result.tags.updated)} tags, ${result.tasks.created + result.tasks.updated} tasks, ${result.timeEntries.created + result.timeEntries.updated} time entries, ${result.paySummaries.created + result.paySummaries.updated} pay summaries.`;
            clearModals();
            await refreshData({ message: summary });
          } else if (formType === "tag") {
            const savedTag = await callServer("saveTag", {
              tagId: form.tagId.value,
              tag: form.tag.value,
              color: form.color.value,
              description: form.description.value,
              active: form.active.checked
            });
            upsertLocalTag(savedTag);
            if (form.dataset.returnToTask === "true") {
              closeTopModal();
              const picker = document.querySelector("[data-tag-picker]");
              if (picker) {
                const hidden = picker.querySelector('input[name="tags"]');
                const selected = selectedList(hidden.value);
                if (selected.indexOf(savedTag.Tag) === -1) selected.push(savedTag.Tag);
                hidden.value = selected.join(", ");
                updateTagPicker(picker);
                picker.querySelector("[data-tag-search]")?.focus();
              }
              setStatus("Tag saved.");
            } else {
              clearModals();
              await refreshData({ message: "Tag saved." });
            }
          } else if (formType === "setting") {
            await callServer("saveSetting", {
              key: form.key.value,
              value: form.value.value,
              description: form.description.value
            });
            form.reset();
            await refreshData({ message: "Setting saved." });
          } else if (formType === "explicit-settings") {
            await callServer("saveSetting", {
              key: "PAY_PERIOD_ANCHOR_DATE",
              value: form.anchorDate.value,
              description: "Known start date for the repeating pay-period calendar."
            });
            await callServer("saveSetting", {
              key: "DEFAULT_PAY_PERIOD_DAYS",
              value: form.periodDays.value,
              description: "Number of calendar days in each pay period."
            });
            const statusColors = {};
            Array.from(form.querySelectorAll('[name^="statusColor__"]')).forEach((input) => {
              const status = input.name.replace("statusColor__", "");
              statusColors[status] = normalizeHex(input.value, "#647181");
            });
            await callServer("saveSetting", {
              key: "TASK_STATUS_COLORS_JSON",
              value: JSON.stringify(statusColors),
              description: "Hex colors used for Assignment Board task status badges."
            });
            const projectStatusColors = {};
            Array.from(form.querySelectorAll('[name^="projectStatusColor__"]')).forEach((input) => {
              const status = input.name.replace("projectStatusColor__", "");
              projectStatusColors[status] = normalizeHex(input.value, "#647181");
            });
            await callServer("saveSetting", {
              key: "PROJECT_STATUS_COLORS_JSON",
              value: JSON.stringify(projectStatusColors),
              description: "Hex colors used for project status badges."
            });
            await refreshData({ message: "Settings saved." });
          }
        } catch (error) {
          setStatus(error.message || String(error));
        }
      });

      window.addEventListener("resize", syncStickyOffsets);
      window.addEventListener("error", (event) => {
        if (!event || !event.error) return;
        showFatalError(event.error.message || String(event.error));
      });
      window.addEventListener("unhandledrejection", (event) => {
        showFatalError(event.reason?.message || String(event.reason || "Unhandled promise rejection"));
      });
      window.setTimeout(() => {
        if (state.auth.loading && !state.data) {
          showFatalError("Trust Ops is still waiting for the Apps Script backend.");
        }
      }, 10000);
      loadInitial().catch((error) => {
        showFatalError(error.message || String(error));
      });
    </script>
  </body>
</html>
