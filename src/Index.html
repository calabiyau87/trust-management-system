<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-muted: #eef2f5;
        --table-head: #e8edf2;
        --text: #17202a;
        --muted: #647181;
        --border: #d7dee6;
        --accent: #1f6f68;
        --accent-strong: #174f4a;
        --danger: #a23a3a;
        --warning: #9a6a16;
        --ok: #2f7351;
        --shadow: 0 8px 24px rgba(21, 34, 50, 0.08);
      }

      body[data-theme="dark"] {
        --bg: #101417;
        --surface: #171d22;
        --surface-muted: #222b31;
        --table-head: #202930;
        --text: #edf2f7;
        --muted: #a4b0bd;
        --border: #34414b;
        --accent: #48a095;
        --accent-strong: #66b9ae;
        --danger: #e07b7b;
        --warning: #e7bd63;
        --ok: #76c79b;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 Arial, Helvetica, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        padding: 8px 11px;
      }

      button:hover {
        border-color: #aab7c4;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      button.danger {
        color: var(--danger);
        border-color: #d9b6b6;
      }

      button.link {
        border: 0;
        background: transparent;
        padding: 4px 6px;
        color: var(--accent);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        padding: 8px 10px;
      }

      textarea {
        min-height: 86px;
        resize: vertical;
      }

      input[type="checkbox"] {
        width: auto;
        min-height: auto;
      }

      input[type="color"] {
        width: 46px;
        min-height: 38px;
        padding: 4px;
      }

      input[type="file"] {
        padding: 6px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        background: #173b36;
        color: #fff;
        font-weight: 800;
      }

      .brand h1 {
        margin: 0;
        font-size: 17px;
      }

      .brand p,
      .user-chip {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      header > .user-chip:not(.user-chip-current) {
        display: none;
      }

      nav {
        display: flex;
        gap: 6px;
        padding: 10px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }

      nav button {
        white-space: nowrap;
        border-color: transparent;
        background: transparent;
      }

      nav button.active {
        background: var(--surface-muted);
        border-color: var(--border);
      }

      main {
        padding: 18px 22px 32px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 20px;
      }

      .toolbar p {
        margin: 3px 0 0;
        color: var(--muted);
      }

      .filters,
      .form-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .form-grid.two {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 14px;
        margin-bottom: 14px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 10px 9px;
        text-align: left;
        vertical-align: top;
        word-break: break-word;
      }

      th {
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
        background: var(--table-head);
      }

      table {
        width: 100%;
        table-layout: fixed;
      }

      .board-table th:nth-child(1) { width: 30%; }
      .board-table th:nth-child(2) { width: 12%; }
      .board-table th:nth-child(3) { width: 18%; }
      .board-table th:nth-child(4) { width: 16%; }
      .board-table th:nth-child(5) { width: 10%; }
      .board-table th:nth-child(6) { width: 10%; }
      .board-table th:nth-child(7) { width: 4%; }

      .time-table th:nth-child(1) { width: 34%; }
      .time-table th:nth-child(2) { width: 20%; }
      .time-table th:nth-child(3) { width: 8%; }
      .time-table th:nth-child(4) { width: 24%; }
      .time-table th:nth-child(5) { width: 14%; }

      .pay-table th:nth-child(1) { width: 22%; }
      .pay-table th:nth-child(2) { width: 14%; }
      .pay-table th:nth-child(3) { width: 16%; }
      .pay-table th:nth-child(4) { width: 18%; }
      .pay-table th:nth-child(5) { width: 15%; }
      .pay-table th:nth-child(6) { width: 15%; }

      .project-dashboard-table th:nth-child(1) { width: 20%; }
      .project-dashboard-table th:nth-child(2) { width: 12%; }
      .project-dashboard-table th:nth-child(3) { width: 12%; }
      .project-dashboard-table th:nth-child(4) { width: 12%; }
      .project-dashboard-table th:nth-child(5) { width: 12%; }
      .project-dashboard-table th:nth-child(6) { width: 12%; }
      .project-dashboard-table th:nth-child(7) { width: 20%; }

      tr:last-child td {
        border-bottom: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        color: var(--text);
        background: var(--surface-muted);
        font-size: 12px;
      }

      .person-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid transparent;
        background: var(--surface-muted);
        color: var(--text);
        font-size: 12px;
        white-space: nowrap;
      }

      .person-chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge.high,
      .badge.urgent {
        color: var(--warning);
        border-color: #ecd7a8;
        background: #fff8e8;
      }

      .badge.complete {
        color: var(--ok);
        border-color: #bbdac9;
        background: #edf8f2;
      }

      body[data-theme="dark"] .badge.high,
      body[data-theme="dark"] .badge.urgent {
        border-color: rgba(231, 189, 99, 0.34);
        background: rgba(231, 189, 99, 0.12);
      }

      body[data-theme="dark"] .badge.complete {
        border-color: rgba(118, 199, 155, 0.34);
        background: rgba(118, 199, 155, 0.12);
      }

      .chip-list,
      .checkbox-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .checkbox-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 400;
      }

      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
      }

      .avatar {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        overflow: hidden;
        font-size: 11px;
        font-weight: 800;
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .user-cell,
      .profile-preview {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .color-field {
        display: grid;
        grid-template-columns: 46px minmax(110px, 1fr);
        gap: 8px;
        align-items: center;
      }

      .swatch {
        display: inline-block;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        border: 1px solid var(--border);
        vertical-align: middle;
      }

      .tag-picker {
        display: grid;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }

      .tag-option-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-remove {
        border: 0;
        background: transparent;
        padding: 0 0 0 5px;
        color: inherit;
      }

      .pay-row {
        cursor: pointer;
      }

      .pay-row:hover {
        background: var(--surface-muted);
      }

      .group-heading {
        margin: 14px 0 8px;
        padding: 8px 10px;
        border-radius: 7px;
        background: var(--surface-muted);
        color: var(--text);
        font-weight: 800;
      }

      .settings-layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 14px;
      }

      .side-pane {
        display: grid;
        gap: 6px;
        align-self: start;
      }

      .side-pane button {
        text-align: left;
      }

      .side-pane button.active {
        background: var(--surface-muted);
        border-color: var(--accent);
      }

      .empty,
      .loading,
      .error {
        padding: 28px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
      }

      .error {
        color: var(--danger);
        border-color: #dfb7b7;
      }

      .status-line {
        min-height: 22px;
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(16, 24, 32, 0.38);
        z-index: 20;
      }

      .modal-backdrop[data-modal-level="2"] {
        z-index: 30;
        background: rgba(16, 24, 32, 0.24);
      }

      .modal {
        width: min(760px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.22);
        padding: 18px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .modal-header h3 {
        margin: 0;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric-card {
        display: grid;
        gap: 4px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .metric-card strong {
        font-size: 18px;
      }

      .project-dashboard-layout {
        display: grid;
        gap: 14px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .project-summary-row {
        cursor: pointer;
      }

      .project-summary-row:hover {
        background: var(--surface-muted);
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .grouped-day {
        border-top: 1px solid var(--border);
        padding: 12px 0;
      }

      .grouped-day:first-child {
        border-top: 0;
      }

      .day-heading {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 800;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
        gap: 14px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main,
        header,
        nav {
          padding-left: 14px;
          padding-right: 14px;
        }

        .filters,
        .form-grid,
        .form-grid.two,
        .admin-grid,
        .settings-layout {
          grid-template-columns: 1fr;
        }

        .metric-grid,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          border: 1px solid var(--border);
          border-radius: 8px;
          margin-bottom: 10px;
          background: var(--surface);
        }

        td {
          border: 0;
          display: grid;
          grid-template-columns: 110px 1fr;
          gap: 8px;
          padding: 8px 10px;
        }

        td::before {
          content: attr(data-label);
          color: var(--muted);
          font-weight: 800;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading">Loading Trust Ops...</div>
    <div id="modal-root"></div>

    <script>
      const state = {
        tab: "board",
        data: null,
        boardFilters: {},
        boardGrouping: "",
        selectedBoardViewId: "",
        timeFilters: {},
        payFilters: { rangeMode: "current" },
        projectFilters: { rangeMode: "current", includeArchived: false, projectId: "" },
        settingsSection: "profile",
        pendingCategorySave: null,
        status: ""
      };

      function callServer(name, ...args) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(error))
            [name](...args);
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function money(value) {
        return Number(value || 0).toLocaleString(undefined, { style: "currency", currency: "USD" });
      }

      function parseJson(value, fallback = {}) {
        try {
          return JSON.parse(value || "{}") || fallback;
        } catch (error) {
          return fallback;
        }
      }

      function normalizeHex(value, fallback = "#1f6f68") {
        const text = String(value || "").trim();
        return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toLowerCase() : fallback;
      }

      function cssEscape(value) {
        return window.CSS && CSS.escape ? CSS.escape(String(value)) : String(value).replace(/"/g, '\\"');
      }

      function settingMap() {
        return Object.fromEntries((state.data?.settings || []).map((setting) => [setting["Setting Key"], setting["Setting Value"]]));
      }

      function taskStatusColors() {
        return state.data?.visualSettings?.taskStatusColors || {};
      }

      function projectStatusColors() {
        return state.data?.visualSettings?.projectStatusColors || {};
      }

      function badgeStyleForStatus(status) {
        const color = taskStatusColors()[status];
        return color ? ` style="color: ${escapeHtml(color)}; border-color: ${escapeHtml(color)}; background: ${escapeHtml(color)}18;"` : "";
      }

      function badgeStyleForProjectStatus(status) {
        const color = projectStatusColors()[status];
        return color ? ` style="color: ${escapeHtml(color)}; border-color: ${escapeHtml(color)}; background: ${escapeHtml(color)}18;"` : "";
      }

      function initials(name) {
        return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase() || "?";
      }

      function avatarForUser(user, size = "") {
        const color = normalizeHex(user?.["Profile Color"], "#1f6f68");
        const imageUrl = user?.["Profile Image URL"] || user?.["Google Profile Photo URL"] || "";
        const style = `background:${escapeHtml(color)}`;
        return `<span class="avatar ${escapeHtml(size)}" style="${style}" title="${escapeHtml(user?.["Full Name"] || user?.Email || "")}">${imageUrl ? `<img alt="" src="${escapeHtml(imageUrl)}">` : escapeHtml(initials(user?.["Full Name"] || user?.Email))}</span>`;
      }

      function findUser(userId) {
        return (state.data.users || []).find((user) => String(user["User ID"]) === String(userId)) || null;
      }

      function renderColorField(name, value, fallback = "#1f6f68") {
        const color = normalizeHex(value, fallback);
        return `<div class="color-field" data-color-field>
          <input type="color" data-color-wheel="${escapeHtml(name)}" value="${escapeHtml(color)}" aria-label="${escapeHtml(name)} color">
          <input name="${escapeHtml(name)}" data-color-hex="${escapeHtml(name)}" value="${escapeHtml(color)}" pattern="^#[0-9a-fA-F]{6}$" maxlength="7">
        </div>`;
      }

      function renderAssigneeChips(task) {
        const ids = selectedList(task["Assignee User IDs"]);
        const names = selectedList(task.Assignees);
        const chips = ids.length ? ids : names;
        if (!chips.length) return '<span class="badge">Unassigned</span>';
        return `<span class="person-chip-list">${chips.map((assigneeIdOrName, index) => {
          const user = ids.length
            ? findUser(assigneeIdOrName)
            : (state.data.users || []).find((item) =>
                String(item["Full Name"] || "").toLowerCase() === String(assigneeIdOrName || "").toLowerCase() ||
                String(item.Email || "").toLowerCase() === String(assigneeIdOrName || "").toLowerCase()
              ) || null;
          const label = user?.["Full Name"] || names[index] || assigneeIdOrName;
          const color = normalizeHex(user?.["Profile Color"], "#1f6f68");
          return `<span class="person-chip" style="color:${escapeHtml(color)}; border-color:${escapeHtml(color)}; background:${escapeHtml(color)}18;">${escapeHtml(label)}</span>`;
        }).join("")}</span>`;
      }

      function renderProjectStatusBadge(status) {
        return `<span class="badge ${escapeHtml(String(status || "").toLowerCase())}"${badgeStyleForProjectStatus(status)}>${escapeHtml(status || "")}</span>`;
      }

      function options(items, valueKey, labelKey, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (items || []).map((item) => {
          const value = item[valueKey];
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(item[labelKey] || value)}</option>`;
        }).join("");
      }

      function constantOptions(values, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (values || []).map((value) => {
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(value)}</option>`;
        }).join("");
      }

      function selectedList(value) {
        return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
      }

      function renderCheckboxList(name, items, valueKey, labelKey, selectedValues) {
        const selected = new Set(selectedValues || []);
        return `<div class="checkbox-list">${(items || []).map((item) => `
          <label class="checkbox-row">
            <input type="checkbox" name="${escapeHtml(name)}" value="${escapeHtml(item[valueKey])}" ${selected.has(String(item[valueKey])) ? "checked" : ""}>
            <span>${escapeHtml(item[labelKey] || item[valueKey])}</span>
          </label>`).join("")}</div>`;
      }

      function renderIcon(action, idName, idValue, label, symbol, danger = false) {
        return `<button type="button" class="icon-button ${danger ? "danger" : ""}" data-action="${escapeHtml(action)}" ${idName ? `${idName}="${escapeHtml(idValue)}"` : ""} title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}">${symbol}</button>`;
      }

      function setModal(html) {
        document.getElementById("modal-root").innerHTML = html;
      }

      function pushModal(html) {
        const root = document.getElementById("modal-root");
        root.insertAdjacentHTML("beforeend", html);
        Array.from(root.querySelectorAll(".modal-backdrop")).forEach((modal, index) => {
          modal.dataset.modalLevel = String(index + 1);
        });
      }

      function closeTopModal() {
        const modals = document.querySelectorAll("#modal-root .modal-backdrop");
        if (!modals.length) return;
        modals[modals.length - 1].remove();
      }

      function clearModals() {
        document.getElementById("modal-root").innerHTML = "";
      }

      function setStatus(message) {
        state.status = message || "";
        const line = document.querySelector("[data-status-line]");
        if (line) line.textContent = state.status;
      }

      function applyUserPreferences() {
        const user = state.data?.currentUser || {};
        const mode = user["Theme Mode"] || "System";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.body.dataset.theme = mode === "Dark" || (mode === "System" && prefersDark) ? "dark" : "light";
      }

      async function loadInitial() {
        try {
          state.data = await callServer("getInitialData");
          state.timeFilters.userId = state.data.context.userId;
          state.timeFilters.payPeriodId = state.data.currentPayPeriod["Pay Period ID"];
          state.payFilters.userId = state.data.context.userId;
          state.payFilters.rangeMode = "current";
          applyUserPreferences();
          render();
        } catch (error) {
          let diagnostic = null;
          try {
            diagnostic = await callServer("getAuthDiagnostic");
          } catch (diagnosticError) {
            diagnostic = { diagnosticError: diagnosticError.message || String(diagnosticError) };
          }
          document.getElementById("app").innerHTML = `
            <div class="error">
              <strong>Unable to load Trust Ops.</strong><br>
              ${escapeHtml(error.message || error)}
              ${renderAuthDiagnostic(diagnostic)}
            </div>`;
        }
      }

      function renderAuthDiagnostic(diagnostic) {
        if (!diagnostic) return "";
        return `
          <div class="panel" style="margin-top: 14px; box-shadow: none;">
            <h3>Access Diagnostic</h3>
            <div class="table-wrap">
              <table>
                <tbody>
                  <tr><td data-label="Field">Active email</td><td data-label="Value">${escapeHtml(diagnostic.activeEmail || "(blank)")}</td></tr>
                  <tr><td data-label="Field">Effective email</td><td data-label="Value">${escapeHtml(diagnostic.effectiveEmail || "(blank)")}</td></tr>
                  <tr><td data-label="Field">Spreadsheet configured</td><td data-label="Value">${escapeHtml(diagnostic.spreadsheetConfigured)}</td></tr>
                  <tr><td data-label="Field">Sheet access</td><td data-label="Value">${escapeHtml(diagnostic.sheetAccessOk)}</td></tr>
                  <tr><td data-label="Field">User row found</td><td data-label="Value">${escapeHtml(diagnostic.userFound)}</td></tr>
                  <tr><td data-label="Field">User active</td><td data-label="Value">${escapeHtml(diagnostic.userActive)}</td></tr>
                  <tr><td data-label="Field">Stored email</td><td data-label="Value">${escapeHtml(diagnostic.storedEmail || "")}</td></tr>
                  <tr><td data-label="Field">Issue</td><td data-label="Value">${escapeHtml(diagnostic.issue || diagnostic.sheetAccessError || diagnostic.diagnosticError || "")}</td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
      }

      async function refreshData(parts = {}) {
        setStatus("Saving...");
        const payload = {
          taskFilters: state.boardFilters,
          timeFilters: state.timeFilters,
          payFilters: safePayFiltersForRefresh(),
          projectFilters: safeProjectFiltersForRefresh()
        };
        const fresh = await callServer("refreshAppData", payload);
        Object.assign(state.data, fresh);
        applyUserPreferences();
        setStatus(parts.message || "Updated.");
        render();
      }

      async function refreshBoardData(message = "Board updated.") {
        const fresh = await callServer("getBoardData", state.boardFilters);
        Object.assign(state.data, fresh);
        setStatus(message);
        render();
      }

      async function refreshTrackerData(message = "Time tracker refreshed.") {
        state.data.tracker = await callServer("getTrackerData", state.timeFilters);
        setStatus(message);
        render();
      }

      async function refreshPaySummaryData(message = "Pay summary refreshed.") {
        state.data.paySummary = await callServer("getPaySummary", safePayFiltersForRefresh());
        setStatus(message);
        render();
      }

      async function refreshProjectDashboardData(message = "Project dashboard refreshed.") {
        state.data.projectDashboard = await callServer("getProjectDashboard", safeProjectFiltersForRefresh());
        setStatus(message);
        render();
      }

      function upsertLocalTag(tag) {
        const tags = state.data.tags || [];
        const index = tags.findIndex((item) => item["Tag ID"] === tag["Tag ID"]);
        if (index === -1) tags.push(tag);
        else tags[index] = tag;
        tags.sort((a, b) => String(a.Tag).localeCompare(String(b.Tag)));
        state.data.tags = tags;
      }

      function render() {
        const data = state.data;
        if (!data) return;
        applyUserPreferences();
        const tabs = [
          ["board", "Assignment Board"],
          ["projects", "Projects"],
          ["time", "Time Tracker"],
          ["pay", "Pay Summary"]
        ];
        tabs.push(["settings", "Settings"]);
        document.getElementById("app").className = "app-shell";
        document.getElementById("app").innerHTML = `
          <header>
            <div class="brand">
              <div class="brand-mark">TO</div>
              <div>
                <h1>Trust Ops</h1>
                <p>Tasks, time, pay periods, and administration</p>
              </div>
            </div>
            <div class="user-chip user-chip-current">${avatarForUser(data.currentUser)}<span>${escapeHtml(data.context.fullName)} / ${escapeHtml(data.context.role)}</span></div>
          </header>
          <nav>
            ${tabs.map(([id, label]) => `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("")}
          </nav>
          <main>
            <div class="status-line" data-status-line>${escapeHtml(state.status)}</div>
            ${renderActiveTab()}
          </main>
        `;
      }

      function renderActiveTab() {
        if (state.tab === "time") return renderTimeTracker();
        if (state.tab === "pay") return renderPaySummary();
        if (state.tab === "projects") return renderProjectDashboard();
        if (state.tab === "settings") return renderSettings();
        return renderBoard();
      }

      function applyBoardFilters(tasks) {
        const filters = state.boardFilters;
        const search = String(filters.search || "").toLowerCase();
        return (tasks || []).filter((task) => {
          if (filters.status && task.Status !== filters.status) return false;
          if (filters.projectId && task["Project ID"] !== filters.projectId) return false;
          if (filters.priority && task.Priority !== filters.priority) return false;
          if (filters.assigneeUserId && !String(task["Assignee User IDs"] || "").split(",").map((id) => id.trim()).includes(filters.assigneeUserId)) return false;
          if (filters.tag && selectedList(task.Tags).indexOf(filters.tag) === -1) return false;
          if (search) {
            const haystack = [task.Title, task.Notes, task.Status, task.Assignees, task["Project Name"], task.Priority, task.Tags].join(" ").toLowerCase();
            if (!haystack.includes(search)) return false;
          }
          return true;
        });
      }

      function selectedBoardView() {
        return (state.data.boardViews || []).find((view) => String(view["Board View ID"]) === String(state.selectedBoardViewId)) || null;
      }

      function canModifyBoardView(view) {
        if (!view) return false;
        return String(view["Owner User ID"]) === String(state.data.context.userId) || state.data.permissions.canManageBoardViews;
      }

      function buildBoardViewPayload(form) {
        const view = selectedBoardView();
        const canUpdate = canModifyBoardView(view);
        return {
          viewId: canUpdate ? state.selectedBoardViewId : "",
          viewName: form.viewName.value,
          visibility: canUpdate ? form.visibility.value : "Private",
          filters: state.boardFilters,
          grouping: state.boardGrouping
        };
      }

      function groupTaskKey(task) {
        const grouping = state.boardGrouping || "";
        if (grouping === "Status") return task.Status || "No status";
        if (grouping === "Project") return task["Project Name"] || "No project";
        if (grouping === "Assignee") return task.Assignees || "Unassigned";
        if (grouping === "Priority") return task.Priority || "No priority";
        if (grouping === "Tag") return task.Tags || "No tag";
        if (grouping === "Due Week") return task["Due Date"] ? task["Due Date"].slice(0, 10) : "No due date";
        return "";
      }

      function renderBoardResults(tasks) {
        if (!tasks.length) return '<div class="empty">No tasks match the current filters.</div>';
        if (!state.boardGrouping) return renderTaskTable(tasks);
        const grouped = tasks.reduce((acc, task) => {
          const key = groupTaskKey(task);
          acc[key] = acc[key] || [];
          acc[key].push(task);
          return acc;
        }, {});
        return Object.keys(grouped).sort().map((key) => `
          <div class="group-heading">${escapeHtml(key)} &middot; ${grouped[key].length}</div>
          ${renderTaskTable(grouped[key])}
        `).join("");
      }

      function updateBoardResultsOnly() {
        const container = document.getElementById("board-results");
        if (!container) return;
        container.innerHTML = renderBoardResults(applyBoardFilters(state.data.tasks));
      }

      function renderBoard() {
        const data = state.data;
        const tasks = applyBoardFilters(data.tasks);
        const view = selectedBoardView();
        const canDeleteSelectedView = canModifyBoardView(view);
        return `
          <section class="toolbar">
            <div>
              <h2>Assignment Board</h2>
              <p>${tasks.length} visible task${tasks.length === 1 ? "" : "s"}</p>
            </div>
            <div class="actions">
              ${data.permissions.canCreateTask ? renderIcon("new-task", "", "", "New Task", "&#10133;", false) : ""}
              ${renderIcon("save-board-view", "", "", "Save View", "&#128190;")}
              ${canDeleteSelectedView ? renderIcon("delete-board-view", "", "", "Delete saved view", "&#128465;", true) : ""}
              ${renderIcon("clear-board-filters", "", "", "Clear Filters", "&#128269;")}
            </div>
          </section>
          <section class="panel">
            <div class="filters">
              <label>Saved View <select data-action="load-board-view">
                <option value="">Select view</option>
                ${(data.boardViews || []).map((item) => `<option value="${escapeHtml(item["Board View ID"])}" ${String(item["Board View ID"]) === String(state.selectedBoardViewId) ? "selected" : ""}>${escapeHtml(item["View Name"])} (${escapeHtml(item.Visibility)})</option>`).join("")}
              </select></label>
              <label>Search <input data-filter="search" value="${escapeHtml(state.boardFilters.search || "")}" placeholder="Task, notes, tags"></label>
              <label>Status <select data-filter="status">${constantOptions(data.constants.taskStatuses, state.boardFilters.status, true)}</select></label>
              <label>Project <select data-filter="projectId">${options(data.projects, "Project ID", "Project Name", state.boardFilters.projectId, true)}</select></label>
              <label>Assignee <select data-filter="assigneeUserId">${options(data.users, "User ID", "Full Name", state.boardFilters.assigneeUserId, true)}</select></label>
              <label>Priority <select data-filter="priority">${constantOptions(data.constants.priorities, state.boardFilters.priority, true)}</select></label>
              <label>Tag <select data-filter="tag">${options(data.tags || [], "Tag", "Tag", state.boardFilters.tag, true)}</select></label>
              <label>Group By <select data-board-grouping>
                ${constantOptions(["", "Status", "Project", "Assignee", "Priority", "Due Week", "Tag"], state.boardGrouping, false)}
              </select></label>
            </div>
          </section>
          <section class="panel" id="board-results">
            ${renderBoardResults(tasks)}
          </section>
        `;
      }

      function renderTaskTable(tasks) {
        return `
          <div class="table-wrap">
            <table class="board-table">
              <thead>
                <tr>
                  <th>Task</th><th>Status</th><th>Assignees</th><th>Project</th><th>Priority</th><th>Due</th><th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${tasks.map((task) => `
                  <tr>
                    <td data-label="Task">
                      <strong>${escapeHtml(task.Title)}</strong>
                      <div>${escapeHtml(task.Notes || "")}</div>
                      ${task.Tags ? `<span class="badge">${escapeHtml(task.Tags)}</span>` : ""}
                    </td>
                    <td data-label="Status"><span class="badge ${escapeHtml(String(task.Status).toLowerCase())}"${badgeStyleForStatus(task.Status)}>${escapeHtml(task.Status)}</span></td>
                    <td data-label="Assignees">${renderAssigneeChips(task)}</td>
                    <td data-label="Project">${escapeHtml(task["Project Name"])}</td>
                    <td data-label="Priority"><span class="badge ${escapeHtml(String(task.Priority).toLowerCase())}">${escapeHtml(task.Priority)}</span></td>
                    <td data-label="Due">${escapeHtml(task["Due Date"])}</td>
                    <td data-label="Actions">
                      <div class="actions">
                        ${task._permissions?.canComplete && task.Status !== "Complete" ? renderIcon("complete-task", "data-task-id", task["Task ID"], "Complete task", "&#10003;") : ""}
                        ${task._permissions?.canAddTime ? renderIcon("add-time", "data-task-id", task["Task ID"], "Add time", "&#128336;") : ""}
                        ${task._permissions?.canEdit ? renderIcon("edit-task", "data-task-id", task["Task ID"], "Edit task", "&#9998;") : ""}
                        ${task._permissions?.canDelete ? renderIcon("delete-task", "data-task-id", task["Task ID"], "Delete task", "&#128465;", true) : ""}
                      </div>
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderTimeLockFields(period) {
        const locked = String(period?.Locked) === "true" || period?.Status === "Locked";
        if (!locked) return "";
        if (state.data.permissions.canOverrideLockedPeriod) {
          return '<label>Override Reason <input name="overrideReason" placeholder="Required for locked-period override"></label>';
        }
        return '<label>Request Reason <input name="requestReason" placeholder="Required for locked-period request"></label>';
      }

      function findClientPayPeriodForDate(dateValue) {
        const date = String(dateValue || "");
        return (state.data.payPeriods || []).find((period) => date >= String(period["Start Date"]) && date <= String(period["End Date"])) || null;
      }

      function renderTimeTracker() {
        const data = state.data;
        const tracker = data.tracker || {};
        const targetUserId = tracker.targetUserId || state.timeFilters.userId || data.context.userId;
        const canSelectUser = data.permissions.canCreateTimeForAnyUser;
        const entries = tracker.entries || [];
        const totalHours = entries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
        const selectedPeriod = tracker.selectedPayPeriod || data.currentPayPeriod || {};
        const periodLocked = String(selectedPeriod.Locked) === "true" || selectedPeriod.Status === "Locked";
        const selectedUser = (data.users || []).find((user) => user["User ID"] === targetUserId) || data.currentUser;
        const defaultEntryDate = selectedPeriod["Start Date"] || new Date().toISOString().slice(0, 10);
        return `
          <section class="toolbar">
            <div>
              <h2>Time Tracker</h2>
              <p>${entries.length === 1 ? "1 entry" : `${entries.length} entries`} &middot; ${totalHours.toFixed(2)} selected-period hours</p>
            </div>
          </section>
          <section class="panel">
            <div class="filters">
              ${canSelectUser ? `<label>User <select data-time-filter="userId">${options(data.users, "User ID", "Full Name", targetUserId, false)}</select></label>` : `<label>User <input value="${escapeHtml(selectedUser["Full Name"] || data.context.fullName)}" disabled></label>`}
              <label>Entries Period <select data-time-filter="payPeriodId">${options(data.payPeriods, "Pay Period ID", "Pay Period Label", state.timeFilters.payPeriodId, false)}</select></label>
            </div>
          </section>
          <section class="panel">
            <h3>Log Time</h3>
            <form data-form="time-entry" class="stack">
              <div class="form-grid">
                <label>User <input value="${escapeHtml(selectedUser["Full Name"] || data.context.fullName)}" disabled></label>
                <label>Entry Type <select name="entryType">
                  <option value="Task">Task Time</option>
                  <option value="General Time">General Time</option>
                </select></label>
                <label>Date <input name="date" type="date" value="${escapeHtml(defaultEntryDate)}"></label>
                <label>Hours <input name="hours" type="number" min="0.1" max="24" step="0.1" required></label>
              </div>
              <div class="form-grid two" data-time-mode="task">
                <label>Task <select name="taskId">${options(tracker.availableTasks || [], "Task ID", "Title", "", false)}</select></label>
                <label>Notes <input name="notes" placeholder="Optional notes"></label>
              </div>
              <div class="form-grid two hidden" data-time-mode="general">
                <label>Category <select name="categoryId">${options(tracker.categories || [], "Category ID", "Category", "", false)}</select></label>
                <label>Notes <input name="generalNotes" placeholder="Optional notes"></label>
              </div>
              <div data-time-lock-fields>${renderTimeLockFields(periodLocked ? selectedPeriod : null)}</div>
              <div class="actions"><button class="primary" type="submit">Save Time</button></div>
            </form>
          </section>
          <section class="panel">
            <h3>Entries</h3>
            ${entries.length ? renderEntries(entries) : '<div class="empty">No time entries for this selection.</div>'}
            ${tracker.requests?.length ? `<h3>Pending Requests</h3>${renderTimeRequests(tracker.requests)}` : ""}
          </section>
        `;
      }

      function renderEntries(entries) {
        if (state.data.permissions.canViewAllTime) {
          const byUser = entries.reduce((acc, entry) => {
            const key = entry["User Name"] || "Unknown user";
            acc[key] = acc[key] || [];
            acc[key].push(entry);
            return acc;
          }, {});
          return Object.keys(byUser).sort().map((userName) => `
            <div class="group-heading">${escapeHtml(userName)}</div>
            ${renderEntriesByDay(byUser[userName])}
          `).join("");
        }
        return renderEntriesByDay(entries);
      }

      function renderEntriesByDay(entries) {
        const grouped = entries.reduce((acc, entry) => {
          const key = entry.Date || "No date";
          acc[key] = acc[key] || [];
          acc[key].push(entry);
          return acc;
        }, {});
        return Object.keys(grouped).sort().reverse().map((date) => {
          const dayEntries = grouped[date];
          const total = dayEntries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
          return `
            <div class="grouped-day">
              <div class="day-heading"><span>${escapeHtml(date)}</span><span>${total.toFixed(2)} hours</span></div>
              <div class="table-wrap">
                <table class="time-table">
                  <thead><tr><th>Entry</th><th>Project</th><th>Hours</th><th>Pay Period</th><th>Actions</th></tr></thead>
                  <tbody>
                    ${dayEntries.map((entry) => `
                      <tr>
                        <td data-label="Entry"><strong>${escapeHtml(entry["Task / Category"])}</strong><div>${escapeHtml(entry.Notes || "")}</div></td>
                        <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                        <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                        <td data-label="Pay Period">${escapeHtml(entry["Pay Period Label"])}</td>
                        <td data-label="Actions">
                          <div class="actions">
                            ${entry._permissions?.canEdit ? renderIcon("edit-time", "data-entry-id", entry["Time Entry ID"], "Edit time entry", "&#9998;") : ""}
                            ${entry._permissions?.canDelete ? renderIcon("delete-time", "data-entry-id", entry["Time Entry ID"], "Delete time entry", "&#128465;", true) : ""}
                          </div>
                        </td>
                      </tr>`).join("")}
                  </tbody>
                </table>
              </div>
            </div>`;
        }).join("");
      }

      function renderTimeRequests(requests) {
        return `
          <div class="table-wrap">
            <table class="time-table">
              <thead><tr><th>Request</th><th>User</th><th>Pay Period</th><th>Reason</th><th>Actions</th></tr></thead>
              <tbody>${requests.map((request) => `
                <tr>
                  <td data-label="Request">${escapeHtml(request["Request Type"])} &middot; ${escapeHtml(request.Status)}</td>
                  <td data-label="User">${escapeHtml(request["Requested By Name"])}</td>
                  <td data-label="Pay Period">${escapeHtml(request["Pay Period Label"])}</td>
                  <td data-label="Reason">${escapeHtml(request.Reason)}</td>
                  <td data-label="Actions">
                    ${state.data.permissions.canApproveTimeRequests && request.Status === "Pending" ? `
                      ${renderIcon("approve-time-request", "data-request-id", request["Time Edit Request ID"], "Approve", "&#10003;")}
                      ${renderIcon("reject-time-request", "data-request-id", request["Time Edit Request ID"], "Reject", "&#10005;", true)}` : ""}
                  </td>
                </tr>`).join("")}</tbody>
            </table>
          </div>`;
      }

      function rangeOptions(selected) {
        const fixed = [
          ["current", "Current Pay Period"],
          ["last", "Last Pay Period"]
        ];
        const periods = (state.data.payPeriods || []).map((period) => [`period:${period["Pay Period ID"]}`, period["Pay Period Label"]]);
        const ranges = [
          ["this-year", "This Year"],
          ["last-year", "Last Year"],
          ["last-month", "Last Month"],
          ["ytd", "Year to Date"],
          ["custom", "Custom Range"]
        ];
        return fixed.concat(periods, ranges).map(([value, label]) => `<option value="${escapeHtml(value)}" ${String(value) === String(selected) ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
      }

      function payRangeOptions() {
        return rangeOptions(state.payFilters.rangeMode || "current");
      }

      function projectRangeOptions() {
        return rangeOptions(state.projectFilters.rangeMode || "current");
      }

      function buildPayFilters(extra = {}) {
        const rangeMode = state.payFilters.rangeMode || "current";
        const filters = {
          userId: state.payFilters.userId || "",
          rangeMode: rangeMode
        };
        if (rangeMode === "custom") {
          filters.startDate = state.payFilters.startDate || "";
          filters.endDate = state.payFilters.endDate || "";
        }
        return Object.assign(filters, extra);
      }

      function safePayFiltersForRefresh() {
        const filters = buildPayFilters();
        if (filters.rangeMode === "custom" && !(filters.startDate && filters.endDate)) {
          return {
            userId: state.payFilters.userId || "",
            rangeMode: "current"
          };
        }
        return filters;
      }

      function safeProjectFiltersForRefresh() {
        const filters = Object.assign({}, state.projectFilters);
        if (filters.rangeMode === "custom" && !(filters.startDate && filters.endDate)) {
          return {
            projectId: filters.projectId || "",
            includeArchived: Boolean(filters.includeArchived),
            rangeMode: "current"
          };
        }
        return filters;
      }

      function renderPaySummary() {
        const data = state.data;
        const summary = data.paySummary || { summaries: [] };
        const range = summary.range || {};
        const selectedPeriodId = summary.payPeriod?.["Pay Period ID"] || "";
        return `
          <section class="toolbar">
            <div>
              <h2>Pay Summary</h2>
              <p>${escapeHtml(range.label || summary.payPeriod?.["Pay Period Label"] || "")} ${summary.payPeriod ? (summary.locked ? "&middot; Locked" : "&middot; Open") : ""}</p>
            </div>
            <div class="actions">
              ${selectedPeriodId && data.permissions.canLockPayPeriod && !summary.locked ? renderIcon("lock-period", "", "", "Lock period", "&#128274;") : ""}
              ${selectedPeriodId && data.permissions.canUnlockPayPeriod && summary.locked ? renderIcon("unlock-period", "", "", "Unlock period", "&#128275;") : ""}
            </div>
          </section>
          <section class="panel">
            <div class="filters">
              ${data.permissions.canViewAllPay ? `<label>User <select data-pay-filter="userId">${options(data.users, "User ID", "Full Name", state.payFilters.userId, true)}</select></label>` : ""}
              <label>Range <select data-pay-filter="rangeMode">${payRangeOptions()}</select></label>
              ${state.payFilters.rangeMode === "custom" ? `
                <label>Start Date <input type="date" data-pay-filter="startDate" value="${escapeHtml(state.payFilters.startDate || "")}"></label>
                <label>End Date <input type="date" data-pay-filter="endDate" value="${escapeHtml(state.payFilters.endDate || "")}"></label>` : ""}
            </div>
          </section>
          <section class="panel">
            ${summary.summaries?.length ? `
              <div class="table-wrap">
                <table class="pay-table">
                  <thead><tr><th>User</th><th>Total Hours</th><th>Pay Type</th><th>Rate/Salary</th><th>Effective Hourly</th><th>Gross Pay</th></tr></thead>
                  <tbody>
                    ${summary.summaries.map((row) => `
                      <tr class="pay-row" data-action="open-pay-detail" data-user-id="${escapeHtml(row["User ID"])}">
                        <td data-label="User"><span class="user-cell">${avatarForUser(findUser(row["User ID"]) || row)}${escapeHtml(row["User Name"])}</span></td>
                        <td data-label="Total Hours">${escapeHtml(row["Total Hours"])}</td>
                        <td data-label="Pay Type">${escapeHtml(row["Pay Type"])}</td>
                        <td data-label="Rate/Salary">${row["Pay Type"] === "Hourly" ? money(row["Hourly Rate"]) + "/hr" : money(row["Salary Amount"])}</td>
                        <td data-label="Effective Hourly">${row["Effective Hourly Rate"] ? money(row["Effective Hourly Rate"]) + "/hr" : "N/A"}</td>
                        <td data-label="Gross Pay"><strong>${money(row["Gross Pay"])}</strong></td>
                      </tr>`).join("")}
                  </tbody>
                </table>
              </div>` : '<div class="empty">No pay summary rows for this selection.</div>'}
          </section>
        `;
      }

      function renderProjectDashboard() {
        const data = state.data;

      function activeTags() {

      function renderTagPicker(selectedTags) {
        const selected = selectedTags || [];
        return `<div class="tag-picker" data-tag-picker>
          <input type="hidden" name="tags" value="${escapeHtml(selected.join(", "))}">
          <div class="chip-list" data-tag-chips></div>

          <div class="tag-option-list" data-tag-options></div>
        </div>`;
      }

      function updateTagPicker(picker) {
        const hidden = picker.querySelector('input[name="tags"]');
        const searchInput = picker.querySelector("[data-tag-search]");
        const query = String(searchInput?.value || "").trim().toLowerCase();
        const selected = selectedList(hidden.value);
        picker.querySelector("[data-tag-chips]").innerHTML = selected.map((tag) => `
          <span class="badge">${escapeHtml(tag)}<button type="button" class="chip-remove" data-action="remove-tag-selection" data-tag-name="${escapeHtml(tag)}" title="Remove ${escapeHtml(tag)}" aria-label="Remove ${escapeHtml(tag)}">&times;</button></span>
        `).join("");
        const matches = activeTags().filter((tag) => {
          if (selected.indexOf(tag.Tag) !== -1) return false;
          return !query || String(tag.Tag).toLowerCase().includes(query);
        }).slice(0, 12);
        const exact = activeTags().some((tag) => String(tag.Tag).toLowerCase() === query);
        const createButton = query && !exact && state.data.permissions.canManageTags
          ? `<button type="button" data-action="new-tag-from-task" data-tag-name="${escapeHtml(searchInput.value.trim())}">Create "${escapeHtml(searchInput.value.trim())}"</button>`
          : "";
        picker.querySelector("[data-tag-options]").innerHTML = matches.map((tag) => `<button type="button" data-action="add-tag-selection" data-tag-name="${escapeHtml(tag.Tag)}">${escapeHtml(tag.Tag)}</button>`).join("") + createButton;
      }

      function updateAllTagPickers() {

      function syncUserPayFields(form) {
        if (!form) return;
        const payType = form.payType?.value || "None";
        const hourlyRate = form.hourlyRate;
        const salaryAmount = form.salaryAmount;
        const salaryFrequency = form.salaryFrequency;
        if (hourlyRate) hourlyRate.disabled = payType !== "Hourly";
        if (salaryAmount) salaryAmount.disabled = payType !== "Salary";
        if (salaryFrequency) salaryFrequency.disabled = payType !== "Salary";
        if (form.trackPay && form.trackTime) {
          if (form.trackPay.checked) {
            form.trackTime.checked = true;
            form.trackTime.disabled = true;
          } else {
            form.trackTime.disabled = false;
          }
        }
      }

      document.addEventListener("click", async (event) => {
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          state.tab = tabButton.dataset.tab;
          state.status = "";
          render();
          return;
        }
        const settingsButton = event.target.closest("[data-settings-section]");
        if (settingsButton) {
          state.settingsSection = settingsButton.dataset.settingsSection;
          render();
          return;
        }
        const action = event.target.closest("[data-action]")?.dataset.action;
          if (!action) return;
        try {
          if (action === "close-modal") {
            state.pendingCategorySave = null;
            closeTopModal();
          } else if (action === "new-task") {
            openTaskModal();
          } else if (action === "save-board-view") {
            openBoardViewModal();
          } else if (action === "clear-board-filters") {
            state.boardFilters = {};
            state.boardGrouping = "";
            state.selectedBoardViewId = "";
            render();
          } else if (action === "delete-board-view") {
            const view = selectedBoardView();
            if (view) openConfirmModal(`Delete saved view "${view["View Name"]}"?`, "confirm-delete-board-view", "data-board-view-id", view["Board View ID"]);
          } else if (action === "confirm-delete-board-view") {
            await callServer("archiveBoardView", event.target.closest("[data-board-view-id]").dataset.boardViewId);
            state.selectedBoardViewId = "";
            clearModals();
            await refreshBoardData("Board view deleted.");
          } else if (action === "refresh-project-dashboard") {
            await refreshProjectDashboardData("Project dashboard refreshed.");
          } else if (action === "select-project-dashboard") {
            state.projectFilters.projectId = event.target.closest("[data-project-id]").dataset.projectId;
            await refreshProjectDashboardData("Project selected.");
          } else if (action === "clear-project-filter") {
            state.projectFilters.projectId = "";
            await refreshProjectDashboardData("Project selection cleared.");
          } else if (action === "archive-project-dashboard") {
            openConfirmModal("Archive this project?", "confirm-archive-project-dashboard", "data-project-id", event.target.closest("[data-project-id]").dataset.projectId);
          } else if (action === "confirm-archive-project-dashboard") {
            await callServer("archiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            clearModals();
            await refreshData({ message: "Project archived." });
          } else if (action === "unarchive-project") {
            await callServer("unarchiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            await refreshData({ message: "Project restored." });
          } else if (action === "edit-task") {
            const task = state.data.tasks.find((item) => item["Task ID"] === event.target.closest("[data-task-id]").dataset.taskId);
            openTaskModal(task);
          } else if (action === "delete-task") {
            openConfirmModal("Delete this task? Existing audit history will be preserved.", "confirm-delete-task", "data-task-id", event.target.closest("[data-task-id]").dataset.taskId);
          } else if (action === "confirm-delete-task") {
            await callServer("archiveTask", event.target.closest("[data-task-id]").dataset.taskId);
            clearModals();
            await refreshBoardData("Task deleted.");
          } else if (action === "complete-task") {
            await callServer("completeTask", event.target.closest("[data-task-id]").dataset.taskId);
            await refreshBoardData("Task completed.");
          } else if (action === "add-time") {
            const taskId = event.target.closest("[data-task-id]").dataset.taskId;
            state.tab = "time";
            render();
            const taskSelect = document.querySelector('[name="taskId"]');
            if (taskSelect) taskSelect.value = taskId;

            const entry = (state.data.tracker.entries || []).find((item) => item["Time Entry ID"] === entryId);

          } else if (action === "delete-time") {
            openConfirmModal("Delete this time entry?", "confirm-delete-time", "data-entry-id", event.target.closest("[data-entry-id]").dataset.entryId);
          } else if (action === "confirm-delete-time") {
            await callServer("deleteTimeEntry", {
              timeEntryId: event.target.closest("[data-entry-id]").dataset.entryId,
              overrideReason: state.data.permissions.canOverrideLockedPeriod ? "Deleted by permitted user from Time Tracker" : "",
              requestReason: "Delete requested from Time Tracker"

            clearModals();
            await refreshTrackerData("Time entry deleted or request created.");
          } else if (action === "lock-period") {
            const periodId = state.data.paySummary?.payPeriod?.["Pay Period ID"];
            const saved = await callServer("lockPayPeriod", periodId);
            state.data.payPeriods = (state.data.payPeriods || []).map((period) => period["Pay Period ID"] === saved["Pay Period ID"] ? saved : period);
            await refreshPaySummaryData("Pay period locked.");
          } else if (action === "unlock-period") {
            const periodId = state.data.paySummary?.payPeriod?.["Pay Period ID"];
            const saved = await callServer("unlockPayPeriod", periodId);
            state.data.payPeriods = (state.data.payPeriods || []).map((period) => period["Pay Period ID"] === saved["Pay Period ID"] ? saved : period);

            openCategoryModal(state.data.categories.find((category) => category["Category ID"] === event.target.closest("[data-category-id]").dataset.categoryId));

            openTagModal(null, { stack: true, returnToTask: true, prefill: event.target.closest("[data-tag-name]").dataset.tagName });

          } else if (action === "add-tag-selection") {
            const picker = event.target.closest("[data-tag-picker]");
            const hidden = picker.querySelector('input[name="tags"]');
            const selected = selectedList(hidden.value);
            const tagName = event.target.closest("[data-tag-name]").dataset.tagName;
            if (selected.indexOf(tagName) === -1) selected.push(tagName);
            hidden.value = selected.join(", ");
