<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #eef2f5;
        --surface: #ffffff;
        --surface-strong: #ffffff;
        --surface-muted: #f4f7f9;
        --table-head: #e8edf2;
        --text: #13212d;
        --muted: #5f6f7d;
        --border: #d6dfe6;
        --accent: #235d57;
        --accent-strong: #16413d;
        --danger: #b04545;
        --warning: #99681b;
        --ok: #2f7351;
        --shadow: 0 10px 30px rgba(21, 34, 50, 0.08);
        --shadow-soft: 0 4px 14px rgba(21, 34, 50, 0.05);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --focus-ring: 0 0 0 3px rgba(35, 93, 87, 0.14);
        --app-topbar-height: 0px;
        --sticky-gap: 14px;
        --sticky-region-height: 0px;
        --sticky-top: var(--app-topbar-height);
        --side-pane-top: calc(var(--app-topbar-height) + var(--sticky-region-height));
        --modal-surface: #fbfcfd;
        --modal-border: #dbe3ea;
      }

      body[data-theme="dark"] {
        --bg: #0f1418;
        --surface: #171d22;
        --surface-strong: #1a2127;
        --surface-muted: #202930;
        --table-head: #1d252c;
        --text: #edf2f7;
        --muted: #a0aebb;
        --border: #31404a;
        --accent: #57aca1;
        --accent-strong: #76c4bb;
        --danger: #e38181;
        --warning: #e8c268;
        --ok: #7bc99f;
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.2);
        --focus-ring: 0 0 0 3px rgba(87, 172, 161, 0.18);
        --modal-surface: #1a2027;
        --modal-border: #384651;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        padding: 8px 11px;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      button:hover {
        border-color: #a2b0bc;
        box-shadow: var(--shadow-soft);
        transform: translateY(-1px);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 0;
        box-shadow: var(--focus-ring);
      }

      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled {
        opacity: 0.62;
        cursor: not-allowed;
      }

      input:disabled,
      select:disabled,
      textarea:disabled {
        background: var(--surface-muted);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      button.danger {
        color: var(--danger);
        border-color: #d9b6b6;
      }

      button.link {
        border: 0;
        background: transparent;
        padding: 4px 6px;
        color: var(--accent);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        padding: 8px 10px;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
      }

      textarea {
        min-height: 86px;
        resize: vertical;
      }

      input[type="checkbox"] {
        width: auto;
        min-height: auto;
      }

      input[type="color"] {
        width: 46px;
        min-height: 38px;
        padding: 4px;
      }

      input[type="file"] {
        padding: 6px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      .app-topbar {
        position: sticky;
        top: 0;
        z-index: 15;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: #fff;
        font-weight: 800;
      }

      .brand h1 {
        margin: 0;
        font-size: 17px;
      }

      .brand p,
      .user-chip {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      header > .user-chip:not(.user-chip-current) {
        display: none;
      }

      nav {
        display: flex;
        gap: 8px;
        padding: 10px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }

      nav button {
        white-space: nowrap;
        border-color: transparent;
        background: transparent;
        border-radius: 999px;
        padding-left: 12px;
        padding-right: 12px;
      }

      nav button.active {
        background: rgba(35, 93, 87, 0.08);
        border-color: rgba(35, 93, 87, 0.18);
        color: var(--accent-strong);
      }

      body[data-theme="dark"] nav button.active {
        background: rgba(87, 172, 161, 0.16);
        border-color: rgba(87, 172, 161, 0.26);
      }

      main {
        padding: 20px 22px 34px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.01em;
      }

      .toolbar p {
        margin: 3px 0 0;
        color: var(--muted);
      }

      .sticky-region {
        position: sticky;
        top: var(--sticky-top);
        z-index: 12;
        display: grid;
        gap: 14px;
        margin-bottom: 0;
        padding-top: 2px;
        padding-bottom: var(--sticky-gap);
        background: var(--bg);
      }

      .sticky-region .toolbar,
      .sticky-region .panel {
        margin-bottom: 0;
      }

      .filters,
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .form-grid.two {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
        padding: 16px;
        margin-bottom: 14px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 15px;
        letter-spacing: -0.01em;
      }

      .side-layout,
      .settings-layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .side-layout[data-sidebar-collapsed="true"],
      .settings-layout[data-sidebar-collapsed="true"] {
        grid-template-columns: 68px minmax(0, 1fr);
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .table-wrap table {
        min-width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 11px 10px;
        text-align: left;
        vertical-align: middle;
        word-break: break-word;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0;
        background: var(--table-head);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      th.sortable-th {
        padding: 0;
      }

      .sort-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 100%;
        border: 0;
        border-radius: 0;
        padding: 11px 10px;
        background: transparent;
        color: inherit;
        box-shadow: none;
        transform: none;
        text-align: left;
        font-size: inherit;
        font-weight: inherit;
      }

      .sort-header:hover,
      .sort-header:focus-visible {
        background: rgba(127, 143, 156, 0.08);
        box-shadow: none;
        transform: none;
      }

      .sort-indicator {
        color: var(--accent);
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
      }

      .grouped-board {
        display: grid;
        gap: 10px;
      }

      .board-group {
        display: grid;
        gap: 10px;
      }

      .board-group-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-muted);
        color: var(--text);
        box-shadow: var(--shadow-soft);
      }

      .board-group-toggle:hover,
      .board-group-toggle:focus-visible {
        background: var(--surface);
      }

      .board-group-toggle strong {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .board-group-body[hidden] {
        display: none !important;
      }

      body[data-theme="dark"] th {
        color: #dfe7ee;
        background: #202930;
      }

      table {
        width: 100%;
        table-layout: fixed;
      }

      .board-table th:nth-child(1) { width: 30%; }
      .board-table th:nth-child(2) { width: 12%; }
      .board-table th:nth-child(3) { width: 18%; }
      .board-table th:nth-child(4) { width: 16%; }
      .board-table th:nth-child(5) { width: 10%; }
      .board-table th:nth-child(6) { width: 10%; }
      .board-table th:nth-child(7) { width: 4%; }

      .time-table th:nth-child(1) { width: 34%; }
      .time-table th:nth-child(2) { width: 20%; }
      .time-table th:nth-child(3) { width: 8%; }
      .time-table th:nth-child(4) { width: 24%; }
      .time-table th:nth-child(5) { width: 14%; }

      .pay-table th:nth-child(1) { width: 22%; }
      .pay-table th:nth-child(2) { width: 14%; }
      .pay-table th:nth-child(3) { width: 16%; }
      .pay-table th:nth-child(4) { width: 18%; }
      .pay-table th:nth-child(5) { width: 15%; }
      .pay-table th:nth-child(6) { width: 15%; }

      .project-dashboard-table th:nth-child(1) { width: 20%; }
      .project-dashboard-table th:nth-child(2) { width: 12%; }
      .project-dashboard-table th:nth-child(3) { width: 12%; }
      .project-dashboard-table th:nth-child(4) { width: 12%; }
      .project-dashboard-table th:nth-child(5) { width: 12%; }
      .project-dashboard-table th:nth-child(6) { width: 12%; }
      .project-dashboard-table th:nth-child(7) { width: 20%; }

      .project-task-table th:nth-child(1) { width: 34%; }
      .project-task-table th:nth-child(2) { width: 14%; }
      .project-task-table th:nth-child(3) { width: 24%; }
      .project-task-table th:nth-child(4) { width: 14%; }
      .project-task-table th:nth-child(5) { width: 14%; }

      .task-title-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .task-note-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface-muted);
        color: var(--muted);
        padding: 0;
        font-size: 12px;
        line-height: 1;
        display: inline-grid;
        place-items: center;
      }

      .task-note-icon:hover,
      .task-note-icon:focus-visible {
        color: var(--text);
        border-color: var(--accent);
      }

      .action-popover {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
      }

      .action-popover::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        height: 8px;
      }

      .action-popover-trigger {
        width: 28px;
        height: 28px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        font-size: 17px;
        line-height: 1;
      }

      .action-popover-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        z-index: 12;
        display: none;
        min-width: 170px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .action-popover:hover .action-popover-menu,
      .action-popover:focus-within .action-popover-menu,
      .action-popover[data-hover-open="true"] .action-popover-menu,
      .action-popover[data-open="true"] .action-popover-menu {
        display: grid;
        gap: 4px;
      }

      .action-popover-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        white-space: nowrap;
        border: 0;
        border-radius: 6px;
        padding: 8px 9px;
        background: transparent;
      }

      .action-popover-menu button:hover,
      .action-popover-menu button:focus-visible {
        background: var(--surface-muted);
        box-shadow: none;
        transform: none;
      }

      .action-popover-menu .danger {
        color: var(--danger);
      }

      tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: rgba(127, 143, 156, 0.06);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 9px;
        color: var(--text);
        background: var(--surface-muted);
        font-size: 12px;
      }

      .person-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid transparent;
        background: var(--surface-muted);
        color: var(--text);
        font-size: 12px;
        white-space: nowrap;
      }

      .person-chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge.high,
      .badge.urgent {
        color: var(--warning);
        border-color: #ecd7a8;
        background: #fff8e8;
      }

      .badge.complete {
        color: var(--ok);
        border-color: #bbdac9;
        background: #edf8f2;
      }

      body[data-theme="dark"] .badge.high,
      body[data-theme="dark"] .badge.urgent {
        border-color: rgba(231, 189, 99, 0.34);
        background: rgba(231, 189, 99, 0.12);
      }

      body[data-theme="dark"] .badge.complete {
        border-color: rgba(118, 199, 155, 0.34);
        background: rgba(118, 199, 155, 0.12);
      }

      .chip-list,
      .checkbox-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .checkbox-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px;
        background: var(--surface);
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 400;
      }

      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 999px;
      }

      .avatar {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        overflow: hidden;
        font-size: 11px;
        font-weight: 800;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .user-cell,
      .profile-preview {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
      }

      .profile-preview {
        flex-wrap: wrap;
      }

      .color-field {
        display: grid;
        grid-template-columns: 46px minmax(110px, 1fr);
        gap: 8px;
        align-items: center;
      }

      .swatch {
        display: inline-block;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1px solid var(--border);
        vertical-align: middle;
      }

      .tag-picker {
        display: grid;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px;
        background: var(--surface);
      }

      .tag-option-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-remove {
        border: 0;
        background: transparent;
        padding: 0 0 0 5px;
        color: inherit;
      }

      .pay-row {
        cursor: pointer;
      }

      .pay-row:hover {
        background: rgba(127, 143, 156, 0.06);
      }

      .group-heading {
        margin: 14px 0 8px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
        color: var(--text);
        font-weight: 800;
      }

      .side-pane {
        display: grid;
        gap: 6px;
        align-self: start;
        position: sticky;
        top: var(--side-pane-top);
        max-height: none;
        overflow: visible;
        scrollbar-gutter: stable;
        overscroll-behavior: contain;
      }

      .side-pane .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 34px;
      }

      .side-pane .sidebar-body {
        display: grid;
        gap: 6px;
      }

      .side-pane button {
        text-align: left;
      }

      .side-pane .sidebar-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .side-pane .sidebar-short {
        display: none;
        min-width: 24px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane {
        width: 42px;
        padding: 8px 5px;
        overflow: hidden;
        align-items: center;
        justify-items: center;
        scrollbar-width: none;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane::-webkit-scrollbar,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane button,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane button {
        text-align: center;
        padding-left: 6px;
        padding-right: 6px;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-text,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-body,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-group .sidebar-children,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head strong,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-text,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-body,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-group .sidebar-children,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head strong {
        display: none;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short {
        display: inline-flex;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head {
        justify-content: center;
        width: 100%;
      }

      .side-pane .sidebar-group {
        display: grid;
        gap: 6px;
      }

      .side-pane .sidebar-children {
        display: grid;
        gap: 4px;
        padding-left: 12px;
      }

      .side-pane .sidebar-children button {
        padding-left: 10px;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        display: inline-block;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
      }

      .status-spinner {
        margin-right: 8px;
      }

      .button-spinner {
        width: 12px;
        height: 12px;
        margin-right: 6px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .side-pane button.active {
        background: var(--surface-muted);
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      .empty,
      .loading,
      .error {
        padding: 28px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--muted);
      }

      .error {
        color: var(--danger);
        border-color: #dfb7b7;
      }

      .status-line {
        min-height: 22px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 2px 12px;
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(16, 24, 32, 0.38);
        backdrop-filter: blur(4px) saturate(1.05);
        -webkit-backdrop-filter: blur(4px) saturate(1.05);
        z-index: 20;
      }

      .modal-backdrop[data-modal-level="2"] {
        z-index: 30;
        background: rgba(16, 24, 32, 0.26);
      }

      .modal {
        width: min(760px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: var(--modal-surface);
        border: 1px solid var(--modal-border);
        border-radius: var(--radius-lg);
        box-shadow: 0 22px 64px rgba(0, 0, 0, 0.28);
        padding: 20px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .modal-header h3 {
        margin: 0;
      }

      .pay-detail-modal .modal-header {
        position: sticky;
        top: 0;
        z-index: 2;
        margin-bottom: 16px;
        padding: 2px 0 16px;
        background: var(--modal-surface);
        border-bottom: 1px solid var(--modal-border);
      }

      .collapsible-section {
        border: 1px solid var(--modal-border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
        overflow: hidden;
      }

      .collapsible-section + .collapsible-section {
        margin-top: 12px;
      }

      .collapsible-section > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        list-style: none;
        cursor: pointer;
        font-weight: 800;
        color: var(--text);
      }

      .collapsible-section > summary::-webkit-details-marker {
        display: none;
      }

      .collapsible-section > summary::after {
        content: "▸";
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
      }

      .collapsible-section[open] > summary::after {
        content: "▾";
      }

      .collapsible-meta {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .collapsible-body {
        padding: 0 16px 16px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric-card {
        display: grid;
        gap: 4px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .metric-card strong {
        font-size: 18px;
      }

      .project-dashboard-layout {
        display: grid;
        gap: 14px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .project-summary-row {
        cursor: pointer;
      }

      .project-summary-row:hover {
        background: rgba(127, 143, 156, 0.06);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .grouped-day {
        border-top: 1px solid var(--border);
        padding: 12px 0;
      }

      .grouped-day:first-child {
        border-top: 0;
      }

      .day-heading {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 800;
        color: var(--muted);
      }

      .admin-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
        gap: 16px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main,
        header,
        nav {
          padding-left: 14px;
          padding-right: 14px;
        }

        .filters,
        .form-grid,
        .form-grid.two,
        .admin-grid,
        .side-layout,
        .settings-layout {
          grid-template-columns: 1fr;
        }

        .metric-grid,
        .detail-grid {
          grid-template-columns: 1fr;
        }

        .side-layout[data-sidebar-collapsed="true"],
        .settings-layout[data-sidebar-collapsed="true"],
        .settings-layout {
          grid-template-columns: 1fr;
        }

        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          border: 1px solid var(--border);
          border-radius: var(--radius-md);
          margin-bottom: 10px;
          background: var(--surface);
          box-shadow: var(--shadow-soft);
          overflow: hidden;
        }

        td {
          border: 0;
          display: grid;
          grid-template-columns: 110px 1fr;
          gap: 8px;
          padding: 9px 10px;
        }

        td::before {
          content: attr(data-label);
          color: var(--muted);
          font-weight: 800;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading">Loading Trust Ops...</div>
    <div id="modal-root"></div>

    <script>
      const state = {
        tab: "board",
        data: null,
        boardFilters: {},
        boardGrouping: "",
        selectedBoardViewId: "",
        boardSidebarCollapsed: false,
        timeFilters: {},
        timeSidebarCollapsed: false,
        payFilters: { rangeMode: "current" },
        paySidebarCollapsed: false,
        projectFilters: { rangeMode: "current", includeArchived: false, projectId: "" },
        projectSidebarCollapsed: false,
        tableSorts: {},
        boardGroupExpanded: {},
        settingsSection: "profile",
        settingsSidebarCollapsed: false,
        settingsGroupOpen: true,
        loadingCount: 0,
        busyLabel: "",
        pendingCategorySave: null,
        pendingMigrationImport: null,
        status: "",
        migrationSourceType: "sheet",
        migrationImportMode: "append",
        migrationSpreadsheetId: ""
      };

      function storageKey(name) {
        return `trust-ops:${state.data?.context?.userId || "anonymous"}:${name}`;
      }

      function loadStoredBool(name, fallback = false) {
        const value = localStorage.getItem(storageKey(name));
        if (value === null) return fallback;
        return value === "true";
      }

      function saveStoredBool(name, value) {
        localStorage.setItem(storageKey(name), String(Boolean(value)));
      }

      function loadStoredString(name, fallback = "") {
        const value = localStorage.getItem(storageKey(name));
        return value === null ? fallback : value;
      }

      function saveStoredString(name, value) {
        localStorage.setItem(storageKey(name), String(value ?? ""));
      }

      function busyLabelForMethod(name) {
        const text = String(name || "").toLowerCase();
        if (text.includes("import")) return "Importing...";
        if (text.startsWith("get") || text.startsWith("refresh") || text.startsWith("list") || text.startsWith("load")) return "Loading...";
        if (text.includes("save") || text.includes("create") || text.includes("update") || text.includes("remove") || text.includes("delete") || text.includes("archive") || text.includes("approve") || text.includes("reject") || text.includes("share") || text.includes("lock") || text.includes("unlock")) return "Saving...";
        return "Working...";
      }

      function setBusy(message) {
        state.loadingCount += 1;
        state.busyLabel = message || state.busyLabel || "Loading...";
        renderBusyState();
      }

      function clearBusy() {
        state.loadingCount = Math.max(0, state.loadingCount - 1);
        if (!state.loadingCount) {
          state.busyLabel = "";
        }
        renderBusyState();
      }

      function renderBusyState() {
        const line = document.querySelector("[data-status-line]");
        if (line) line.innerHTML = state.loadingCount ? `<span class="spinner status-spinner"></span>${escapeHtml(state.busyLabel || "Loading...")}` : escapeHtml(state.status);
      }

      function callServer(name, ...args) {
        const busyMessage = busyLabelForMethod(name);
        setBusy(busyMessage);
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler((result) => {
              clearBusy();
              resolve(result);
            })
            .withFailureHandler((error) => {
              clearBusy();
              reject(error);
            })
            [name](...args);
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function money(value) {
        return Number(value || 0).toLocaleString(undefined, { style: "currency", currency: "USD" });
      }

      function parseJson(value, fallback = {}) {
        try {
          return JSON.parse(value || "{}") || fallback;
        } catch (error) {
          return fallback;
        }
      }

      function normalizeHex(value, fallback = "#1f6f68") {
        const text = String(value || "").trim();
        return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toLowerCase() : fallback;
      }

      function cssEscape(value) {
        return window.CSS && CSS.escape ? CSS.escape(String(value)) : String(value).replace(/"/g, '\\"');
      }

      function settingMap() {
        return Object.fromEntries((state.data?.settings || []).map((setting) => [setting["Setting Key"], setting["Setting Value"]]));
      }

      function organizationName() {
        return state.data?.organizationName || settingMap()[`ORGANIZATION_NAME`] || state.data?.appName || "Trust Ops";
      }

      function taskStatusColors() {
        return state.data?.visualSettings?.taskStatusColors || {};
      }

      function projectStatusColors() {
        return state.data?.visualSettings?.projectStatusColors || {};
      }

      function badgeStyleForStatus(status) {
        const color = taskStatusColors()[status];
        return color ? ` style="color: ${escapeHtml(color)}; border-color: ${escapeHtml(color)}; background: ${escapeHtml(color)}18;"` : "";
      }

      function badgeStyleForProjectStatus(status) {
        const color = projectStatusColors()[status];
        return color ? ` style="color: ${escapeHtml(color)}; border-color: ${escapeHtml(color)}; background: ${escapeHtml(color)}18;"` : "";
      }

      function initials(name) {
        return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase() || "?";
      }

      function avatarForUser(user, size = "") {
        const color = normalizeHex(user?.["Profile Color"], "#1f6f68");
        const imageUrl = user?.["Profile Image URL"] || user?.["Google Profile Photo URL"] || "";
        const style = `background:${escapeHtml(color)}`;
        return `<span class="avatar ${escapeHtml(size)}" style="${style}" title="${escapeHtml(user?.["Full Name"] || user?.Email || "")}">${imageUrl ? `<img alt="" src="${escapeHtml(imageUrl)}">` : escapeHtml(initials(user?.["Full Name"] || user?.Email))}</span>`;
      }

      function findUser(userId) {
        return (state.data.users || []).find((user) => String(user["User ID"]) === String(userId)) || null;
      }

      function renderColorField(name, value, fallback = "#1f6f68") {
        const color = normalizeHex(value, fallback);
        return `<div class="color-field" data-color-field>
          <input type="color" data-color-wheel="${escapeHtml(name)}" value="${escapeHtml(color)}" aria-label="${escapeHtml(name)} color">
          <input name="${escapeHtml(name)}" data-color-hex="${escapeHtml(name)}" value="${escapeHtml(color)}" pattern="^#[0-9a-fA-F]{6}$" maxlength="7">
        </div>`;
      }

      function renderAssigneeChips(task) {
        const ids = selectedList(task["Assignee User IDs"]);
        const names = selectedList(task.Assignees);
        const chips = ids.length ? ids : names;
        if (!chips.length) return '<span class="badge">Unassigned</span>';
        return `<span class="person-chip-list">${chips.map((assigneeIdOrName, index) => {
          const user = ids.length
            ? findUser(assigneeIdOrName)
            : (state.data.users || []).find((item) =>
                String(item["Full Name"] || "").toLowerCase() === String(assigneeIdOrName || "").toLowerCase() ||
                String(item.Email || "").toLowerCase() === String(assigneeIdOrName || "").toLowerCase()
              ) || null;
          const label = user?.["Full Name"] || names[index] || assigneeIdOrName;
          const color = normalizeHex(user?.["Profile Color"], "#1f6f68");
          return `<span class="person-chip" style="color:${escapeHtml(color)}; border-color:${escapeHtml(color)}; background:${escapeHtml(color)}18;">${escapeHtml(label)}</span>`;
        }).join("")}</span>`;
      }

      function renderProjectStatusBadge(status) {
        return `<span class="badge ${escapeHtml(String(status || "").toLowerCase())}"${badgeStyleForProjectStatus(status)}>${escapeHtml(status || "")}</span>`;
      }

      function options(items, valueKey, labelKey, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (items || []).map((item) => {
          const value = item[valueKey];
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(item[labelKey] || value)}</option>`;
        }).join("");
      }

      function constantOptions(values, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (values || []).map((value) => {
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(value)}</option>`;
        }).join("");
      }

      function selectedList(value) {
        return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
      }

      function renderCheckboxList(name, items, valueKey, labelKey, selectedValues) {
        const selected = new Set(selectedValues || []);
        return `<div class="checkbox-list">${(items || []).map((item) => `
          <label class="checkbox-row">
            <input type="checkbox" name="${escapeHtml(name)}" value="${escapeHtml(item[valueKey])}" ${selected.has(String(item[valueKey])) ? "checked" : ""}>
            <span>${escapeHtml(item[labelKey] || item[valueKey])}</span>
          </label>`).join("")}</div>`;
      }

      function tableSortConfig(tableKey) {
        return state.tableSorts?.[tableKey] || null;
      }

      function normalizeSortValue(value) {
        if (value === null || value === undefined) return { type: 2, value: "" };
        if (typeof value === "number" && Number.isFinite(value)) return { type: 0, value };
        const text = String(value).trim();
        if (!text) return { type: 2, value: "" };
        const numericText = text.replace(/[$,%]/g, "").trim();
        if (/^-?\d+(\.\d+)?$/.test(numericText)) {
          return { type: 0, value: Number(numericText) };
        }
        const dateValue = Date.parse(text);
        if (!Number.isNaN(dateValue) && /^\d{4}-\d{2}-\d{2}/.test(text)) {
          return { type: 0, value: dateValue };
        }
        return { type: 1, value: text.toLowerCase() };
      }

      function compareSortValues(left, right, direction) {
        const multiplier = direction === "desc" ? -1 : 1;
        if (left.type !== right.type) {
          return (left.type - right.type) * multiplier;
        }
        if (left.value < right.value) return -1 * multiplier;
        if (left.value > right.value) return 1 * multiplier;
        return 0;
      }

      function sortTableRows(rows, tableKey, columns) {
        const sort = tableSortConfig(tableKey);
        const accessor = sort && sort.key ? columns?.[sort.key] : null;
        if (!accessor) return (rows || []).slice();
        return (rows || []).slice().sort((left, right) => compareSortValues(
          normalizeSortValue(accessor(left)),
          normalizeSortValue(accessor(right)),
          sort.direction || "asc"
        ));
      }

      function setTableSort(tableKey, columnKey, defaultDirection = "asc") {
        const current = tableSortConfig(tableKey);
        const direction = current && current.key === columnKey
          ? (current.direction === "asc" ? "desc" : "asc")
          : defaultDirection;
        state.tableSorts = Object.assign({}, state.tableSorts, {
          [tableKey]: { key: columnKey, direction: direction }
        });
      }

      function renderSortHeader(tableKey, columnKey, label, defaultDirection = "asc") {
        const sort = tableSortConfig(tableKey);
        const active = sort && sort.key === columnKey;
        const direction = active ? (sort.direction || defaultDirection) : "";
        const indicator = active ? (direction === "desc" ? "&#9660;" : "&#9650;") : "&nbsp;";
        return `
          <th class="sortable-th">
            <button type="button" class="sort-header" data-sort-table="${escapeHtml(tableKey)}" data-sort-column="${escapeHtml(columnKey)}" data-sort-direction="${escapeHtml(defaultDirection)}" aria-sort="${active ? (direction === "desc" ? "descending" : "ascending") : "none"}">
              <span>${escapeHtml(label)}</span>
              <span class="sort-indicator">${indicator}</span>
            </button>
          </th>`;
      }

      function boardGroupStateKey(groupKey) {
        return `${state.boardGrouping || ""}::${String(groupKey || "")}`;
      }

      function isBoardGroupExpanded(groupKey) {
        return Boolean(state.boardGroupExpanded?.[boardGroupStateKey(groupKey)]);
      }

      function setBoardGroupExpanded(groupKey, expanded) {
        state.boardGroupExpanded = Object.assign({}, state.boardGroupExpanded, {
          [boardGroupStateKey(groupKey)]: Boolean(expanded)
        });
      }

      function renderIcon(action, idName, idValue, label, symbol, danger = false) {
        return `<button type="button" class="icon-button ${danger ? "danger" : ""}" data-action="${escapeHtml(action)}" ${idName ? `${idName}="${escapeHtml(idValue)}"` : ""} title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}">${symbol}</button>`;
      }

      function sidebarLabel(shortLabel, fullLabel) {
        return `<span class="sidebar-label"><span class="sidebar-short">${escapeHtml(shortLabel)}</span><span class="sidebar-text">${escapeHtml(fullLabel)}</span></span>`;
      }

      function renderSidebarToggle(key) {
        const collapsed = Boolean(state[key]);
        return `<button type="button" class="icon-button" data-action="toggle-sidebar" data-sidebar-key="${escapeHtml(key)}" title="${collapsed ? "Expand sidebar" : "Collapse sidebar"}" aria-label="${collapsed ? "Expand sidebar" : "Collapse sidebar"}" aria-expanded="${collapsed ? "false" : "true"}">${collapsed ? "&#9654;" : "&#9664;"}</button>`;
      }

      function renderLayoutSidebar(title, key, innerHtml) {
        return `
          <aside class="panel side-pane">
            <div class="sidebar-head">
              <strong>${escapeHtml(title)}</strong>
              ${renderSidebarToggle(key)}
            </div>
            <div class="sidebar-body">${innerHtml}</div>
          </aside>`;
      }

      function renderTaskNoteIcon(note) {
        const text = String(note || "").trim();
        if (!text) return "";
        return `<button type="button" class="task-note-icon" title="${escapeHtml(text)}" aria-label="Task note">&#128221;</button>`;
      }

      function renderTaskActionMenu(task) {
        const taskId = escapeHtml(task["Task ID"]);
        const actions = [];
        if (task._permissions?.canComplete && task.Status !== "Complete") {
          actions.push(["complete-task", "&#10003;", "Complete task", false]);
        }
        if (task._permissions?.canAddTime) {
          actions.push(["add-time", "&#128336;", "Add time", false]);
        }
        if (task._permissions?.canEdit) {
          actions.push(["edit-task", "&#9998;", "Edit task", false]);
        }
        if (task._permissions?.canDelete) {
          actions.push(["delete-task", "&#128465;", "Delete task", true]);
        }
        if (!actions.length) return "";
        return `
          <div class="action-popover" data-action-popover>
            <button type="button" class="icon-button action-popover-trigger" data-action-menu-trigger aria-label="Task actions" aria-haspopup="menu" aria-expanded="false" title="Task actions">&#8250;</button>
            <div class="action-popover-menu">
              ${actions.map(([action, symbol, label, danger]) => `
                <button type="button" class="${danger ? "danger" : ""}" data-action="${escapeHtml(action)}" data-task-id="${taskId}">
                  <span>${symbol}</span><span>${escapeHtml(label)}</span>
                </button>
              `).join("")}
            </div>
          </div>`;
      }

      function setModal(html) {
        document.getElementById("modal-root").innerHTML = html;
      }

      function pushModal(html) {
        const root = document.getElementById("modal-root");
        root.insertAdjacentHTML("beforeend", html);
        Array.from(root.querySelectorAll(".modal-backdrop")).forEach((modal, index) => {
          modal.dataset.modalLevel = String(index + 1);
        });
      }

      function closeTopModal() {
        const modals = document.querySelectorAll("#modal-root .modal-backdrop");
        if (!modals.length) return;
        modals[modals.length - 1].remove();
      }

      function clearModals() {
        document.getElementById("modal-root").innerHTML = "";
      }

      function closeActionMenus() {
        document.querySelectorAll("[data-action-popover][data-open='true']").forEach((menu) => {
          menu.dataset.open = "false";
        });
        document.querySelectorAll("[data-action-menu-trigger]").forEach((button) => {
          button.setAttribute("aria-expanded", "false");
        });
      }

      function setStatus(message) {
        state.status = message || "";
        const line = document.querySelector("[data-status-line]");
        if (line) line.textContent = state.status;
      }

      function applyUserPreferences() {
        const user = state.data?.currentUser || {};
        const mode = user["Theme Mode"] || "System";
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.body.dataset.theme = mode === "Dark" || (mode === "System" && prefersDark) ? "dark" : "light";
      }

      async function loadInitial() {
        try {
          state.data = await callServer("getInitialData");
          state.settingsSidebarCollapsed = loadStoredBool("settingsSidebarCollapsed", false);
          state.settingsGroupOpen = loadStoredBool("settingsGroupOpen", true);
          state.boardSidebarCollapsed = loadStoredBool("boardSidebarCollapsed", false);
          state.timeSidebarCollapsed = loadStoredBool("timeSidebarCollapsed", false);
          state.paySidebarCollapsed = loadStoredBool("paySidebarCollapsed", false);
          state.projectSidebarCollapsed = loadStoredBool("projectSidebarCollapsed", false);
          state.settingsSection = loadStoredString("settingsSection", state.settingsSection);
          state.timeFilters.userId = state.data.context.userId;
          state.timeFilters.payPeriodId = state.data.currentPayPeriod["Pay Period ID"];
          state.payFilters.userId = state.data.context.userId;
          state.payFilters.rangeMode = "current";
          applyUserPreferences();
          render();
        } catch (error) {
          let diagnostic = null;
          try {
            diagnostic = await callServer("getAuthDiagnostic");
          } catch (diagnosticError) {
            diagnostic = { diagnosticError: diagnosticError.message || String(diagnosticError) };
          }
          document.getElementById("app").innerHTML = `
            <div class="error">
              <strong>Unable to load Trust Ops.</strong><br>
              ${escapeHtml(error.message || error)}
              ${renderAuthDiagnostic(diagnostic)}
            </div>`;
        }
      }

      function renderAuthDiagnostic(diagnostic) {
        if (!diagnostic) return "";
        return `
          <div class="panel" style="margin-top: 14px; box-shadow: none;">
            <h3>Access Diagnostic</h3>
            <div class="table-wrap">
              <table>

        setStatus("Saving...");

          taskFilters: state.boardFilters,
          timeFilters: state.timeFilters,
          payFilters: safePayFiltersForRefresh(),
          projectFilters: safeProjectFiltersForRefresh()

        setStatus(parts.message || "Updated.");

        setStatus(message);
        render();
      }

      async function refreshTrackerData(message = "Time tracker refreshed.") {

        setStatus(message);
        render();
      }

      async function refreshPaySummaryData(message = "Pay summary refreshed.") {
        state.data.paySummary = await callServer("getPaySummary", safePayFiltersForRefresh());
        setStatus(message);
        render();
      }

        state.data.projectDashboard = await callServer("getProjectDashboard", safeProjectFiltersForRefresh());
        setStatus(message);
        render();
      }

      function upsertLocalTag(tag) {
        const tags = state.data.tags || [];
        const index = tags.findIndex((item) => item["Tag ID"] === tag["Tag ID"]);
        if (index === -1) tags.push(tag);
        else tags[index] = tag;
        tags.sort((a, b) => String(a.Tag).localeCompare(String(b.Tag)));
        state.data.tags = tags;
      }

      let stickyLayoutObserver = null;
      let stickyLayoutObservedTopbar = null;
      let stickyLayoutObservedRegion = null;

      function syncStickyOffsets() {
        const appTopbar = document.querySelector(".app-topbar");
        const stickyRegion = document.querySelector(".sticky-region");
        const appTopbarHeight = appTopbar ? Math.ceil(appTopbar.getBoundingClientRect().height) : 0;
        const stickyRegionHeight = stickyRegion ? Math.ceil(stickyRegion.getBoundingClientRect().height) : 0;

        document.documentElement.style.setProperty("--app-topbar-height", `${appTopbarHeight}px`);
        document.documentElement.style.setProperty("--sticky-region-height", `${stickyRegionHeight}px`);

        if (!window.ResizeObserver) return;
        if (!stickyLayoutObserver) {
          stickyLayoutObserver = new ResizeObserver(() => syncStickyOffsets());
        }

        if (stickyLayoutObservedTopbar !== appTopbar) {
          if (stickyLayoutObservedTopbar) stickyLayoutObserver.unobserve(stickyLayoutObservedTopbar);
          if (appTopbar) stickyLayoutObserver.observe(appTopbar);
          stickyLayoutObservedTopbar = appTopbar;
        }

        if (stickyLayoutObservedRegion !== stickyRegion) {
          if (stickyLayoutObservedRegion) stickyLayoutObserver.unobserve(stickyLayoutObservedRegion);
          if (stickyRegion) stickyLayoutObserver.observe(stickyRegion);
          stickyLayoutObservedRegion = stickyRegion;
        }
      }

      function render() {
        const data = state.data;

          ["pay", "Pay Summary"]
        ];

        document.getElementById("app").innerHTML = `
          <div class="app-topbar">
            <header>
              <div class="brand">

                <div>

                  <p>Tasks, time, pay periods, and administration</p>
                </div>
              </div>
              <div class="user-chip user-chip-current">${avatarForUser(data.currentUser)}<span>${escapeHtml(data.context.fullName)} / ${escapeHtml(data.context.role)}</span></div>

          <main>

        `;

        renderBusyState();

      }

      function renderActiveTab() {
        if (state.tab === "time") return renderTimeTracker();
        if (state.tab === "pay") return renderPaySummary();
        if (state.tab === "projects") return renderProjectDashboard();
        if (state.tab === "settings") return renderSettings();
        return renderBoard();
      }

      function applyBoardFilters(tasks) {
        const filters = state.boardFilters;
        const search = String(filters.search || "").toLowerCase();
        return (tasks || []).filter((task) => {
          if (filters.status && task.Status !== filters.status) return false;
          if (filters.projectId && task["Project ID"] !== filters.projectId) return false;
          if (filters.priority && task.Priority !== filters.priority) return false;
          if (filters.assigneeUserId && !String(task["Assignee User IDs"] || "").split(",").map((id) => id.trim()).includes(filters.assigneeUserId)) return false;
          if (filters.tag && selectedList(task.Tags).indexOf(filters.tag) === -1) return false;
          if (search) {
            const haystack = [task.Title, task.Notes, task.Status, task.Assignees, task["Project Name"], task.Priority, task.Tags].join(" ").toLowerCase();
            if (!haystack.includes(search)) return false;
          }
          return true;
        });
      }

      function selectedBoardView() {
        return (state.data.boardViews || []).find((view) => String(view["Board View ID"]) === String(state.selectedBoardViewId)) || null;
      }

      function canModifyBoardView(view) {
        if (!view) return false;
        return String(view["Owner User ID"]) === String(state.data.context.userId) || state.data.permissions.canManageBoardViews;
      }

      function buildBoardViewPayload(form) {
        const view = selectedBoardView();
        const canUpdate = canModifyBoardView(view);
        return {
          viewId: canUpdate ? state.selectedBoardViewId : "",
          viewName: form.viewName.value,
          visibility: canUpdate ? form.visibility.value : "Private",
          filters: state.boardFilters,
          grouping: state.boardGrouping
        };
      }

      function groupTaskKey(task) {
        const grouping = state.boardGrouping || "";
        if (grouping === "Status") return task.Status || "No status";
        if (grouping === "Project") return task["Project Name"] || "No project";
        if (grouping === "Assignee") return task.Assignees || "Unassigned";
        if (grouping === "Priority") return task.Priority || "No priority";
        if (grouping === "Tag") return task.Tags || "No tag";
        if (grouping === "Due Week") return task["Due Date"] ? task["Due Date"].slice(0, 10) : "No due date";
        return "";
      }

      function renderBoardResults(tasks) {
        if (!tasks.length) return '<div class="empty">No tasks match the current filters.</div>';
        if (!state.boardGrouping) return renderTaskTable(tasks, "board");
        const grouped = tasks.reduce((acc, task) => {
          const key = groupTaskKey(task);
          acc[key] = acc[key] || [];
          acc[key].push(task);
          return acc;
        }, {});
        return `<div class="grouped-board">${Object.keys(grouped).sort().map((key) => {
          const expanded = isBoardGroupExpanded(key);
          return `
            <section class="board-group">
              <button type="button" class="board-group-toggle" data-action="toggle-board-group" data-board-group-key="${escapeHtml(key)}">
                <strong>${escapeHtml(key)} <span class="badge">${grouped[key].length}</span></strong>
                <span class="sort-indicator">${expanded ? "&#9660;" : "&#9654;"}</span>
              </button>
              <div class="board-group-body" ${expanded ? "" : "hidden"}>
                ${renderTaskTable(grouped[key], "board")}
              </div>
            </section>`;
        }).join("")}</div>`;
      }

      function updateBoardResultsOnly() {
        const count = applyBoardFilters(state.data.tasks).length;
        const toolbarCount = document.querySelector('section.toolbar p');
        if (toolbarCount) toolbarCount.textContent = `${count} visible task${count === 1 ? "" : "s"}`;
        const container = document.getElementById("board-results");
        if (!container) return;
        container.innerHTML = renderBoardResults(applyBoardFilters(state.data.tasks));
      }

      function renderBoard() {
        const data = state.data;
        const tasks = applyBoardFilters(data.tasks);
        const view = selectedBoardView();
        const canDeleteSelectedView = canModifyBoardView(view);
        return `
          <div class="sticky-region">
            <section class="toolbar">
              <div>
                <h2>Assignment Board</h2>

              </div>
              <div class="actions">
                ${data.permissions.canCreateTask ? renderIcon("new-task", "", "", "Create Task", "&#10133;", false) : ""}
                ${renderIcon("save-board-view", "", "", "Save View", "&#128190;")}
                ${canDeleteSelectedView ? renderIcon("delete-board-view", "", "", "Delete saved view", "&#128465;", true) : ""}
                ${renderIcon("clear-board-filters", "", "", "Clear Filters", "&#10006;")}
              </div>
            </section>

          <section class="side-layout" data-sidebar-collapsed="${state.boardSidebarCollapsed ? "true" : "false"}">
            ${renderLayoutSidebar("Filters", "boardSidebarCollapsed", `
              <label>Saved View <select data-action="load-board-view">

                ${(data.boardViews || []).map((item) => `<option value="${escapeHtml(item["Board View ID"])}" ${String(item["Board View ID"]) === String(state.selectedBoardViewId) ? "selected" : ""}>${escapeHtml(item["View Name"])} (${escapeHtml(item.Visibility)})</option>`).join("")}

              <label>Priority <select data-filter="priority">${constantOptions(data.constants.priorities, state.boardFilters.priority, true)}</select></label>

                ${renderBoardResults(tasks)}

      function renderTaskTable(tasks, tableKey = "board") {
        const sortColumns = tableKey === "projectTasks" ? {
          task: (task) => task.Title,
          status: (task) => task.Status,
          assignees: (task) => task.Assignees || selectedList(task["Assignee User IDs"]).join(", "),

        } : {
          task: (task) => task.Title,
          status: (task) => task.Status,
          assignees: (task) => task.Assignees || selectedList(task["Assignee User IDs"]).join(", "),
          project: (task) => task["Project Name"],
          priority: (task) => task.Priority,
          due: (task) => task["Due Date"]
        };
        const sortedTasks = sortTableRows(tasks, tableKey, sortColumns);
        const isProjectTaskTable = tableKey === "projectTasks";
        return `
          <div class="table-wrap">
            <table class="${isProjectTaskTable ? "project-task-table" : "board-table"}">

      function renderTimeLockFields(period) {

          return '<label>Override Reason <input name="overrideReason" placeholder="Required for locked-period override"></label>';
        }
        return '<label>Request Reason <input name="requestReason" placeholder="Required for locked-period request"></label>';
      }

      function findClientPayPeriodForDate(dateValue) {
        const date = String(dateValue || "");
        return (state.data.payPeriods || []).find((period) => date >= String(period["Start Date"]) && date <= String(period["End Date"])) || null;
      }

      function renderTimeTracker() {

        const tracker = data.tracker || {};
        const targetUserId = tracker.targetUserId || state.timeFilters.userId || data.context.userId;

        const totalHours = entries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
        const selectedPeriod = tracker.selectedPayPeriod || data.currentPayPeriod || {};
        const periodLocked = String(selectedPeriod.Locked) === "true" || selectedPeriod.Status === "Locked";
        const selectedUser = (data.users || []).find((user) => user["User ID"] === targetUserId) || data.currentUser;
        const defaultEntryDate = selectedPeriod["Start Date"] || new Date().toISOString().slice(0, 10);

          <section class="toolbar">

          <section class="side-layout" data-sidebar-collapsed="${state.timeSidebarCollapsed ? "true" : "false"}">
            ${renderLayoutSidebar("Filters", "timeSidebarCollapsed", `
              ${canSelectUser ? `<label>User <select data-time-filter="userId">${options(data.users, "User ID", "Full Name", targetUserId, false)}</select></label>` : `<label>User <input value="${escapeHtml(selectedUser["Full Name"] || data.context.fullName)}" disabled></label>`}
              <label>Entries Period <select data-time-filter="payPeriodId">${options(data.payPeriods, "Pay Period ID", "Pay Period Label", state.timeFilters.payPeriodId, false)}</select></label>

            <div class="stack">
              <section class="panel">
                <h3>Log Time</h3>

                  <div class="form-grid">
                    <label>User <input value="${escapeHtml(selectedUser["Full Name"] || data.context.fullName)}" disabled></label>
                    <label>Entry Type <select name="entryType">
                      <option value="Task">Task Time</option>
                      <option value="General Time">General Time</option>
                    </select></label>
                    <label>Date <input name="date" type="date" value="${escapeHtml(defaultEntryDate)}"></label>
                    <label>Hours <input name="hours" type="number" min="0.1" max="24" step="0.1" required></label>
                  </div>
                  <div class="form-grid two" data-time-mode="task">
                    <label>Task <select name="taskId">${options(tracker.availableTasks || [], "Task ID", "Title", "", false)}</select></label>
                    <label>Notes <input name="notes" placeholder="Optional notes"></label>
                  </div>
                  <div class="form-grid two hidden" data-time-mode="general">
                    <label>Category <select name="categoryId">${options(tracker.categories || [], "Category ID", "Category", "", false)}</select></label>
                    <label>Notes <input name="generalNotes" placeholder="Optional notes"></label>
                  </div>
                  <div data-time-lock-fields>${renderTimeLockFields(periodLocked ? selectedPeriod : null)}</div>

                ${entries.length ? renderEntries(entries) : '<div class="empty">No time entries for this selection.</div>'}
                ${tracker.requests?.length ? `<h3>Pending Requests</h3>${renderTimeRequests(tracker.requests)}` : ""}

            </div>
          </section>

      function renderEntries(entries) {
        if (state.data.permissions.canViewAllTime) {
          const byUser = entries.reduce((acc, entry) => {
            const key = entry["User Name"] || "Unknown user";
            acc[key] = acc[key] || [];
            acc[key].push(entry);
            return acc;
          }, {});
          return Object.keys(byUser).sort().map((userName) => `
            <div class="group-heading">${escapeHtml(userName)}</div>
            ${renderEntriesByDay(byUser[userName])}
          `).join("");
        }
        return renderEntriesByDay(entries);
      }

      function renderEntriesByDay(entries) {
        const grouped = entries.reduce((acc, entry) => {
          const key = entry.Date || "No date";
          acc[key] = acc[key] || [];
          acc[key].push(entry);
          return acc;
        }, {});
        return Object.keys(grouped).sort().reverse().map((date) => {
          const dayEntries = grouped[date];
          const total = dayEntries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
          return `
            <div class="grouped-day">
              <div class="day-heading"><span>${escapeHtml(date)}</span><span>${total.toFixed(2)} hours</span></div>
              ${renderTimeEntriesTable(dayEntries, "timeEntries")}
            </div>`;
        }).join("");
      }

      function renderTimeRequests(requests) {
        const sortedRequests = sortTableRows(requests, "timeRequests", {
          request: (request) => `${request["Request Type"] || ""} ${request.Status || ""}`,

          reason: (request) => request.Reason
        });

                <tr>
                  <td data-label="Request">${escapeHtml(request["Request Type"])} &middot; ${escapeHtml(request.Status)}</td>
                  <td data-label="User">${escapeHtml(request["Requested By Name"])}</td>
                  <td data-label="Pay Period">${escapeHtml(request["Pay Period Label"])}</td>
                  <td data-label="Reason">${escapeHtml(request.Reason)}</td>
                  <td data-label="Actions">
                    ${state.data.permissions.canApproveTimeRequests && request.Status === "Pending" ? `
                      ${renderIcon("approve-time-request", "data-request-id", request["Time Edit Request ID"], "Approve", "&#10003;")}

                </tr>`).join("")}</tbody>
            </table>
          </div>`;

      function renderTimeEntriesTable(entries, tableKey) {
        const sortedEntries = sortTableRows(entries, tableKey, {
          entry: (entry) => entry["Task / Category"],
          project: (entry) => entry["Project Name"],
          hours: (entry) => entry.Hours,
          payPeriod: (entry) => entry["Pay Period Label"]
        });
        return `
          <div class="table-wrap">
            <table class="time-table">
              <thead><tr>${renderSortHeader(tableKey, "entry", "Entry")}${renderSortHeader(tableKey, "project", "Project")}${renderSortHeader(tableKey, "hours", "Hours")}${renderSortHeader(tableKey, "payPeriod", "Pay Period")}<th>Actions</th></tr></thead>
              <tbody>
                ${sortedEntries.map((entry) => `
                  <tr>
                    <td data-label="Entry"><strong>${escapeHtml(entry["Task / Category"])}</strong></td>
                    <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                    <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                    <td data-label="Pay Period">${escapeHtml(entry["Pay Period Label"])}</td>
                    <td data-label="Actions">
                      <div class="actions">
                        ${entry._permissions?.canEdit ? renderIcon("edit-time", "data-entry-id", entry["Time Entry ID"], "Edit time entry", "&#9998;") : ""}
                        ${entry._permissions?.canDelete ? renderIcon("delete-time", "data-entry-id", entry["Time Entry ID"], "Delete time entry", "&#128465;", true) : ""}
                      </div>
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      }

      function rangeOptions(selected) {
        const fixed = [
          ["current", "Current Pay Period"],
          ["last", "Last Pay Period"]
        ];
        const periods = (state.data.payPeriods || []).map((period) => [`period:${period["Pay Period ID"]}`, period["Pay Period Label"]]);
        const ranges = [
          ["this-year", "This Year"],
          ["last-year", "Last Year"],
          ["last-month", "Last Month"],
          ["ytd", "Year to Date"],
          ["custom", "Custom Range"]
        ];
        return fixed.concat(periods, ranges).map(([value, label]) => `<option value="${escapeHtml(value)}" ${String(value) === String(selected) ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
      }

      function payRangeOptions() {
        return rangeOptions(state.payFilters.rangeMode || "current");
      }

      function projectRangeOptions() {
        return rangeOptions(state.projectFilters.rangeMode || "current");
      }

      function buildPayFilters(extra = {}) {
        const rangeMode = state.payFilters.rangeMode || "current";
        const filters = {
          userId: state.payFilters.userId || "",
          rangeMode: rangeMode
        };
        if (rangeMode === "custom") {
          filters.startDate = state.payFilters.startDate || "";
          filters.endDate = state.payFilters.endDate || "";
        }
        return Object.assign(filters, extra);
      }

      function safePayFiltersForRefresh() {
        const filters = buildPayFilters();
        if (filters.rangeMode === "custom" && !(filters.startDate && filters.endDate)) {
          return {
            userId: state.payFilters.userId || "",
            rangeMode: "current"
          };
        }
        return filters;
      }

      function safeProjectFiltersForRefresh() {
        const filters = Object.assign({}, state.projectFilters);
        if (filters.rangeMode === "custom" && !(filters.startDate && filters.endDate)) {
          return {
            projectId: filters.projectId || "",
            includeArchived: Boolean(filters.includeArchived),
            rangeMode: "current"
          };
        }
        return filters;
      }

      function renderPaySummary() {
        const data = state.data;
        const summary = data.paySummary || { summaries: [] };
        const range = summary.range || {};

      function renderSettings() {
        const data = state.data;
        const organizationChildren = [
          ["organization", "Organization", data.permissions.canManageOrganization],
          ["users", "Users", data.permissions.canManageUsers],
          ["projects", "Projects", data.permissions.canManageProjects],
          ["tags", "Tags", data.permissions.canManageTags],
          ["categories", "Time Categories", data.permissions.canManageTimeCategories]
        ].filter((section) => section[2]);
        const sections = [
          ["profile", "Profile", true],
          ["organization-group", "Organization", organizationChildren.length],
          ["settings", "App Settings", data.permissions.canManageSettings],
          ["import", "Import", data.permissions.canImportLegacyData]
        ].filter((section) => section[2]);
        const availableSections = new Set(["profile", "organization", "users", "projects", "categories", "tags", "settings"].concat(data.permissions.canImportLegacyData ? ["import"] : []));
        if (!availableSections.has(state.settingsSection)) {
          state.settingsSection = "profile";
          saveStoredString("settingsSection", state.settingsSection);
        }
        return `
          <section class="toolbar">
            <div>
              <h2>Settings</h2>
              <p>Profile, organization settings, application settings, and imports</p>
            </div>
          </section>
          <section class="settings-layout" data-sidebar-collapsed="${state.settingsSidebarCollapsed ? "true" : "false"}">
            <aside class="panel side-pane">
              <button type="button" class="icon-button" data-action="toggle-settings-sidebar" title="${state.settingsSidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}" aria-label="${state.settingsSidebarCollapsed ? "Expand sidebar" : "Collapse sidebar"}">${state.settingsSidebarCollapsed ? "&#9654;" : "&#9664;"}</button>
              ${sections.map(([id, label]) => {
                if (id === "organization-group") {
                  return `
                    <div class="sidebar-group">
                      <button type="button" class="${state.settingsGroupOpen ? "active" : ""}" data-action="toggle-organization-group">${sidebarLabel("Org", "Organization")}</button>
                      ${state.settingsGroupOpen ? `<div class="sidebar-children">
                        ${organizationChildren.map(([childId, childLabel]) => `<button type="button" class="${state.settingsSection === childId ? "active" : ""}" data-settings-section="${childId}">${sidebarLabel(childLabel.slice(0, 3), childLabel)}</button>`).join("")}
                      </div>` : ""}
                    </div>`;
                }
                return `<button type="button" class="${state.settingsSection === id ? "active" : ""}" data-settings-section="${id}">${sidebarLabel(label.slice(0, 3), label)}</button>`;
              }).join("")}
            </aside>
            <div>${renderSettingsContent()}</div>
          </section>
        `;
      }

      function renderSettingsContent() {
        if (state.settingsSection === "organization") return renderOrganizationSettings();
        if (state.settingsSection === "users") return renderUsersSettings();
        if (state.settingsSection === "projects") return renderProjectsSettings();
        if (state.settingsSection === "categories") return renderCategoriesSettings();
        if (state.settingsSection === "tags") return renderTagsSettings();
        if (state.settingsSection === "settings") return renderAppSettings();
        if (state.settingsSection === "import") return renderImportAdmin();
        return renderProfileSettings();
      }

      function duplicateFieldsForKind(kind, record) {
        const row = record || {};

            ["Active", row.Active || ""]

          user: [

            ["Email", row.Email || ""],
            ["Role", row.Role || ""],
            ["Pay Type", row["Pay Type"] || row.PayType || ""]
          ],
          tag: [
            ["Tag", row.Tag || row["Tag Name"] || row.Name || ""],
            ["Color", row.Color || ""],
            ["Description", row.Description || ""]
          ],
          category: [
            ["Category", row.Category || ""],
            ["Default Project", row["Default Project"] || row.Project || ""]
          ],
          task: [
            ["Title", row.Title || row.Task || ""],
            ["Project", row["Project Name"] || row.Project || ""],
            ["Due Date", row["Due Date"] || row.Due || ""],
            ["Status", row.Status || ""]
          ],
          timeEntry: [
            ["Date", row.Date || ""],
            ["User", row["User Name"] || row.User || ""],
            ["Entry Type", row["Entry Type"] || ""],
            ["Task / Category", row["Task / Category"] || row.Task || row.Title || row.Category || ""],
            ["Project", row["Project Name"] || row.Project || ""],
            ["Hours", row.Hours || ""]
          ],
          payPeriod: [
            ["Pay Period", row["Pay Period"] || row["Pay Period Label"] || ""],
            ["Start Date", row["Start Date"] || row["Start Pay Period"] || ""],
            ["End Date", row["End Date"] || row["End Pay Period"] || ""]
          ],
          paySummary: [
            ["User", row["User Name"] || row.User || row["Full Name"] || ""],
            ["Pay Period", row["Pay Period"] || row["Pay Period Label"] || ""],
            ["Total Hours", row["Total Hours"] || row.Total || row.Hours || ""],
            ["Gross Pay", row["Gross Pay"] || row.Pay || ""]
          ]
        };
        return fields[kind] || Object.entries(row).slice(0, 4).map(([label, value]) => [label, value]);
      }

      function duplicateKindTitle(kind) {

      function updateTagPicker(picker) {
        const hidden = picker.querySelector('input[name="tags"]');
        const searchInput = picker.querySelector("[data-tag-search]");
        const query = String(searchInput?.value || "").trim().toLowerCase();
        const selected = selectedList(hidden.value);
        picker.querySelector("[data-tag-chips]").innerHTML = selected.map((tag) => `
          <span class="badge">${escapeHtml(tag)}<button type="button" class="chip-remove" data-action="remove-tag-selection" data-tag-name="${escapeHtml(tag)}" title="Remove ${escapeHtml(tag)}" aria-label="Remove ${escapeHtml(tag)}">&times;</button></span>
        `).join("");
        const matches = activeTags().filter((tag) => {
          if (selected.indexOf(tag.Tag) !== -1) return false;
          return !query || String(tag.Tag).toLowerCase().includes(query);
        }).slice(0, 12);
        const exact = activeTags().some((tag) => String(tag.Tag).toLowerCase() === query);
        const createButton = query && !exact && state.data.permissions.canManageTags
          ? `<button type="button" data-action="new-tag-from-task" data-tag-name="${escapeHtml(searchInput.value.trim())}">Create "${escapeHtml(searchInput.value.trim())}"</button>`
          : "";
        picker.querySelector("[data-tag-options]").innerHTML = matches.map((tag) => `<button type="button" data-action="add-tag-selection" data-tag-name="${escapeHtml(tag.Tag)}">${escapeHtml(tag.Tag)}</button>`).join("") + createButton;
      }

              <div class="actions"><button class="primary" type="submit">Save Category</button></div>
            </form>

      function openTagModal(tag = null, options = {}) {
        const html = `
          <div class="modal-backdrop">
            <form class="modal stack" data-form="tag" ${options.returnToTask ? 'data-return-to-task="true"' : ""}>
              <div class="modal-header"><h3>${tag ? "Edit Tag" : "Create Tag"}</h3><button type="button" data-action="close-modal">Close</button></div>
              <input type="hidden" name="tagId" value="${escapeHtml(tag?.["Tag ID"] || "")}">
              <label>Tag <input name="tag" value="${escapeHtml(options.prefill || tag?.Tag || "")}" required></label>
              <label>Color ${renderColorField("color", tag?.Color || "#1f6f68")}</label>
              <label>Description <textarea name="description">${escapeHtml(tag?.Description || "")}</textarea></label>
              <label class="checkbox-row"><input name="active" type="checkbox" ${String(tag?.Active) !== "false" ? "checked" : ""}> Active</label>
              <div class="actions"><button class="primary" type="submit">Save Tag</button></div>
            </form>
          </div>`;

      function openConfirmModal(message, action, payloadName, payloadValue, confirmLabel = "Delete", title = "Confirm Delete") {
        setModal(`
          <div class="modal-backdrop">
            <div class="modal stack">
              <div class="modal-header"><h3>${escapeHtml(title)}</h3><button type="button" data-action="close-modal">Close</button></div>
              <p>${escapeHtml(message)}</p>
              <div class="actions">
                <button type="button" data-action="${escapeHtml(action)}" ${payloadName}="${escapeHtml(payloadValue)}" class="danger">${escapeHtml(confirmLabel)}</button>
                <button type="button" data-action="close-modal">Cancel</button>
              </div>
            </div>
          </div>`);
      }

      function openCategoryBackfillModal(info) {
        setModal(`
          <div class="modal-backdrop">
            <div class="modal stack">
              <div class="modal-header"><h3>Update Historical Time Entries?</h3><button type="button" data-action="close-modal">Close</button></div>
              <p>${escapeHtml(info.historicalEntryCount)} prior time entr${info.historicalEntryCount === 1 ? "y" : "ies"} on "${escapeHtml(info.categoryName)}" still point at the previous project.</p>
              <div class="actions">
                <button type="button" data-action="confirm-category-backfill">Update Previous Entries</button>
                <button type="button" data-action="confirm-category-future-only">Future Only</button>

            </div>
          </div>`);
