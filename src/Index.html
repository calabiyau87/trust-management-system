      function renderHoursList(rows, emptyText, tableKey = "hoursList") {
        if (!rows || !rows.length) return `<div class="empty">${escapeHtml(emptyText)}</div>`;
        const sortedRows = sortTableRows(rows, tableKey, {
          name: (row) => row.label,
          hours: (row) => row.hours
        });
        return `<div class="table-wrap"><table><thead><tr>${renderSortHeader(tableKey, "name", "Name")}${renderSortHeader(tableKey, "hours", "Hours")}</tr></thead><tbody>
          ${sortedRows.map((row) => `<tr><td data-label="Name">${escapeHtml(row.label)}</td><td data-label="Hours">${escapeHtml(row.hours)}</td></tr>`).join("")}
        </tbody></table></div>`;
      }

      function renderCollapsibleSection(title, bodyHtml, meta = "", open = false) {
        return `
          <details class="collapsible-section"${open ? " open" : ""}>
            <summary>
              <span>${escapeHtml(title)}</span>
              ${meta ? `<span class="collapsible-meta">${escapeHtml(meta)}</span>` : ""}
            </summary>
            <div class="collapsible-body">${bodyHtml}</div>
          </details>`;
      }

      function openPaySummaryDetailModal(detail) {
        const taskTotalCount = (detail.taskTotals || []).length;
        const projectTotalCount = (detail.projectTotals || []).length;
        const entryCount = (detail.entries || []).length;
        pushModal(`
          <div class="modal-backdrop">
            <div class="modal stack pay-detail-modal">
              <div class="modal-header"><h3>Pay Details</h3><button type="button" data-action="close-modal">Close</button></div>
              <div class="profile-preview">${avatarForUser(detail.user)}<strong>${escapeHtml(detail.user["Full Name"])}</strong><span>${escapeHtml(detail.range.label)}</span></div>
              <div class="form-grid two">
                <div class="panel" style="box-shadow:none;margin:0;"><h3>Total Hours</h3><strong>${escapeHtml(detail.metrics.totalHours)}</strong></div>
                <div class="panel" style="box-shadow:none;margin:0;"><h3>Average Hours / Week</h3><strong>${escapeHtml(detail.metrics.averageHoursPerWeek)}</strong></div>
              </div>
              ${renderCollapsibleSection("Task Time", renderHoursList(detail.taskTotals, "No task time in this range.", "payDetailTaskTotals"), `${taskTotalCount} item${taskTotalCount === 1 ? "" : "s"}`)}
              ${renderCollapsibleSection("Project Time", renderHoursList(detail.projectTotals, "No project time in this range.", "payDetailProjectTotals"), `${projectTotalCount} item${projectTotalCount === 1 ? "" : "s"}`)}
              ${renderCollapsibleSection("Entries", `<div class="table-wrap"><table>
                <thead><tr>${renderSortHeader("payDetailEntries", "date", "Date")}${renderSortHeader("payDetailEntries", "entry", "Entry")}${renderSortHeader("payDetailEntries", "project", "Project")}${renderSortHeader("payDetailEntries", "hours", "Hours")}</tr></thead>
                <tbody>${sortTableRows(detail.entries || [], "payDetailEntries", {
                  date: (entry) => entry.Date,
                  entry: (entry) => entry["Task / Category"],
                  project: (entry) => entry["Project Name"],
                  hours: (entry) => entry.Hours
                }).map((entry) => `<tr>
                  <td data-label="Date">${escapeHtml(entry.Date)}</td>
                  <td data-label="Entry">${escapeHtml(entry["Task / Category"])}</td>
                  <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                  <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                </tr>`).join("")}</tbody>
              </table></div>`, `${entryCount} item${entryCount === 1 ? "" : "s"}`)}
            </div>
          </div>`);

      document.addEventListener("click", async (event) => {
        if (event.target.classList?.contains("modal-backdrop")) {
          closeTopModal();
          return;
        }
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          state.tab = tabButton.dataset.tab;
          state.status = "";
          render();
          return;
        }
        const settingsButton = event.target.closest("[data-settings-section]");
        if (settingsButton) {
          state.settingsSection = settingsButton.dataset.settingsSection;
          saveStoredString("settingsSection", state.settingsSection);
          render();
          return;
        }
        const sortButton = event.target.closest("[data-sort-table]");
        if (sortButton) {
          closeActionMenus();
          setTableSort(sortButton.dataset.sortTable, sortButton.dataset.sortColumn, sortButton.dataset.sortDirection || "asc");
          render();
          return;
        }
        const boardGroupToggle = event.target.closest("[data-board-group-key]");
        if (boardGroupToggle) {
          closeActionMenus();
          const key = boardGroupToggle.dataset.boardGroupKey;
          setBoardGroupExpanded(key, !isBoardGroupExpanded(key));
          render();
          return;
        }
        const actionMenuTrigger = event.target.closest("[data-action-menu-trigger]");
        if (actionMenuTrigger) {
          const menu = actionMenuTrigger.closest("[data-action-popover]");
          if (menu) {
            const isOpen = menu.dataset.open === "true";
            closeActionMenus();
            menu.dataset.open = isOpen ? "false" : "true";
            actionMenuTrigger.setAttribute("aria-expanded", isOpen ? "false" : "true");
          }
          return;
        }
        if (!event.target.closest("[data-action-popover]")) {
          closeActionMenus();
        }
        const action = event.target.closest("[data-action]")?.dataset.action;
          if (!action) return;
        try {
          closeActionMenus();
          if (action === "close-modal") {
            state.pendingCategorySave = null;
            state.pendingMigrationImport = null;
            closeTopModal();
          } else if (action === "toggle-settings-sidebar") {
            state.settingsSidebarCollapsed = !state.settingsSidebarCollapsed;
            saveStoredBool("settingsSidebarCollapsed", state.settingsSidebarCollapsed);
            render();
          } else if (action === "toggle-sidebar") {
            const key = event.target.closest("[data-sidebar-key]")?.dataset.sidebarKey;
            if (key && key in state) {
              state[key] = !state[key];
              saveStoredBool(key, state[key]);
              render();
            }
          } else if (action === "toggle-organization-group") {
            state.settingsGroupOpen = !state.settingsGroupOpen;
            saveStoredBool("settingsGroupOpen", state.settingsGroupOpen);
            render();
          } else if (action === "new-task") {
            openTaskModal();
          } else if (action === "save-board-view") {
            openBoardViewModal();
          } else if (action === "clear-board-filters") {
            state.boardFilters = {};
            state.boardGrouping = "";
            state.selectedBoardViewId = "";
            state.boardGroupExpanded = {};
            render();
          } else if (action === "delete-board-view") {
            const view = selectedBoardView();
            if (view) openConfirmModal(`Delete saved view "${view["View Name"]}"?`, "confirm-delete-board-view", "data-board-view-id", view["Board View ID"]);
          } else if (action === "confirm-delete-board-view") {
            await callServer("archiveBoardView", event.target.closest("[data-board-view-id]").dataset.boardViewId);
            state.selectedBoardViewId = "";
            clearModals();
            await refreshBoardData("Board view deleted.");
          } else if (action === "refresh-project-dashboard") {
            await refreshProjectDashboardData("Project dashboard refreshed.");
          } else if (action === "select-project-dashboard") {
            state.projectFilters.projectId = event.target.closest("[data-project-id]").dataset.projectId;
            await refreshProjectDashboardData("Project selected.");
          } else if (action === "clear-project-filter") {
            state.projectFilters.projectId = "";
            await refreshProjectDashboardData("Project selection cleared.");
          } else if (action === "archive-project-dashboard") {
            openConfirmModal("Archive this project?", "confirm-archive-project-dashboard", "data-project-id", event.target.closest("[data-project-id]").dataset.projectId);
          } else if (action === "confirm-archive-project-dashboard") {
            await callServer("archiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            clearModals();
            await refreshData({ message: "Project archived." });
          } else if (action === "unarchive-project") {
            await callServer("unarchiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            await refreshData({ message: "Project restored." });
          } else if (action === "edit-task") {
            const task = state.data.tasks.find((item) => item["Task ID"] === event.target.closest("[data-task-id]").dataset.taskId);
            openTaskModal(task);
          } else if (action === "delete-task") {
            openConfirmModal("Delete this task? Existing audit history will be preserved.", "confirm-delete-task", "data-task-id", event.target.closest("[data-task-id]").dataset.taskId);
          } else if (action === "confirm-delete-task") {
            await callServer("archiveTask", event.target.closest("[data-task-id]").dataset.taskId);
            clearModals();
            await refreshBoardData("Task deleted.");
          } else if (action === "complete-task") {
            await callServer("completeTask", event.target.closest("[data-task-id]").dataset.taskId);
            await refreshBoardData("Task completed.");
          } else if (action === "add-time") {
            const taskId = event.target.closest("[data-task-id]").dataset.taskId;
            state.tab = "time";
            render();
            const taskSelect = document.querySelector('[name="taskId"]');
            if (taskSelect) taskSelect.value = taskId;
          } else if (action === "edit-time") {
            const entryId = event.target.closest("[data-entry-id]").dataset.entryId;
            const entry = (state.data.tracker.entries || []).find((item) => item["Time Entry ID"] === entryId);
            openTimeModal(entry);
          } else if (action === "delete-time") {
            openConfirmModal("Delete this time entry?", "confirm-delete-time", "data-entry-id", event.target.closest("[data-entry-id]").dataset.entryId);
          } else if (action === "confirm-delete-time") {
            await callServer("deleteTimeEntry", {
              timeEntryId: event.target.closest("[data-entry-id]").dataset.entryId,
              overrideReason: state.data.permissions.canOverrideLockedPeriod ? "Deleted by permitted user from Time Tracker" : "",
              requestReason: "Delete requested from Time Tracker"
            });
            clearModals();
            await refreshTrackerData("Time entry deleted or request created.");
          } else if (action === "lock-period") {
            const periodId = state.data.paySummary?.payPeriod?.["Pay Period ID"];
            const saved = await callServer("lockPayPeriod", periodId);
            state.data.payPeriods = (state.data.payPeriods || []).map((period) => period["Pay Period ID"] === saved["Pay Period ID"] ? saved : period);
            await refreshPaySummaryData("Pay period locked.");
          } else if (action === "unlock-period") {
            const periodId = state.data.paySummary?.payPeriod?.["Pay Period ID"];
            const saved = await callServer("unlockPayPeriod", periodId);
            state.data.payPeriods = (state.data.payPeriods || []).map((period) => period["Pay Period ID"] === saved["Pay Period ID"] ? saved : period);
            await refreshPaySummaryData("Pay period unlocked.");
          } else if (action === "approve-time-request") {
            await callServer("approveTimeEditRequest", event.target.closest("[data-request-id]").dataset.requestId, "Approved in Time Tracker");
            await refreshTrackerData("Request approved.");
          } else if (action === "reject-time-request") {
            await callServer("rejectTimeEditRequest", event.target.closest("[data-request-id]").dataset.requestId, "Rejected in Time Tracker");
            await refreshTrackerData("Request rejected.");
          } else if (action === "remove-profile-image") {
            openConfirmModal("Remove this profile image? This will delete the uploaded file if one exists.", "confirm-remove-profile-image", "data-user-id", state.data.currentUser["User ID"], "Remove", "Confirm Remove");
          } else if (action === "confirm-remove-profile-image") {
            await callServer("removeProfileImage", event.target.closest("[data-user-id]").dataset.userId);
            clearModals();
            await refreshData({ message: "Profile image removed." });
          } else if (action === "new-user") {
            openUserModal();
          } else if (action === "edit-user") {
            openUserModal(state.data.users.find((user) => user["User ID"] === event.target.closest("[data-user-id]").dataset.userId));
          } else if (action === "delete-user") {
            openConfirmModal("Archive this user?", "confirm-delete-user", "data-user-id", event.target.closest("[data-user-id]").dataset.userId);
          } else if (action === "confirm-delete-user") {
            await callServer("archiveUser", event.target.closest("[data-user-id]").dataset.userId);
            clearModals();
            await refreshData({ message: "User archived." });
          } else if (action === "new-project") {
            openProjectModal();
          } else if (action === "edit-project") {
            openProjectModal(state.data.projects.find((project) => project["Project ID"] === event.target.closest("[data-project-id]").dataset.projectId));
          } else if (action === "edit-project-task") {
            const taskId = event.target.closest("[data-task-id]").dataset.taskId;
            const selectedProject = state.data.projectDashboard?.selectedProject;
            const task = (selectedProject?.tasks || []).find((item) => item["Task ID"] === taskId) || state.data.tasks.find((item) => item["Task ID"] === taskId);
            if (task) openTaskModal(task);
          } else if (action === "delete-project") {
            openConfirmModal("Archive this project?", "confirm-delete-project", "data-project-id", event.target.closest("[data-project-id]").dataset.projectId);
          } else if (action === "confirm-delete-project") {
            await callServer("archiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            clearModals();
            await refreshData({ message: "Project archived." });
          } else if (action === "new-category") {
            openCategoryModal();
          } else if (action === "edit-category") {
            openCategoryModal(state.data.categories.find((category) => category["Category ID"] === event.target.closest("[data-category-id]").dataset.categoryId));
          } else if (action === "delete-category") {
            openConfirmModal("Archive this category?", "confirm-delete-category", "data-category-id", event.target.closest("[data-category-id]").dataset.categoryId);
          } else if (action === "confirm-delete-category") {
            await callServer("archiveCategory", event.target.closest("[data-category-id]").dataset.categoryId);
            clearModals();
            await refreshData({ message: "Category archived." });
          } else if (action === "new-tag") {
            openTagModal();
          } else if (action === "new-tag-from-task") {
            openTagModal(null, { stack: true, returnToTask: true, prefill: event.target.closest("[data-tag-name]").dataset.tagName });
            setTimeout(() => document.querySelector('#modal-root .modal-backdrop:last-child [name="tag"]')?.focus(), 0);
          } else if (action === "add-tag-selection") {
            const picker = event.target.closest("[data-tag-picker]");
            const hidden = picker.querySelector('input[name="tags"]');
            const selected = selectedList(hidden.value);
            const tagName = event.target.closest("[data-tag-name]").dataset.tagName;
            if (selected.indexOf(tagName) === -1) selected.push(tagName);
            hidden.value = selected.join(", ");
            picker.querySelector("[data-tag-search]").value = "";
            updateTagPicker(picker);
          } else if (action === "remove-tag-selection") {
            const picker = event.target.closest("[data-tag-picker]");
            const hidden = picker.querySelector('input[name="tags"]');
            const tagName = event.target.closest("[data-tag-name]").dataset.tagName;
            hidden.value = selectedList(hidden.value).filter((item) => item !== tagName).join(", ");
            updateTagPicker(picker);
          } else if (action === "edit-tag") {
            openTagModal((state.data.tags || []).find((tag) => tag["Tag ID"] === event.target.closest("[data-tag-id]").dataset.tagId));
          } else if (action === "delete-tag") {
            openConfirmModal("Archive this tag? Existing task tag text will be preserved.", "confirm-delete-tag", "data-tag-id", event.target.closest("[data-tag-id]").dataset.tagId);
          } else if (action === "confirm-delete-tag") {
            await callServer("archiveTag", event.target.closest("[data-tag-id]").dataset.tagId);
            clearModals();
            await refreshData({ message: "Tag archived." });
          } else if (action === "confirm-category-backfill") {
            const pending = state.pendingCategorySave;
            if (!pending) return;
            state.pendingCategorySave = null;
            await callServer("saveCategory", Object.assign({}, pending, { backfillExistingEntries: true }));
            clearModals();
            await refreshData({ message: "Category saved and historical entries updated." });
          } else if (action === "confirm-category-future-only") {
            const pending = state.pendingCategorySave;
            if (!pending) return;
            state.pendingCategorySave = null;
            await callServer("saveCategory", Object.assign({}, pending, { backfillExistingEntries: false }));
            clearModals();
            await refreshData({ message: "Category saved for future entries only." });
          } else if (action === "share-user-spreadsheet") {
            await callServer("shareSpreadsheetWithUser", event.target.closest("[data-user-id]").dataset.userId);
            setStatus("Spreadsheet shared with user.");
          } else if (action === "open-pay-detail") {
            const userId = event.target.closest("[data-user-id]").dataset.userId;
            const detail = await callServer("getPaySummaryDetail", buildPayFilters({ userId }));
            openPaySummaryDetailModal(detail);
          } else if (action === "diagnose-user") {
            const email = document.querySelector("[data-diagnostic-email]")?.value || "";
            const result = await callServer("diagnoseUserAccess", email);
            setStatus(result.issue || `User ${result.normalizedEmail} is active as ${result.role}.`);
          } else if (action === "migration-preview") {
            const form = event.target.closest('form[data-form="migration"]');
            const payload = await buildLegacyMigrationPayload(form);
            const preview = await callServer("getLegacyMigrationPreview", payload);
            if (preview.sourceType === "current") {
              setStatus(`Prototype rows: Assignment Board ${preview.assignmentBoardRows}, Imported Tasks ${preview.importedTaskRows}.`);
            } else {
              setStatus(`Legacy source rows: Projects ${preview.rows.projects}, Users ${preview.rows.users}, Tasks ${preview.rows.assignmentBoard + preview.rows.importedTasks}, Time logs ${preview.rows.timeLog}, Pay summaries ${preview.rows.paySummary}, Tags ${preview.rows.tags}.`);
              if (payload.importMode !== "overwrite" && (preview.duplicates || []).length) {
                openLegacyDuplicateReview(preview, payload);
              }
            }
          } else if (action === "confirm-legacy-import") {
            const pending = state.pendingMigrationImport;
            if (!pending) return;
            const duplicates = pending.preview.duplicates || [];
            const applyAll = document.querySelector("[data-duplicate-apply-all]")?.checked;
            const duplicateDecisions = {};
            const sharedChoice = applyAll ? (document.querySelector("[data-duplicate-decision='0']")?.value || "keep") : null;
            duplicates.forEach((duplicate, index) => {
              const bucket = duplicateDecisions[duplicate.kind] || (duplicateDecisions[duplicate.kind] = {});
              bucket[duplicate.fingerprint] = applyAll ? sharedChoice : (document.querySelector(`[data-duplicate-decision="${index}"]`)?.value || "keep");
            });
            const result = await callServer("importLegacyWorkbook", Object.assign({}, pending.payload, { duplicateDecisions }));
            const summary = `Imported legacy data: ${result.projects.created + result.projects.updated} projects, ${result.users.created + result.users.updated} users, ${result.tags.imported || (result.tags.created + result.tags.updated)} tags, ${result.tasks.created + result.tasks.updated} tasks, ${result.timeEntries.created + result.timeEntries.updated} time entries, ${result.paySummaries.created + result.paySummaries.updated} pay summaries.`;
            state.pendingMigrationImport = null;
            clearModals();
            await refreshData({ message: summary });
          }
        } catch (error) {
          setStatus(error.message || String(error));
        }
      });

      document.addEventListener("input", async (event) => {
        if (event.target.matches("[data-filter]")) {
          state.boardFilters[event.target.dataset.filter] = event.target.value;
          updateBoardResultsOnly();
        }
        if (event.target.closest('[data-form="migration"]') && event.target.name === "spreadsheetId") {
          state.migrationSpreadsheetId = event.target.value;
        }
        if (event.target.matches("[data-tag-search]")) {
          updateTagPicker(event.target.closest("[data-tag-picker]"));
        }
        if (event.target.matches("[data-color-wheel]")) {
          const name = event.target.dataset.colorWheel;
          const hex = document.querySelector(`[data-color-hex="${cssEscape(name)}"]`);
          if (hex) hex.value = event.target.value;
        }
        if (event.target.matches("[data-color-hex]")) {
          const name = event.target.dataset.colorHex;
          const wheel = document.querySelector(`[data-color-wheel="${cssEscape(name)}"]`);
          if (wheel && /^#[0-9a-fA-F]{6}$/.test(event.target.value)) wheel.value = event.target.value;
        }
        if (event.target.matches("[data-duplicate-decision]")) {
          syncDuplicateApplyAll();
        }
      });

      document.addEventListener("change", async (event) => {
        if (event.target.matches("[data-filter]")) {
          state.boardFilters[event.target.dataset.filter] = event.target.value;
          updateBoardResultsOnly();
        }
        if (event.target.closest('[data-form="migration"]') && event.target.name === "importMode") {
          state.migrationImportMode = event.target.value;
        }
        if (event.target.matches("[data-user-pay-type], [name='trackPay']")) {
          syncUserPayFields(event.target.closest('[data-form="user"]'));
        }
        if (event.target.matches('[name="sourceType"]')) {
          state.migrationSourceType = event.target.value;
          syncMigrationMode(event.target.closest('[data-form="migration"]'));
        }
        if (event.target.matches("[data-board-grouping]")) {
          state.boardGrouping = event.target.value;
          state.boardGroupExpanded = {};
          render();
        }
        if (event.target.matches('[data-action="load-board-view"]')) {
          state.selectedBoardViewId = event.target.value;
          const view = (state.data.boardViews || []).find((item) => item["Board View ID"] === event.target.value);
          if (view) {
            try {
              state.boardFilters = JSON.parse(view["Filters JSON"] || "{}");
            } catch (error) {
              state.boardFilters = {};
            }
            state.boardGrouping = view.Grouping || "";
            state.boardGroupExpanded = {};
            render();
          } else {
            state.boardFilters = {};
            state.boardGrouping = "";
            state.boardGroupExpanded = {};
            render();
          }
        }
        if (event.target.matches("[data-pay-filter]")) {
          state.payFilters[event.target.dataset.payFilter] = event.target.value;
          try {
            if (state.payFilters.rangeMode !== "custom" || (state.payFilters.startDate && state.payFilters.endDate)) {
              await refreshPaySummaryData("Pay summary refreshed.");
            } else {
              render();
            }
          } catch (error) {
            setStatus(error.message || String(error));
          }
        }
        if (event.target.matches("[data-project-filter]")) {
          const key = event.target.dataset.projectFilter;
          if (event.target.type === "checkbox") {
            state.projectFilters[key] = event.target.checked;
          } else {
            state.projectFilters[key] = event.target.value;
          }
          try {
            if (state.projectFilters.rangeMode !== "custom" || (state.projectFilters.startDate && state.projectFilters.endDate)) {
              await refreshProjectDashboardData("Project dashboard refreshed.");
            } else {
              render();
            }
          } catch (error) {
            setStatus(error.message || String(error));
          }
        }
        if (event.target.name === "entryType") {
          const form = event.target.closest("form");
          form?.querySelector('[data-time-mode="task"]')?.classList.toggle("hidden", event.target.value !== "Task");
          form?.querySelector('[data-time-mode="general"]')?.classList.toggle("hidden", event.target.value !== "General Time");
        }
        if (event.target.matches("[data-time-filter]")) {
          state.timeFilters[event.target.dataset.timeFilter] = event.target.value;
          try {
            await refreshTrackerData("Time tracker refreshed.");
          } catch (error) {
            setStatus(error.message || String(error));
          }
        }
        if (event.target.matches("[data-duplicate-apply-all]")) {
          syncDuplicateApplyAll();
        }
        if (event.target.matches("[data-duplicate-decision]")) {
          syncDuplicateApplyAll();
        }
        if (event.target.closest('[data-form="time-entry"], [data-form="time-modal"]') && event.target.name === "date") {
          const form = event.target.closest("form");
          const container = form.querySelector("[data-time-lock-fields]");
          if (container && event.target.value) {
            try {
              const period = await callServer("getPayPeriodForDate", event.target.value);
              container.innerHTML = renderTimeLockFields(period);
            } catch (error) {
              setStatus(error.message || String(error));
            }
          }
        }
      });

      function readFileAsDataUrl(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(file);
        });
      }

      function cropProfileImage(file, maxSize = 512) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => {
            const image = new Image();
            image.onload = () => {
              const size = Math.min(maxSize, image.width, image.height);
              const canvas = document.createElement("canvas");
              canvas.width = size;
              canvas.height = size;
              const context = canvas.getContext("2d");
              const sourceSize = Math.min(image.width, image.height);
              const sourceX = Math.floor((image.width - sourceSize) / 2);
              const sourceY = Math.floor((image.height - sourceSize) / 2);
              context.fillStyle = "#ffffff";
              context.fillRect(0, 0, size, size);
              context.drawImage(image, sourceX, sourceY, sourceSize, sourceSize, 0, 0, size, size);
              resolve(canvas.toDataURL("image/jpeg", 0.9));
            };
            image.onerror = reject;
            image.src = reader.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      function readFileAsText(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ""));
          reader.onerror = () => reject(reader.error);
          reader.readAsText(file);
        });
      }

      function parseLegacyCsv(text) {
        const rows = [];
        const currentRow = [];
        let currentValue = "";
        let inQuotes = false;
        const source = String(text || "").replace(/\uFEFF/g, "");
        for (let index = 0; index < source.length; index += 1) {
          const char = source[index];
          const next = source[index + 1];
          if (inQuotes) {
            if (char === '"' && next === '"') {
              currentValue += '"';
              index += 1;
            } else if (char === '"') {
              inQuotes = false;
            } else {
              currentValue += char;
            }
            continue;
          }
          if (char === '"') {
            inQuotes = true;
          } else if (char === ',') {
            currentRow.push(currentValue);
            currentValue = "";
          } else if (char === '\n') {
            currentRow.push(currentValue);
            if (currentRow.some((cell) => String(cell || "").trim())) rows.push(currentRow.slice());
            currentRow.length = 0;
            currentValue = "";
          } else if (char !== '\r') {
            currentValue += char;
          }
        }
        currentRow.push(currentValue);
        if (currentRow.some((cell) => String(cell || "").trim())) rows.push(currentRow.slice());
        if (!rows.length) return [];
        const headers = rows.shift().map((header) => String(header || "").trim());
        return rows
          .filter((row) => row.some((cell) => String(cell || "").trim()))
          .map((row, index) => {
            const record = { _rowNumber: index + 2 };
            headers.forEach((header, headerIndex) => {
              if (!header) return;
              record[header] = row[headerIndex] !== undefined ? row[headerIndex] : "";
            });
            return record;
          });
      }

      function normalizeLegacySheetName(name) {
        const key = String(name || "").toLowerCase().replace(/[^a-z]/g, "");
        const map = {
          assignmentboard: "Assignment Board",
          timelog: "Time Log",
          paysummary: "Pay Summary",
          projects: "Projects",
          users: "Users",
          timecategories: "Time Categories",
          prioritylist: "Priority List",
          tags: "Tags",
          importedtasks: "Imported Tasks"
        };
        return map[key] || String(name || "").replace(/\.csv$/i, "").trim();
      }

      async function buildLegacyMigrationPayload(form) {
        const sourceType = form.sourceType.value;
        if (sourceType === "sheet") {
          return {
            sourceType: "sheet",
            spreadsheetId: String(form.spreadsheetId.value || "").trim(),
            importMode: form.importMode.value
          };
        }
        const files = Array.from(form.legacyFiles?.files || []);
        if (!files.length) {
          throw new Error("Select at least one CSV file.");
        }
        const tables = {};
        for (const file of files) {
          const rows = parseLegacyCsv(await readFileAsText(file));
          tables[normalizeLegacySheetName(file.name)] = rows;
        }
        return {
          sourceType: "csv",
          tables,
          importMode: form.importMode.value
        };
      }

      document.addEventListener("submit", async (event) => {
        const form = event.target;
        const formType = form.dataset.form;
        if (!formType) return;
        event.preventDefault();
        try {
          if (formType === "task-modal") {
            const selectedAssignees = Array.from(form.querySelectorAll('[name="assigneeUserIds"]:checked')).map((option) => option.value);
            const selectedTags = selectedList(form.tags?.value || "");
            const payload = {
              taskId: form.taskId.value,
              title: form.title.value,
              notes: form.notes.value,
              status: form.status.value,
              dueDate: form.dueDate.value,
              projectId: form.projectId.value,
              priority: form.priority.value,
              assigneeUserIds: selectedAssignees,
              tags: selectedTags
            };
            await callServer(payload.taskId ? "updateTask" : "createTask", payload);
            clearModals();
            await refreshBoardData("Task saved.");
          } else if (formType === "time-entry") {
            const entryType = form.entryType.value;
            const payload = {
              userId: state.timeFilters.userId || state.data.context.userId,
              entryType: entryType,
              date: form.date.value,
              hours: form.hours.value,
              taskId: form.taskId?.value || "",
              categoryId: form.categoryId?.value || "",
              notes: entryType === "Task" ? form.notes.value : form.generalNotes.value,
              overrideReason: form.overrideReason?.value || "",
              requestReason: form.requestReason?.value || ""
            };
            const savedTime = await callServer("createTimeEntry", payload);
            const savedPeriodId = savedTime["Pay Period ID"] || savedTime.request?.["Pay Period ID"];
            if (savedPeriodId) state.timeFilters.payPeriodId = savedPeriodId;
            await refreshTrackerData("Time saved or request created.");
          } else if (formType === "time-modal") {
            await callServer("updateTimeEntry", {
              timeEntryId: form.timeEntryId.value,
              userId: form.userId?.value || undefined,
              entryType: form.entryType.value,
              date: form.date.value,
              hours: form.hours.value,
              taskId: form.taskId?.value || "",
              categoryId: form.categoryId?.value || "",
              projectId: form.projectId?.value || "",
              notes: form.notes.value,
              overrideReason: form.overrideReason?.value || "",
              requestReason: form.requestReason?.value || ""
            });
            clearModals();
            await refreshTrackerData("Time entry updated or request created.");
          } else if (formType === "board-view-modal") {
            const saved = await callServer("saveBoardView", buildBoardViewPayload(form));
            state.selectedBoardViewId = saved["Board View ID"];
            clearModals();
            await refreshBoardData("Board view saved.");
          } else if (formType === "profile") {
            const profilePayload = {
              firstName: form.firstName.value,
              lastName: form.lastName.value,
              fullName: form.fullName.value,
              themeMode: form.themeMode.value,
              googleProfilePhotoUrl: form.googleProfilePhotoUrl.value
            };
            if (form.profileColor) profilePayload.profileColor = form.profileColor.value;
            let savedProfile = await callServer("updateProfile", profilePayload);
            if (form.profileImage?.files?.[0]) {
              savedProfile = await callServer("uploadProfileImage", {
                dataUrl: await cropProfileImage(form.profileImage.files[0])
              });
            }
            state.data.currentUser = savedProfile;
            state.data.context.fullName = savedProfile["Full Name"];
            applyUserPreferences();
            await refreshData({ message: "Profile saved." });
          } else if (formType === "organization") {
            await callServer("saveSetting", {
              key: "ORGANIZATION_NAME",
              value: form.organizationName.value,
              description: "Organization name displayed in the app shell."
            });
            await refreshData({ message: "Organization saved." });
          } else if (formType === "user") {
            const savedUser = await callServer("saveUser", {
              userId: form.userId.value,
              firstName: form.firstName.value,
              lastName: form.lastName.value,
              fullName: form.fullName.value,
              email: form.email.value,
              role: form.role.value,
              payType: form.payType.value,
              hourlyRate: form.hourlyRate.value,
              salaryAmount: form.salaryAmount.value,
              salaryFrequency: form.salaryFrequency.value,
              themeMode: form.themeMode.value,
              profileColor: form.profileColor.value,
              active: form.active.checked,
              "Track Time": form.trackTime.checked,
              "Track Pay": form.trackPay.checked
            });
            const permissions = {};
            Array.from(form.querySelectorAll('[name="permission"]')).forEach((input) => {
              permissions[input.value] = input.checked;
            });
            if (Object.keys(permissions).length) {
              await callServer("saveUserPermissions", {
                userId: savedUser["User ID"],
                permissions
              });
            }
            form.reset();
            clearModals();
            const userMessage = state.data.userPermissions?.length
              ? (savedUser.shareError ? `User saved. Spreadsheet share failed: ${savedUser.shareError}` : "User saved and spreadsheet shared.")
              : "User saved.";
            await refreshData({ message: userMessage });
          } else if (formType === "project") {
            await callServer("saveProject", {
              projectId: form.projectId.value,
              projectName: form.projectName.value,
              description: form.description.value,
              status: form.status.value,
              active: form.active.checked
            });
            form.reset();
            clearModals();
            await refreshData({ message: "Project saved." });
          } else if (formType === "category") {
            const payload = {
              categoryId: form.categoryId.value,
              category: form.category.value,
              defaultProjectId: form.defaultProjectId.value,
              active: form.active.checked
            };
            const preview = await callServer("saveCategory", Object.assign({}, payload, { previewOnly: true }));
            if (preview.requiresBackfill) {
              state.pendingCategorySave = payload;
              openCategoryBackfillModal(preview);
              return;
            }
            form.reset();
            clearModals();
            await refreshData({ message: "Category saved." });
          } else if (formType === "migration") {
            const payload = await buildLegacyMigrationPayload(form);
            const preview = await callServer("getLegacyMigrationPreview", payload);
            const duplicates = preview.duplicates || [];
            if (payload.importMode !== "overwrite" && duplicates.length) {
              openLegacyDuplicateReview(preview, payload);
              return;
            }
            if (payload.importMode === "overwrite") {
              state.pendingMigrationImport = { payload, preview };
              openConfirmModal("Overwrite existing canonical data with the imported data? The original owner row will be preserved.", "confirm-legacy-import", "data-pending-import", "true", "Overwrite", "Confirm Overwrite");
              return;
            }
            const result = await callServer("importLegacyWorkbook", payload);
            const summary = `Imported legacy data: ${result.projects.created + result.projects.updated} projects, ${result.users.created + result.users.updated} users, ${result.tags.imported || (result.tags.created + result.tags.updated)} tags, ${result.tasks.created + result.tasks.updated} tasks, ${result.timeEntries.created + result.timeEntries.updated} time entries, ${result.paySummaries.created + result.paySummaries.updated} pay summaries.`;
            await refreshData({ message: summary });
          } else if (formType === "tag") {
            const savedTag = await callServer("saveTag", {
              tagId: form.tagId.value,
              tag: form.tag.value,
              color: form.color.value,
              description: form.description.value,
              active: form.active.checked
            });
            upsertLocalTag(savedTag);
            if (form.dataset.returnToTask === "true") {
              closeTopModal();
              const picker = document.querySelector("[data-tag-picker]");
              if (picker) {
                const hidden = picker.querySelector('input[name="tags"]');
                const selected = selectedList(hidden.value);
                if (selected.indexOf(savedTag.Tag) === -1) selected.push(savedTag.Tag);
                hidden.value = selected.join(", ");
                updateTagPicker(picker);
                picker.querySelector("[data-tag-search]")?.focus();
              }
              setStatus("Tag saved.");
            } else {
              clearModals();
              await refreshData({ message: "Tag saved." });
            }
          } else if (formType === "setting") {
            await callServer("saveSetting", {
              key: form.key.value,
              value: form.value.value,
              description: form.description.value
            });
            form.reset();
            await refreshData({ message: "Setting saved." });
          } else if (formType === "explicit-settings") {
            await callServer("saveSetting", {
              key: "PAY_PERIOD_ANCHOR_DATE",
              value: form.anchorDate.value,
              description: "Known start date for the repeating pay-period calendar."
            });
            await callServer("saveSetting", {
              key: "DEFAULT_PAY_PERIOD_DAYS",
              value: form.periodDays.value,
              description: "Number of calendar days in each pay period."
            });
            const statusColors = {};
            Array.from(form.querySelectorAll('[name^="statusColor__"]')).forEach((input) => {
              const status = input.name.replace("statusColor__", "");
              statusColors[status] = normalizeHex(input.value, "#647181");
            });
            await callServer("saveSetting", {
              key: "TASK_STATUS_COLORS_JSON",
              value: JSON.stringify(statusColors),
              description: "Hex colors used for Assignment Board task status badges."
            });
            const projectStatusColors = {};
            Array.from(form.querySelectorAll('[name^="projectStatusColor__"]')).forEach((input) => {
              const status = input.name.replace("projectStatusColor__", "");
              projectStatusColors[status] = normalizeHex(input.value, "#647181");
            });
            await callServer("saveSetting", {
              key: "PROJECT_STATUS_COLORS_JSON",
              value: JSON.stringify(projectStatusColors),
              description: "Hex colors used for project status badges."
            });
            await refreshData({ message: "Settings saved." });
          }
        } catch (error) {
          setStatus(error.message || String(error));
        }
      });

      window.addEventListener("resize", syncStickyOffsets);
      loadInitial();
    </script>
  </body>
</html>
