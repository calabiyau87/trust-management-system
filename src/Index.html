<!doctype html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --surface-muted: #eef2f5;
        --text: #17202a;
        --muted: #647181;
        --border: #d7dee6;
        --accent: #1f6f68;
        --accent-strong: #174f4a;
        --danger: #a23a3a;
        --warning: #9a6a16;
        --ok: #2f7351;
        --shadow: 0 8px 24px rgba(21, 34, 50, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 Arial, Helvetica, sans-serif;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        padding: 8px 11px;
      }

      button:hover {
        border-color: #aab7c4;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      button.danger {
        color: var(--danger);
        border-color: #d9b6b6;
      }

      button.link {
        border: 0;
        background: transparent;
        padding: 4px 6px;
        color: var(--accent);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #fff;
        padding: 8px 10px;
      }

      textarea {
        min-height: 86px;
        resize: vertical;
      }

      input[type="checkbox"] {
        width: auto;
        min-height: auto;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 7px;
        background: #173b36;
        color: #fff;
        font-weight: 800;
      }

      .brand h1 {
        margin: 0;
        font-size: 17px;
      }

      .brand p,
      .user-chip {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      nav {
        display: flex;
        gap: 6px;
        padding: 10px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
      }

      nav button {
        white-space: nowrap;
        border-color: transparent;
        background: transparent;
      }

      nav button.active {
        background: var(--surface-muted);
        border-color: var(--border);
      }

      main {
        padding: 18px 22px 32px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 20px;
      }

      .toolbar p {
        margin: 3px 0 0;
        color: var(--muted);
      }

      .filters,
      .form-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(150px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .form-grid.two {
        grid-template-columns: repeat(2, minmax(180px, 1fr));
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 14px;
        margin-bottom: 14px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 15px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 10px 9px;
        text-align: left;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        background: #fafbfc;
      }

      tr:last-child td {
        border-bottom: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 8px;
        color: var(--muted);
        background: #fff;
        font-size: 12px;
      }

      .badge.high,
      .badge.urgent {
        color: var(--warning);
        border-color: #ecd7a8;
        background: #fff8e8;
      }

      .badge.complete {
        color: var(--ok);
        border-color: #bbdac9;
        background: #edf8f2;
      }

      .chip-list,
      .checkbox-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .checkbox-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 400;
      }

      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
      }

      .group-heading {
        margin: 14px 0 8px;
        padding: 8px 10px;
        border-radius: 7px;
        background: var(--surface-muted);
        color: var(--text);
        font-weight: 800;
      }

      .settings-layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 14px;
      }

      .side-pane {
        display: grid;
        gap: 6px;
        align-self: start;
      }

      .side-pane button {
        text-align: left;
      }

      .side-pane button.active {
        background: var(--surface-muted);
        border-color: var(--accent);
      }

      .empty,
      .loading,
      .error {
        padding: 28px;
        border: 1px dashed var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--muted);
      }

      .error {
        color: var(--danger);
        border-color: #dfb7b7;
      }

      .status-line {
        min-height: 22px;
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(16, 24, 32, 0.38);
        z-index: 20;
      }

      .modal {
        width: min(760px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: var(--surface);
        border-radius: 8px;
        box-shadow: 0 18px 54px rgba(0, 0, 0, 0.22);
        padding: 18px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .modal-header h3 {
        margin: 0;
      }

      .stack {
        display: grid;
        gap: 10px;
      }

      .grouped-day {
        border-top: 1px solid var(--border);
        padding: 12px 0;
      }

      .grouped-day:first-child {
        border-top: 0;
      }

      .day-heading {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 800;
      }

      .admin-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
        gap: 14px;
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 820px) {
        header {
          align-items: flex-start;
          flex-direction: column;
        }

        main,
        header,
        nav {
          padding-left: 14px;
          padding-right: 14px;
        }

        .filters,
        .form-grid,
        .form-grid.two,
        .admin-grid,
        .settings-layout {
          grid-template-columns: 1fr;
        }

        table,
        thead,
        tbody,
        tr,
        th,
        td {
          display: block;
        }

        thead {
          display: none;
        }

        tr {
          border: 1px solid var(--border);
          border-radius: 8px;
          margin-bottom: 10px;
          background: #fff;
        }

        td {
          border: 0;
          display: grid;
          grid-template-columns: 110px 1fr;
          gap: 8px;
          padding: 8px 10px;
        }

        td::before {
          content: attr(data-label);
          color: var(--muted);
          font-weight: 800;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="loading">Loading Trust Ops...</div>
    <div id="modal-root"></div>

    <script>
      const state = {
        tab: "board",
        data: null,
        boardFilters: {},
        boardGrouping: "",
        timeFilters: {},
        payFilters: {},
        settingsSection: "profile",
        status: ""
      };

      function callServer(name, ...args) {
        return new Promise((resolve, reject) => {
          google.script.run
            .withSuccessHandler(resolve)
            .withFailureHandler((error) => reject(error))
            [name](...args);
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function money(value) {
        return Number(value || 0).toLocaleString(undefined, { style: "currency", currency: "USD" });
      }

      function options(items, valueKey, labelKey, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (items || []).map((item) => {
          const value = item[valueKey];
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(item[labelKey] || value)}</option>`;
        }).join("");
      }

      function constantOptions(values, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (values || []).map((value) => {
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(value)}</option>`;
        }).join("");
      }

      function selectedList(value) {
        return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
      }

      function renderCheckboxList(name, items, valueKey, labelKey, selectedValues) {
        const selected = new Set(selectedValues || []);
        return `<div class="checkbox-list">${(items || []).map((item) => `
          <label class="checkbox-row">
            <input type="checkbox" name="${escapeHtml(name)}" value="${escapeHtml(item[valueKey])}" ${selected.has(String(item[valueKey])) ? "checked" : ""}>
            <span>${escapeHtml(item[labelKey] || item[valueKey])}</span>
          </label>`).join("")}</div>`;
      }

      function renderIcon(action, idName, idValue, label, symbol, danger = false) {
        return `<button class="icon-button ${danger ? "danger" : ""}" data-action="${escapeHtml(action)}" ${idName ? `${idName}="${escapeHtml(idValue)}"` : ""} title="${escapeHtml(label)}" aria-label="${escapeHtml(label)}">${symbol}</button>`;
      }

      function setStatus(message) {
        state.status = message || "";
        const line = document.querySelector("[data-status-line]");
        if (line) line.textContent = state.status;
      }

      async function loadInitial() {
        try {
          state.data = await callServer("getInitialData");
          state.timeFilters.userId = state.data.context.userId;
          state.timeFilters.payPeriodId = state.data.currentPayPeriod["Pay Period ID"];
          state.payFilters.userId = state.data.context.userId;
          state.payFilters.payPeriodId = state.data.currentPayPeriod["Pay Period ID"];
          render();
        } catch (error) {
          let diagnostic = null;
          try {
            diagnostic = await callServer("getAuthDiagnostic");
          } catch (diagnosticError) {
            diagnostic = { diagnosticError: diagnosticError.message || String(diagnosticError) };
          }
          document.getElementById("app").innerHTML = `
            <div class="error">
              <strong>Unable to load Trust Ops.</strong><br>
              ${escapeHtml(error.message || error)}
              ${renderAuthDiagnostic(diagnostic)}
            </div>`;
        }
      }

      function renderAuthDiagnostic(diagnostic) {
        if (!diagnostic) return "";
        return `
          <div class="panel" style="margin-top: 14px; box-shadow: none;">
            <h3>Access Diagnostic</h3>
            <div class="table-wrap">
              <table>
                <tbody>
                  <tr><td data-label="Field">Active email</td><td data-label="Value">${escapeHtml(diagnostic.activeEmail || "(blank)")}</td></tr>
                  <tr><td data-label="Field">Effective email</td><td data-label="Value">${escapeHtml(diagnostic.effectiveEmail || "(blank)")}</td></tr>
                  <tr><td data-label="Field">Spreadsheet configured</td><td data-label="Value">${escapeHtml(diagnostic.spreadsheetConfigured)}</td></tr>
                  <tr><td data-label="Field">Sheet access</td><td data-label="Value">${escapeHtml(diagnostic.sheetAccessOk)}</td></tr>
                  <tr><td data-label="Field">User row found</td><td data-label="Value">${escapeHtml(diagnostic.userFound)}</td></tr>
                  <tr><td data-label="Field">User active</td><td data-label="Value">${escapeHtml(diagnostic.userActive)}</td></tr>
                  <tr><td data-label="Field">Stored email</td><td data-label="Value">${escapeHtml(diagnostic.storedEmail || "")}</td></tr>
                  <tr><td data-label="Field">Issue</td><td data-label="Value">${escapeHtml(diagnostic.issue || diagnostic.sheetAccessError || diagnostic.diagnosticError || "")}</td></tr>
                </tbody>
              </table>
            </div>
          </div>`;
      }

      async function refreshData(parts = {}) {
        setStatus("Saving...");
        const payload = {
          taskFilters: state.boardFilters,
          timeFilters: state.timeFilters,
          payFilters: state.payFilters
        };
        const fresh = await callServer("refreshAppData", payload);
        Object.assign(state.data, fresh);
        setStatus(parts.message || "Updated.");
        render();
      }

      function render() {
        const data = state.data;
        if (!data) return;
        const tabs = [
          ["board", "Assignment Board"],
          ["time", "Time Tracker"],
          ["pay", "Pay Summary"]
        ];
        tabs.push(["settings", "Settings"]);
        document.getElementById("app").className = "app-shell";
        document.getElementById("app").innerHTML = `
          <header>
            <div class="brand">
              <div class="brand-mark">TO</div>
              <div>
                <h1>Trust Ops</h1>
                <p>Tasks, time, pay periods, and administration</p>
              </div>
            </div>
            <div class="user-chip">${escapeHtml(data.context.fullName)} · ${escapeHtml(data.context.role)}</div>
          </header>
          <nav>
            ${tabs.map(([id, label]) => `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("")}
          </nav>
          <main>
            <div class="status-line" data-status-line>${escapeHtml(state.status)}</div>
            ${renderActiveTab()}
          </main>
        `;
      }

      function renderActiveTab() {
        if (state.tab === "time") return renderTimeTracker();
        if (state.tab === "pay") return renderPaySummary();
        if (state.tab === "settings") return renderSettings();
        return renderBoard();
      }

      function applyBoardFilters(tasks) {
        const filters = state.boardFilters;
        const search = String(filters.search || "").toLowerCase();
        return (tasks || []).filter((task) => {
          if (filters.status && task.Status !== filters.status) return false;
          if (filters.projectId && task["Project ID"] !== filters.projectId) return false;
          if (filters.priority && task.Priority !== filters.priority) return false;
          if (filters.assigneeUserId && !String(task["Assignee User IDs"] || "").split(",").map((id) => id.trim()).includes(filters.assigneeUserId)) return false;
          if (filters.tag && selectedList(task.Tags).indexOf(filters.tag) === -1) return false;
          if (search) {
            const haystack = [task.Title, task.Notes, task.Status, task.Assignees, task["Project Name"], task.Priority, task.Tags].join(" ").toLowerCase();
            if (!haystack.includes(search)) return false;
          }
          return true;
        });
      }

      function groupTaskKey(task) {
        const grouping = state.boardGrouping || "";
        if (grouping === "Status") return task.Status || "No status";
        if (grouping === "Project") return task["Project Name"] || "No project";
        if (grouping === "Assignee") return task.Assignees || "Unassigned";
        if (grouping === "Priority") return task.Priority || "No priority";
        if (grouping === "Tag") return task.Tags || "No tag";
        if (grouping === "Due Week") return task["Due Date"] ? task["Due Date"].slice(0, 10) : "No due date";
        return "";
      }

      function renderBoardResults(tasks) {
        if (!tasks.length) return '<div class="empty">No tasks match the current filters.</div>';
        if (!state.boardGrouping) return renderTaskTable(tasks);
        const grouped = tasks.reduce((acc, task) => {
          const key = groupTaskKey(task);
          acc[key] = acc[key] || [];
          acc[key].push(task);
          return acc;
        }, {});
        return Object.keys(grouped).sort().map((key) => `
          <div class="group-heading">${escapeHtml(key)} &middot; ${grouped[key].length}</div>
          ${renderTaskTable(grouped[key])}
        `).join("");
      }

      function updateBoardResultsOnly() {
        const container = document.getElementById("board-results");
        if (!container) return;
        container.innerHTML = renderBoardResults(applyBoardFilters(state.data.tasks));
      }

      function renderBoard() {
        const data = state.data;
        const tasks = applyBoardFilters(data.tasks);
        return `
          <section class="toolbar">
            <div>
              <h2>Assignment Board</h2>
              <p>${tasks.length} visible task${tasks.length === 1 ? "" : "s"}</p>
            </div>
            <div class="actions">
              ${data.permissions.canCreateTask ? '<button class="primary" data-action="new-task">New Task</button>' : ""}
              <button data-action="save-board-view">Save View</button>
              <button data-action="clear-board-filters">Clear Filters</button>
            </div>
          </section>
          <section class="panel">
            <div class="filters">
              <label>Saved View <select data-action="load-board-view">
                <option value="">Select view</option>
                ${(data.boardViews || []).map((view) => `<option value="${escapeHtml(view["Board View ID"])}">${escapeHtml(view["View Name"])} (${escapeHtml(view.Visibility)})</option>`).join("")}
              </select></label>
              <label>Search <input data-filter="search" value="${escapeHtml(state.boardFilters.search || "")}" placeholder="Task, notes, tags"></label>
              <label>Status <select data-filter="status">${constantOptions(data.constants.taskStatuses, state.boardFilters.status, true)}</select></label>
              <label>Project <select data-filter="projectId">${options(data.projects, "Project ID", "Project Name", state.boardFilters.projectId, true)}</select></label>
              <label>Assignee <select data-filter="assigneeUserId">${options(data.users, "User ID", "Full Name", state.boardFilters.assigneeUserId, true)}</select></label>
              <label>Priority <select data-filter="priority">${constantOptions(data.constants.priorities, state.boardFilters.priority, true)}</select></label>
              <label>Tag <select data-filter="tag">${options(data.tags || [], "Tag", "Tag", state.boardFilters.tag, true)}</select></label>
              <label>Group By <select data-board-grouping>
                ${constantOptions(["", "Status", "Project", "Assignee", "Priority", "Due Week", "Tag"], state.boardGrouping, false)}
              </select></label>
            </div>
          </section>
          <section class="panel" id="board-results">
            ${renderBoardResults(tasks)}
          </section>
        `;
      }

      function renderTaskTable(tasks) {
        return `
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Task</th><th>Status</th><th>Assignees</th><th>Project</th><th>Priority</th><th>Due</th><th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${tasks.map((task) => `
                  <tr>
                    <td data-label="Task">
                      <strong>${escapeHtml(task.Title)}</strong>
                      <div>${escapeHtml(task.Notes || "")}</div>
                      ${task.Tags ? `<span class="badge">${escapeHtml(task.Tags)}</span>` : ""}
                    </td>
                    <td data-label="Status"><span class="badge ${escapeHtml(String(task.Status).toLowerCase())}">${escapeHtml(task.Status)}</span></td>
                    <td data-label="Assignees">${escapeHtml(task.Assignees)}</td>
                    <td data-label="Project">${escapeHtml(task["Project Name"])}</td>
                    <td data-label="Priority"><span class="badge ${escapeHtml(String(task.Priority).toLowerCase())}">${escapeHtml(task.Priority)}</span></td>
                    <td data-label="Due">${escapeHtml(task["Due Date"])}</td>
                    <td data-label="Actions">
                      <div class="actions">
                        ${task._permissions?.canAddTime ? `<button data-action="add-time" data-task-id="${escapeHtml(task["Task ID"])}">Add Time</button>` : ""}
                        ${task._permissions?.canEdit ? renderIcon("edit-task", "data-task-id", task["Task ID"], "Edit task", "&#9998;") : ""}
                        ${task._permissions?.canDelete ? renderIcon("delete-task", "data-task-id", task["Task ID"], "Delete task", "&#128465;") : ""}
                        ${task._permissions?.canComplete && task.Status !== "Complete" ? `<button data-action="complete-task" data-task-id="${escapeHtml(task["Task ID"])}">Complete</button>` : ""}
                      </div>
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderTimeTracker() {
        const data = state.data;
        const tracker = data.tracker || {};
        const targetUserId = tracker.targetUserId || state.timeFilters.userId || data.context.userId;
        const canSelectUser = data.permissions.canCreateTimeForAnyUser;
        const entries = tracker.entries || [];
        const totalHours = entries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
        const selectedPeriod = tracker.selectedPayPeriod || data.currentPayPeriod || {};
        const periodLocked = String(selectedPeriod.Locked) === "true" || selectedPeriod.Status === "Locked";
        const selectedUser = (data.users || []).find((user) => user["User ID"] === targetUserId) || data.currentUser;
        return `
          <section class="toolbar">
            <div>
              <h2>Time Tracker</h2>
              <p>${entries.length === 1 ? "1 entry" : `${entries.length} entries`} &middot; ${totalHours.toFixed(2)} selected-period hours</p>
            </div>
          </section>
          <section class="panel">
            <h3>Log Time</h3>
            <form data-form="time-entry" class="stack">
              <div class="form-grid">

      function renderEntries(entries) {
        if (state.data.permissions.canViewAllTime) {
          const byUser = entries.reduce((acc, entry) => {
            const key = entry["User Name"] || "Unknown user";
            acc[key] = acc[key] || [];
            acc[key].push(entry);
            return acc;
          }, {});
          return Object.keys(byUser).sort().map((userName) => `
            <div class="group-heading">${escapeHtml(userName)}</div>
            ${renderEntriesByDay(byUser[userName])}
          `).join("");
        }
        return renderEntriesByDay(entries);
      }

      function renderEntriesByDay(entries) {
        const grouped = entries.reduce((acc, entry) => {
          const key = entry.Date || "No date";
          acc[key] = acc[key] || [];
          acc[key].push(entry);
          return acc;
        }, {});
        return Object.keys(grouped).sort().reverse().map((date) => {
          const dayEntries = grouped[date];
          const total = dayEntries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
          return `
            <div class="grouped-day">
              <div class="day-heading"><span>${escapeHtml(date)}</span><span>${total.toFixed(2)} hours</span></div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Entry</th><th>Project</th><th>Hours</th><th>Pay Period</th><th>Actions</th></tr></thead>
                  <tbody>
                    ${dayEntries.map((entry) => `
                      <tr>
                        <td data-label="Entry"><strong>${escapeHtml(entry["Task / Category"])}</strong><div>${escapeHtml(entry.Notes || "")}</div></td>
                        <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                        <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                        <td data-label="Pay Period">${escapeHtml(entry["Pay Period Label"])}</td>
                        <td data-label="Actions">
                          <div class="actions">
                            ${entry._permissions?.canEdit ? renderIcon("edit-time", "data-entry-id", entry["Time Entry ID"], "Edit time entry", "&#9998;") : ""}
                            ${entry._permissions?.canDelete ? renderIcon("delete-time", "data-entry-id", entry["Time Entry ID"], "Delete time entry", "&#128465;", true) : ""}
                          </div>
                        </td>
                      </tr>`).join("")}
                  </tbody>
                </table>
              </div>
            </div>`;
        }).join("");
      }

              <div class="form-grid two">
                <label>Task <select name="taskId">${options(tracker.availableTasks || [], "Task ID", "Title", entry["Task ID"], true)}</select></label>
                <label>Category <select name="categoryId">${options(tracker.categories || [], "Category ID", "Category", entry["Category ID"], true)}</select></label>
                <label>Project <select name="projectId">${options(data.projects || [], "Project ID", "Project Name", entry["Project ID"], true)}</select></label>
              </div>
              <label>Notes <textarea name="notes">${escapeHtml(entry.Notes || "")}</textarea></label>
              ${periodLocked && data.permissions.canOverrideLockedPeriod ? '<label>Override Reason <input name="overrideReason" placeholder="Required if this period is locked"></label>' : ""}
              ${periodLocked && !data.permissions.canOverrideLockedPeriod ? '<label>Request Reason <input name="requestReason" placeholder="Required for locked-period request"></label>' : ""}
              <div class="actions"><button class="primary" type="submit">Save Entry</button></div>
            </form>
          </div>`;
      }

      function openBoardViewModal() {
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-backdrop">
            <form class="modal stack" data-form="board-view-modal">
              <div class="modal-header"><h3>Save Board View</h3><button type="button" data-action="close-modal">Close</button></div>
              <label>View Name <input name="viewName" required></label>
              <label>Visibility <select name="visibility"><option>Private</option><option>Shared</option></select></label>
              <div class="actions"><button class="primary" type="submit">Save View</button></div>
            </form>
          </div>`;
      }

      function openUserModal(user = null) {
        const data = state.data;
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-backdrop">
            <form class="modal stack" data-form="user">
              <div class="modal-header"><h3>${user ? "Edit User" : "Create User"}</h3><button type="button" data-action="close-modal">Close</button></div>
              <input type="hidden" name="userId" value="${escapeHtml(user?.["User ID"] || "")}">
              <div class="form-grid two">
                <label>First Name <input name="firstName" value="${escapeHtml(user?.["First Name"] || "")}" required></label>
                <label>Last Name <input name="lastName" value="${escapeHtml(user?.["Last Name"] || "")}"></label>
                <label>Full Name <input name="fullName" value="${escapeHtml(user?.["Full Name"] || "")}" required></label>
                <label>Email <input name="email" type="email" value="${escapeHtml(user?.Email || "")}" required></label>
                <label>Role <select name="role">${constantOptions(Object.values(data.constants.roles), user?.Role || "User", false)}</select></label>
                <label>Pay Type <select name="payType">${constantOptions(["None", "Hourly", "Salary"], user?.["Pay Type"] || "None", false)}</select></label>
                <label>Hourly Rate <input name="hourlyRate" type="number" step="0.01" min="0" value="${escapeHtml(user?.["Hourly Rate"] || "")}"></label>
                <label>Salary Amount <input name="salaryAmount" type="number" step="0.01" min="0" value="${escapeHtml(user?.["Salary Amount"] || "")}"></label>
              </div>
              <label class="checkbox-row"><input name="active" type="checkbox" ${String(user?.Active) !== "false" ? "checked" : ""}> Active</label>
              <label class="checkbox-row"><input name="trackTime" type="checkbox" ${String(user?.["Track Time"]) !== "false" ? "checked" : ""}> Track Time</label>
              <label class="checkbox-row"><input name="trackPay" type="checkbox" ${String(user?.["Track Pay"]) === "true" ? "checked" : ""}> Track Pay</label>
              <div class="actions"><button class="primary" type="submit">Save User</button></div>
            </form>
          </div>`;
      }

      function openProjectModal(project = null) {
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-backdrop">
            <form class="modal stack" data-form="project">
              <div class="modal-header"><h3>${project ? "Edit Project" : "Create Project"}</h3><button type="button" data-action="close-modal">Close</button></div>
              <input type="hidden" name="projectId" value="${escapeHtml(project?.["Project ID"] || "")}">
              <label>Project Name <input name="projectName" value="${escapeHtml(project?.["Project Name"] || "")}" required></label>
              <label>Description <textarea name="description">${escapeHtml(project?.Description || "")}</textarea></label>
              <label>Status <input name="status" value="${escapeHtml(project?.Status || "Active")}"></label>
              <label class="checkbox-row"><input name="active" type="checkbox" ${String(project?.Active) !== "false" ? "checked" : ""}> Active</label>
              <div class="actions"><button class="primary" type="submit">Save Project</button></div>
            </form>
          </div>`;
      }

      function openCategoryModal(category = null) {
        const data = state.data;
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-backdrop">
            <form class="modal stack" data-form="category">
              <div class="modal-header"><h3>${category ? "Edit Category" : "Create Category"}</h3><button type="button" data-action="close-modal">Close</button></div>
              <input type="hidden" name="categoryId" value="${escapeHtml(category?.["Category ID"] || "")}">
              <label>Category <input name="category" value="${escapeHtml(category?.Category || "")}" required></label>
              <label>Default Project <select name="defaultProjectId">${options(data.projects, "Project ID", "Project Name", category?.["Default Project ID"], true)}</select></label>
              <label class="checkbox-row"><input name="active" type="checkbox" ${String(category?.Active) !== "false" ? "checked" : ""}> Active</label>
              <div class="actions"><button class="primary" type="submit">Save Category</button></div>
            </form>
          </div>`;
      }

      function openTagModal(tag = null) {
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-backdrop">
            <form class="modal stack" data-form="tag">
              <div class="modal-header"><h3>${tag ? "Edit Tag" : "Create Tag"}</h3><button type="button" data-action="close-modal">Close</button></div>
              <input type="hidden" name="tagId" value="${escapeHtml(tag?.["Tag ID"] || "")}">
              <label>Tag <input name="tag" value="${escapeHtml(tag?.Tag || "")}" required></label>
              <label>Color <input name="color" value="${escapeHtml(tag?.Color || "")}" placeholder="#1f6f68"></label>
              <label>Description <textarea name="description">${escapeHtml(tag?.Description || "")}</textarea></label>
              <label class="checkbox-row"><input name="active" type="checkbox" ${String(tag?.Active) !== "false" ? "checked" : ""}> Active</label>
              <div class="actions"><button class="primary" type="submit">Save Tag</button></div>
            </form>
          </div>`;
      }

      function openConfirmModal(message, action, payloadName, payloadValue) {
        document.getElementById("modal-root").innerHTML = `
          <div class="modal-backdrop">
            <div class="modal stack">
              <div class="modal-header"><h3>Confirm Delete</h3><button type="button" data-action="close-modal">Close</button></div>
              <p>${escapeHtml(message)}</p>
              <div class="actions">
                <button type="button" data-action="${escapeHtml(action)}" ${payloadName}="${escapeHtml(payloadValue)}" class="danger">Delete</button>
                <button type="button" data-action="close-modal">Cancel</button>
              </div>
            </div>
          </div>`;
      }

      document.addEventListener("click", async (event) => {
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          state.tab = tabButton.dataset.tab;
          state.status = "";
          render();
          return;
        }
        const settingsButton = event.target.closest("[data-settings-section]");
        if (settingsButton) {
          state.settingsSection = settingsButton.dataset.settingsSection;
          render();
          return;
        }
        const action = event.target.closest("[data-action]")?.dataset.action;
        if (!action) return;
        try {
          if (action === "close-modal") {
            document.getElementById("modal-root").innerHTML = "";
          } else if (action === "new-task") {
            openTaskModal();
          } else if (action === "save-board-view") {
            openBoardViewModal();
          } else if (action === "clear-board-filters") {
            state.boardFilters = {};
            state.boardGrouping = "";
            render();
          } else if (action === "edit-task") {
            const task = state.data.tasks.find((item) => item["Task ID"] === event.target.closest("[data-task-id]").dataset.taskId);
            openTaskModal(task);
          } else if (action === "delete-task") {
            openConfirmModal("Delete this task? Existing audit history will be preserved.", "confirm-delete-task", "data-task-id", event.target.closest("[data-task-id]").dataset.taskId);
          } else if (action === "confirm-delete-task") {
            await callServer("archiveTask", event.target.closest("[data-task-id]").dataset.taskId);
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Task deleted." });
          } else if (action === "complete-task") {
            await callServer("completeTask", event.target.closest("[data-task-id]").dataset.taskId);
            await refreshData({ message: "Task completed." });
          } else if (action === "add-time") {
            const taskId = event.target.closest("[data-task-id]").dataset.taskId;
            state.tab = "time";
            render();
            const taskSelect = document.querySelector('[name="taskId"]');
            if (taskSelect) taskSelect.value = taskId;
          } else if (action === "edit-time") {
            const entryId = event.target.closest("[data-entry-id]").dataset.entryId;
            const entry = (state.data.tracker.entries || []).find((item) => item["Time Entry ID"] === entryId);
            openTimeModal(entry);
          } else if (action === "delete-time") {
            openConfirmModal("Delete this time entry?", "confirm-delete-time", "data-entry-id", event.target.closest("[data-entry-id]").dataset.entryId);
          } else if (action === "confirm-delete-time") {
            await callServer("deleteTimeEntry", {
              timeEntryId: event.target.closest("[data-entry-id]").dataset.entryId,
              overrideReason: state.data.permissions.canOverrideLockedPeriod ? "Deleted by permitted user from Time Tracker" : "",
              requestReason: "Delete requested from Time Tracker"
            });
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Time entry deleted or request created." });
          } else if (action === "lock-period") {
            await callServer("lockPayPeriod", state.payFilters.payPeriodId || state.data.currentPayPeriod["Pay Period ID"]);
            await refreshData({ message: "Pay period locked." });
          } else if (action === "unlock-period") {
            await callServer("unlockPayPeriod", state.payFilters.payPeriodId || state.data.currentPayPeriod["Pay Period ID"]);
            await refreshData({ message: "Pay period unlocked." });
          } else if (action === "approve-time-request") {
            await callServer("approveTimeEditRequest", event.target.closest("[data-request-id]").dataset.requestId, "Approved in Time Tracker");
            await refreshData({ message: "Request approved." });
          } else if (action === "reject-time-request") {
            await callServer("rejectTimeEditRequest", event.target.closest("[data-request-id]").dataset.requestId, "Rejected in Time Tracker");
            await refreshData({ message: "Request rejected." });
          } else if (action === "new-user") {
            openUserModal();
          } else if (action === "edit-user") {
            openUserModal(state.data.users.find((user) => user["User ID"] === event.target.closest("[data-user-id]").dataset.userId));
          } else if (action === "delete-user") {
            openConfirmModal("Archive this user?", "confirm-delete-user", "data-user-id", event.target.closest("[data-user-id]").dataset.userId);
          } else if (action === "confirm-delete-user") {
            await callServer("archiveUser", event.target.closest("[data-user-id]").dataset.userId);
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "User archived." });
          } else if (action === "new-project") {
            openProjectModal();
          } else if (action === "edit-project") {
            openProjectModal(state.data.projects.find((project) => project["Project ID"] === event.target.closest("[data-project-id]").dataset.projectId));
          } else if (action === "delete-project") {
            openConfirmModal("Archive this project?", "confirm-delete-project", "data-project-id", event.target.closest("[data-project-id]").dataset.projectId);
          } else if (action === "confirm-delete-project") {
            await callServer("archiveProject", event.target.closest("[data-project-id]").dataset.projectId);
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Project archived." });
          } else if (action === "new-category") {
            openCategoryModal();
          } else if (action === "edit-category") {
            openCategoryModal(state.data.categories.find((category) => category["Category ID"] === event.target.closest("[data-category-id]").dataset.categoryId));
          } else if (action === "delete-category") {
            openConfirmModal("Archive this category?", "confirm-delete-category", "data-category-id", event.target.closest("[data-category-id]").dataset.categoryId);
          } else if (action === "confirm-delete-category") {
            await callServer("archiveCategory", event.target.closest("[data-category-id]").dataset.categoryId);
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Category archived." });
          } else if (action === "new-tag") {
            openTagModal();
          } else if (action === "edit-tag") {
            openTagModal((state.data.tags || []).find((tag) => tag["Tag ID"] === event.target.closest("[data-tag-id]").dataset.tagId));
          } else if (action === "delete-tag") {
            openConfirmModal("Archive this tag? Existing task tag text will be preserved.", "confirm-delete-tag", "data-tag-id", event.target.closest("[data-tag-id]").dataset.tagId);
          } else if (action === "confirm-delete-tag") {
            await callServer("archiveTag", event.target.closest("[data-tag-id]").dataset.tagId);
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Tag archived." });
          } else if (action === "diagnose-user") {
            const email = document.querySelector("[data-diagnostic-email]")?.value || "";
            const result = await callServer("diagnoseUserAccess", email);
            setStatus(result.issue || `User ${result.normalizedEmail} is active as ${result.role}.`);
          } else if (action === "migration-preview") {
            const preview = await callServer("getMigrationPreview");
            setStatus(`Prototype rows: Assignment Board ${preview.assignmentBoardRows}, Imported Tasks ${preview.importedTaskRows}.`);
          } else if (action === "migration-tasks") {
            const result = await callServer("migrateAssignmentBoardTasks");
            await refreshData({ message: `Migrated ${result.migrated} task(s).` });
          }
        } catch (error) {
          setStatus(error.message || String(error));
        }
      });

      document.addEventListener("input", async (event) => {
        if (event.target.matches("[data-filter]")) {
          state.boardFilters[event.target.dataset.filter] = event.target.value;
          updateBoardResultsOnly();
        }
      });

      document.addEventListener("change", async (event) => {
        if (event.target.matches("[data-filter]")) {
          state.boardFilters[event.target.dataset.filter] = event.target.value;
          render();
        }
        if (event.target.matches("[data-board-grouping]")) {
          state.boardGrouping = event.target.value;
          render();
        }
        if (event.target.matches('[data-action="load-board-view"]')) {
          const view = (state.data.boardViews || []).find((item) => item["Board View ID"] === event.target.value);
          if (view) {
            try {
              state.boardFilters = JSON.parse(view["Filters JSON"] || "{}");
            } catch (error) {
              state.boardFilters = {};
            }
            state.boardGrouping = view.Grouping || "";
            render();
          }
        }
        if (event.target.matches("[data-pay-filter]")) {
          state.payFilters[event.target.dataset.payFilter] = event.target.value;
          try {
            await refreshData({ message: "Pay summary refreshed." });
          } catch (error) {
            setStatus(error.message || String(error));
          }
        }
        if (event.target.name === "entryType") {
          document.querySelector('[data-time-mode="task"]').classList.toggle("hidden", event.target.value !== "Task");
          document.querySelector('[data-time-mode="general"]').classList.toggle("hidden", event.target.value !== "General Time");
        }
        if (event.target.closest('[data-form="time-entry"]') && (event.target.name === "userId" || event.target.name === "payPeriodId")) {
          const form = event.target.closest("form");
          state.timeFilters.userId = form.userId?.value || state.data.context.userId;
          state.timeFilters.payPeriodId = form.payPeriodId.value;
          try {
            await refreshData({ message: "Time tracker refreshed." });
          } catch (error) {
            setStatus(error.message || String(error));
          }
        }
      });

      document.addEventListener("submit", async (event) => {
        const form = event.target;
        const formType = form.dataset.form;
        if (!formType) return;
        event.preventDefault();
        try {
          if (formType === "task-modal") {
            const selectedAssignees = Array.from(form.querySelectorAll('[name="assigneeUserIds"]:checked')).map((option) => option.value);
            const selectedTags = Array.from(form.tags?.selectedOptions || []).map((option) => option.value);
            const payload = {
              taskId: form.taskId.value,
              title: form.title.value,
              notes: form.notes.value,
              status: form.status.value,
              dueDate: form.dueDate.value,
              projectId: form.projectId.value,
              priority: form.priority.value,
              assigneeUserIds: selectedAssignees,
              tags: selectedTags
            };
            await callServer(payload.taskId ? "updateTask" : "createTask", payload);
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Task saved." });
          } else if (formType === "time-entry") {
            const entryType = form.entryType.value;
            const payload = {
              userId: form.userId?.value || state.data.context.userId,
              payPeriodId: form.payPeriodId.value,
              entryType: entryType,
              date: form.date.value,
              hours: form.hours.value,
              taskId: form.taskId?.value || "",
              categoryId: form.categoryId?.value || "",
              notes: entryType === "Task" ? form.notes.value : form.generalNotes.value,
              overrideReason: form.overrideReason?.value || "",
              requestReason: form.requestReason?.value || ""
            };
            await callServer("createTimeEntry", payload);
            await refreshData({ message: "Time saved or request created." });
          } else if (formType === "time-modal") {
            await callServer("updateTimeEntry", {
              timeEntryId: form.timeEntryId.value,
              userId: form.userId?.value || undefined,
              entryType: form.entryType.value,
              date: form.date.value,
              hours: form.hours.value,
              taskId: form.taskId?.value || "",
              categoryId: form.categoryId?.value || "",
              projectId: form.projectId?.value || "",
              notes: form.notes.value,
              overrideReason: form.overrideReason?.value || "",
              requestReason: form.requestReason?.value || ""
            });
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Time entry updated or request created." });
          } else if (formType === "board-view-modal") {
            await callServer("saveBoardView", {
              viewName: form.viewName.value,
              visibility: form.visibility.value,
              filters: state.boardFilters,
              grouping: state.boardGrouping
            });
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Board view saved." });
          } else if (formType === "profile") {
            await callServer("updateProfile", {
              firstName: form.firstName.value,
              lastName: form.lastName.value,
              fullName: form.fullName.value
            });
            await refreshData({ message: "Profile saved." });
          } else if (formType === "user") {
            await callServer("saveUser", {
              userId: form.userId.value,
              firstName: form.firstName.value,
              lastName: form.lastName.value,
              fullName: form.fullName.value,
              email: form.email.value,
              role: form.role.value,
              payType: form.payType.value,
              hourlyRate: form.hourlyRate.value,
              salaryAmount: form.salaryAmount.value,
              active: form.active.checked,
              "Track Time": form.trackTime.checked,
              "Track Pay": form.trackPay.checked
            });
            form.reset();
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "User saved." });
          } else if (formType === "project") {
            await callServer("saveProject", {
              projectId: form.projectId.value,
              projectName: form.projectName.value,
              description: form.description.value,
              status: form.status.value,
              active: form.active.checked
            });
            form.reset();
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Project saved." });
          } else if (formType === "category") {
            await callServer("saveCategory", {
              categoryId: form.categoryId.value,
              category: form.category.value,
              defaultProjectId: form.defaultProjectId.value,
              active: form.active.checked
            });
            form.reset();
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Category saved." });
          } else if (formType === "tag") {
            await callServer("saveTag", {
              tagId: form.tagId.value,
              tag: form.tag.value,
              color: form.color.value,
              description: form.description.value,
              active: form.active.checked
            });
            document.getElementById("modal-root").innerHTML = "";
            await refreshData({ message: "Tag saved." });
          } else if (formType === "setting") {
            await callServer("saveSetting", {
              key: form.key.value,
              value: form.value.value,
              description: form.description.value
            });
            form.reset();
            await refreshData({ message: "Setting saved." });
          } else if (formType === "explicit-settings") {
            await callServer("saveSetting", {
              key: "PAY_PERIOD_ANCHOR_DATE",
              value: form.anchorDate.value,
              description: "Known start date for the repeating pay-period calendar."
            });
            await callServer("saveSetting", {
              key: "DEFAULT_PAY_PERIOD_DAYS",
              value: form.periodDays.value,
              description: "Number of calendar days in each pay period."
            });
            await refreshData({ message: "Settings saved." });
          }
        } catch (error) {
          setStatus(error.message || String(error));
        }
      });

      loadInitial();
    </script>
  </body>
</html>
