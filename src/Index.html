<!doctype html>
<html>
    <head>
      <base target="_top">
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="google-oauth-client-id" content="<?= googleClientId ?>">
      <meta name="trust-ops-github-auth-url" content="<?= githubAuthUrl ?>">
      <meta name="trust-ops-web-app-url" content="<?= webAppUrl ?>">
      <meta name="trust-ops-initial-auth-token" content="<?= initialAuthToken ?>">
      <style>
      :root {
        --bg: #eef2f5;
        --surface: #ffffff;
        --surface-strong: #ffffff;
        --surface-muted: #f4f7f9;
        --icon-surface: #eef3f7;
        --icon-border: #cfd9e1;
        --icon-neutral: #5c6b78;
        --icon-neutral-strong: #24313a;
        --table-head: #e8edf2;
        --text: #13212d;
        --muted: #5f6f7d;
        --border: #d6dfe6;
        --accent: #235d57;
        --accent-strong: #16413d;
        --danger: #b04545;
        --warning: #99681b;
        --ok: #2f7351;
        --hierarchy-child-row-bg: rgba(95, 109, 122, 0.08);
        --hierarchy-child-row-hover-bg: rgba(95, 109, 122, 0.12);
        --shadow: 0 10px 30px rgba(21, 34, 50, 0.08);
        --shadow-soft: 0 4px 14px rgba(21, 34, 50, 0.05);
        --radius-sm: 8px;
        --radius-md: 12px;
        --radius-lg: 16px;
        --focus-ring: 0 0 0 3px rgba(35, 93, 87, 0.14);
        --app-topbar-height: 0px;
        --sticky-gap: 14px;
        --sticky-region-height: 0px;
        --sticky-top: var(--app-topbar-height);
        --side-pane-top: calc(var(--app-topbar-height) + var(--sticky-region-height));
        --modal-surface: #fbfcfd;
        --modal-border: #dbe3ea;
      }

      body[data-theme="dark"] {
        --bg: #0f1418;
        --surface: #171d22;
        --surface-strong: #1a2127;
        --surface-muted: #202930;
        --icon-surface: #202930;
        --icon-border: #3a4650;
        --icon-neutral: #b3bec8;
        --icon-neutral-strong: #f0f4f7;
        --table-head: #1d252c;
        --text: #edf2f7;
        --muted: #a0aebb;
        --border: #31404a;
        --accent: #57aca1;
        --accent-strong: #76c4bb;
        --danger: #e38181;
        --warning: #e8c268;
        --ok: #7bc99f;
        --hierarchy-child-row-bg: rgba(150, 165, 178, 0.13);
        --hierarchy-child-row-hover-bg: rgba(150, 165, 178, 0.18);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        --shadow-soft: 0 4px 14px rgba(0, 0, 0, 0.2);
        --focus-ring: 0 0 0 3px rgba(87, 172, 161, 0.18);
        --modal-surface: #1a2027;
        --modal-border: #384651;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow-x: hidden;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
        padding: 8px 11px;
        touch-action: manipulation;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      button:hover {
        border-color: #a2b0bc;
        box-shadow: var(--shadow-soft);
        transform: translateY(-1px);
      }

      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 0;
        box-shadow: var(--focus-ring);
      }

      button:disabled,
      input:disabled,
      select:disabled,
      textarea:disabled {
        opacity: 0.62;
        cursor: not-allowed;
      }

      input:disabled,
      select:disabled,
      textarea:disabled {
        background: var(--surface-muted);
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      button.primary:hover {
        background: var(--accent-strong);
      }

      a.primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 8px 11px;
        border: 1px solid var(--accent);
        border-radius: var(--radius-sm);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        text-decoration: none;
        touch-action: manipulation;
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      a.primary:hover {
        border-color: var(--accent-strong);
        background: var(--accent-strong);
        box-shadow: var(--shadow-soft);
        transform: translateY(-1px);
      }

      a.primary:focus-visible {
        outline: 0;
        box-shadow: var(--focus-ring);
      }

      a.primary:visited {
        color: #fff;
      }

      button.danger {
        color: var(--danger);
        border-color: #d9b6b6;
      }

      button.link {
        border: 0;
        background: transparent;
        padding: 4px 6px;
        color: var(--accent);
      }

      input,
      select,
      textarea {
        width: 100%;
        min-height: 38px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text);
        padding: 8px 10px;
        transition: border-color 0.16s ease, box-shadow 0.16s ease, background-color 0.16s ease;
      }

      textarea {
        min-height: 86px;
        resize: vertical;
      }

      input[type="checkbox"] {
        width: auto;
        min-height: auto;
      }

      input[type="color"] {
        width: 46px;
        min-height: 38px;
        padding: 4px;
      }

      input[type="file"] {
        padding: 6px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }

      .app-topbar {
        position: sticky;
        top: 0;
        z-index: 15;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: linear-gradient(180deg, var(--accent), var(--accent-strong));
        color: #fff;
        font-weight: 800;
      }

      .brand h1 {
        margin: 0;
        font-size: 17px;
      }

      .brand p,
      .user-chip {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .user-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      header > .user-chip:not(.user-chip-current) {
        display: none;
      }

      nav {
        display: flex;
        gap: 8px;
        padding: 10px 22px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        overflow-x: auto;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }

      nav button {
        white-space: nowrap;
        border-color: transparent;
        background: transparent;
        border-radius: 999px;
        padding-left: 12px;
        padding-right: 12px;
      }

      nav button.active {
        background: rgba(35, 93, 87, 0.08);
        border-color: rgba(35, 93, 87, 0.18);
        color: var(--accent-strong);
      }

      body[data-theme="dark"] nav button.active {
        background: rgba(87, 172, 161, 0.16);
        border-color: rgba(87, 172, 161, 0.26);
      }

      main {
        padding: 20px 22px 34px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .toolbar h2 {
        margin: 0;
        font-size: 21px;
        letter-spacing: -0.01em;
      }

      .toolbar p {
        margin: 3px 0 0;
        color: var(--muted);
      }

      .sticky-region {
        position: sticky;
        top: var(--sticky-top);
        z-index: 12;
        display: grid;
        gap: 14px;
        margin-bottom: 0;
        padding-top: 2px;
        padding-bottom: var(--sticky-gap);
        background: var(--bg);
      }

      .sticky-region .toolbar,
      .sticky-region .panel {
        margin-bottom: 0;
      }

      .filters,
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .form-grid.two {
        grid-template-columns: repeat(2, minmax(220px, 1fr));
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow);
        padding: 16px;
        margin-bottom: 14px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 15px;
        letter-spacing: -0.01em;
      }

      .side-layout,
      .settings-layout {
        display: grid;
        grid-template-columns: 250px minmax(0, 1fr);
        gap: 14px;
        align-items: start;
      }

      .side-layout[data-sidebar-collapsed="true"],
      .settings-layout[data-sidebar-collapsed="true"] {
        grid-template-columns: 68px minmax(0, 1fr);
      }

      .table-wrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }

      .table-wrap table {
        min-width: 100%;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 11px 10px;
        text-align: left;
        vertical-align: middle;
        word-break: break-word;
      }

      th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0;
        background: var(--table-head);
        position: sticky;
        top: 0;
        z-index: 1;
      }

      th.sortable-th {
        padding: 0;
      }

      .sort-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 100%;
        border: 0;
        border-radius: 0;
        padding: 11px 10px;
        background: transparent;
        color: inherit;
        box-shadow: none;
        transform: none;
        text-align: left;
        font-size: inherit;
        font-weight: inherit;
      }

      .sort-header:hover,
      .sort-header:focus-visible {
        background: rgba(127, 143, 156, 0.08);
        box-shadow: none;
        transform: none;
      }

      .sort-indicator {
        color: var(--accent);
        font-size: 11px;
        font-weight: 900;
        line-height: 1;
      }

      .grouped-board {
        display: grid;
        gap: 10px;
      }

      .board-group {
        display: grid;
        gap: 10px;
      }

      .board-group-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface-muted);
        color: var(--text);
        box-shadow: var(--shadow-soft);
      }

      .board-group-toggle:hover,
      .board-group-toggle:focus-visible {
        background: var(--surface);
      }

      .board-group-toggle strong {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .board-group-body[hidden] {
        display: none !important;
      }

      body[data-theme="dark"] th {
        color: #dfe7ee;
        background: #202930;
      }

      table {
        width: 100%;
        table-layout: fixed;
      }

      .board-table th:nth-child(1) { width: 30%; }
      .board-table th:nth-child(2) { width: 12%; }
      .board-table th:nth-child(3) { width: 18%; }
      .board-table th:nth-child(4) { width: 16%; }
      .board-table th:nth-child(5) { width: 10%; }
      .board-table th:nth-child(6) { width: 10%; }
      .board-table th:nth-child(7) { width: 4%; }

      .time-table th:nth-child(1) { width: 34%; }
      .time-table th:nth-child(2) { width: 20%; }
      .time-table th:nth-child(3) { width: 8%; }
      .time-table th:nth-child(4) { width: 24%; }
      .time-table th:nth-child(5) { width: 14%; }

      .pay-table th:nth-child(1) { width: 22%; }
      .pay-table th:nth-child(2) { width: 14%; }
      .pay-table th:nth-child(3) { width: 16%; }
      .pay-table th:nth-child(4) { width: 18%; }
      .pay-table th:nth-child(5) { width: 15%; }
      .pay-table th:nth-child(6) { width: 15%; }

      .project-dashboard-table th:nth-child(1) { width: 20%; }
      .project-dashboard-table th:nth-child(2) { width: 12%; }
      .project-dashboard-table th:nth-child(3) { width: 12%; }
      .project-dashboard-table th:nth-child(4) { width: 12%; }
      .project-dashboard-table th:nth-child(5) { width: 12%; }
      .project-dashboard-table th:nth-child(6) { width: 12%; }
      .project-dashboard-table th:nth-child(7) { width: 20%; }

      .project-task-table th:nth-child(1) { width: 34%; }
      .project-task-table th:nth-child(2) { width: 14%; }
      .project-task-table th:nth-child(3) { width: 24%; }
      .project-task-table th:nth-child(4) { width: 14%; }
      .project-task-table th:nth-child(5) { width: 14%; }

      .task-title-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }

      .hierarchy-title-row {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 0;
      }

      .hierarchy-title-badges {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        flex-wrap: wrap;
      }

      .task-note-icon {
        width: 22px;
        height: 22px;
        min-height: 22px;
        border-radius: 50%;
        padding: 0;
        font-size: 12px;
        line-height: 1;
        display: inline-grid;
        place-items: center;
      }

      .task-note-icon:hover,
      .task-note-icon:focus-visible {
        color: var(--icon-neutral-strong);
        background: var(--surface);
        border-color: var(--border);
      }

      .action-popover {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: flex-end;
      }

      #action-popover-root {
        position: fixed;
        inset: 0;
        z-index: 50;
        pointer-events: none;
      }

      .action-popover-trigger {
        width: 28px;
        height: 28px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        font-size: 17px;
        line-height: 1;
      }

      .action-popover-menu {
        display: none;
        min-width: 170px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .action-popover-menu[hidden] {
        display: none !important;
      }

      .action-popover-floating {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 51;
        display: grid;
        gap: 4px;
        width: max-content;
        min-width: 170px;
        max-width: calc(100vw - 16px);
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow);
        pointer-events: auto;
        visibility: hidden;
      }

      .action-popover-floating button,
      .action-popover-menu button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        white-space: nowrap;
        border: 0;
        border-radius: 6px;
        padding: 8px 9px;
        background: transparent;
      }

      .action-popover-floating button:hover,
      .action-popover-floating button:focus-visible,
      .action-popover-menu button:hover,
      .action-popover-menu button:focus-visible {
        background: var(--surface-muted);
        box-shadow: none;
        transform: none;
      }

      .action-popover-floating .danger,
      .action-popover-menu .danger {
        color: var(--danger);
      }

      .table-wrap td[data-label="Actions"] {
        position: relative;
        overflow: visible;
        white-space: nowrap;
      }

      .table-wrap td[data-label="Actions"] .action-popover {
        width: 100%;
        justify-content: flex-end;
      }

      .project-user-entries-table th:nth-child(1) { width: 56%; }
      .project-user-entries-table th:nth-child(2) { width: 18%; }
      .project-user-entries-table th:nth-child(3) { width: 26%; }

      .project-user-entries-table td[data-label="Actions"] .icon-button {
        margin-left: auto;
      }

      .project-entries-table th:nth-child(1) { width: 12%; }
      .project-entries-table th:nth-child(2) { width: 28%; }
      .project-entries-table th:nth-child(3) { width: 22%; }
      .project-entries-table th:nth-child(4) { width: 10%; }
      .project-entries-table th:nth-child(5) { width: 16%; }
      .project-entries-table th:nth-child(6) { width: 12%; }

      tr:last-child td {
        border-bottom: 0;
      }

      tbody tr:hover td {
        background: rgba(127, 143, 156, 0.06);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }

      .hierarchy-cell {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        min-width: 0;
        padding-left: calc(var(--hierarchy-level, 0) * 14px);
      }

      .hierarchy-toggle,
      .hierarchy-toggle-spacer {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        border-radius: 999px;
      }

      .hierarchy-toggle {
        display: inline-grid;
        place-items: center;
        padding: 0;
        border: 1px solid var(--border);
        background: var(--surface-muted);
        color: var(--text);
        line-height: 1;
      }

      .hierarchy-toggle-spacer {
        display: inline-block;
      }

      .hierarchy-main {
        display: grid;
        gap: 4px;
        min-width: 0;
      }

      .hierarchy-subtitle {
        color: var(--muted);
        font-size: 12px;
      }

      .hierarchy-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .hierarchy-summary {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .hierarchy-parent-row td:first-child {
        background: transparent;
      }

      .hierarchy-child-row td:first-child {
        color: var(--text);
      }

      .hierarchy-parent-row td,
      .hierarchy-child-row td {
        transition: background-color 140ms ease, box-shadow 140ms ease;
      }

      .hierarchy-child-row td {
        background: var(--hierarchy-child-row-bg);
      }

      .hierarchy-child-row td:first-child {
        background: var(--hierarchy-child-row-bg);
      }

      .hierarchy-child-row:hover td {
        background: var(--hierarchy-child-row-hover-bg);
      }

      .hierarchy-parent-row .hierarchy-meta .badge {
        font-weight: 700;
      }

      .hierarchy-parent-row .hierarchy-meta .hierarchy-count-badge {
        padding-left: 8px;
        padding-right: 8px;
        gap: 4px;
        height: 22px;
        min-height: 22px;
        font-weight: 700;
      }

      .hierarchy-count-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 0 8px;
        font-size: 12px;
        line-height: 1;
      }

      .hierarchy-count-icon {
        font-size: 12px;
        line-height: 1;
      }

      .hierarchy-parent-row .task-title-row strong,
      .hierarchy-parent-row strong {
        letter-spacing: 0.01em;
      }

      .help {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
        margin-top: -2px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 2px 9px;
        color: var(--text);
        background: var(--surface-muted);
        font-size: 12px;
      }

      .badge.hierarchy-count-badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 22px;
        height: 22px;
        padding: 0 8px;
        font-size: 12px;
        font-weight: 700;
        color: var(--icon-neutral);
        background: var(--icon-surface);
        border-color: var(--icon-border);
        font-variant-emoji: text;
      }

      .sidebar-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .sidebar-actions .danger {
        border-color: rgba(176, 69, 69, 0.34);
      }

      .actions-header {
        width: 1%;
        white-space: nowrap;
      }

      .settings-actions-table .actions-header,
      .settings-actions-table td[data-label="Actions"] {
        width: 64px;
        min-width: 64px;
        max-width: 64px;
      }

      .settings-actions-table td[data-label="Actions"] {
        padding-right: 10px;
      }

      .settings-actions-table td[data-label="Actions"] .action-popover {
        width: 100%;
        justify-content: center;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .person-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 2px 8px;
        border: 1px solid transparent;
        background: var(--surface-muted);
        color: var(--text);
        font-size: 12px;
        white-space: nowrap;
      }

      .person-chip-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .badge.high,
      .badge.urgent {
        color: var(--warning);
        border-color: #ecd7a8;
        background: #fff8e8;
      }

      .badge.complete {
        color: var(--ok);
        border-color: #bbdac9;
        background: #edf8f2;
      }

      body[data-theme="dark"] .badge.high,
      body[data-theme="dark"] .badge.urgent {
        border-color: rgba(231, 189, 99, 0.34);
        background: rgba(231, 189, 99, 0.12);
      }

      body[data-theme="dark"] .badge.complete {
        border-color: rgba(118, 199, 155, 0.34);
        background: rgba(118, 199, 155, 0.12);
      }

      .chip-list,
      .checkbox-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .checkbox-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        max-height: 220px;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px;
        background: var(--surface);
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        font-size: 13px;
        font-weight: 400;
      }

      .permission-matrix {
        display: grid;
        gap: 12px;
      }

      .permission-matrix-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--modal-border);
        border-radius: var(--radius-md);
        background: linear-gradient(180deg, var(--surface), var(--surface-muted));
      }

      .permission-matrix-toolbar .permission-switch-row {
        font-weight: 800;
      }

      .permission-matrix-badge,
      .permission-group-badge {
        color: var(--icon-neutral);
        background: var(--icon-surface);
        border-color: var(--icon-border);
        font-weight: 700;
      }

      .permission-group {
        border: 1px solid var(--modal-border);
        border-radius: var(--radius-md);
        overflow: hidden;
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .permission-group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--modal-border);
        background: linear-gradient(180deg, var(--surface), var(--surface-muted));
      }

      .permission-group-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex: 1 1 auto;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        box-shadow: none;
        text-align: left;
      }

      .permission-group-summary:hover {
        transform: none;
        box-shadow: none;
        border-color: transparent;
      }

      .permission-group-summary-main {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .permission-group-title {
        font-weight: 800;
        color: var(--text);
      }

      .permission-group-summary-icon {
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
        flex: 0 0 auto;
      }

      .permission-group-body {
        padding: 14px 16px 16px;
      }

      .permission-group-items {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
      }

      .permission-switch-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--text);
        font-size: 13px;
        font-weight: 700;
        min-width: 0;
        cursor: pointer;
      }

      .permission-switch-text {
        min-width: 0;
        line-height: 1.35;
      }

      .permission-switch-control {
        position: relative;
        width: 42px;
        height: 24px;
        flex: 0 0 auto;
      }

      .permission-switch-control input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }

      .permission-switch-ui {
        position: absolute;
        inset: 0;
        border: 1px solid var(--icon-border);
        border-radius: 999px;
        background: var(--surface-muted);
        transition: background-color 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .permission-switch-ui::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--surface);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.16);
        transition: transform 0.16s ease, background-color 0.16s ease;
      }

      .permission-switch-control input:checked + .permission-switch-ui {
        background: var(--accent);
        border-color: var(--accent);
      }

      .permission-switch-control input:checked + .permission-switch-ui::after {
        transform: translateX(18px);
      }

      .permission-switch-control input:indeterminate + .permission-switch-ui {
        background: var(--icon-border);
        border-color: var(--icon-border);
      }

      .permission-switch-control input:indeterminate + .permission-switch-ui::after {
        transform: translateX(9px);
      }

      .permission-switch-control input:focus-visible + .permission-switch-ui {
        box-shadow: var(--focus-ring);
      }

      .permission-switch-row.permission-switch-inline {
        flex: 0 0 auto;
        max-width: 100%;
      }

      .permission-switch-row.permission-switch-inline .permission-switch-text {
        font-weight: 800;
        color: var(--muted);
      }

      .permission-toggle-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }

      .icon-button {
        display: inline-grid;
        place-items: center;
        width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 999px;
      }

      .icon-button:not(.danger),
      .task-note-icon,
      .hierarchy-count-badge {
        color: var(--icon-neutral);
        background: var(--icon-surface);
        border-color: var(--icon-border);
        font-variant-emoji: text;
      }

      .icon-button:not(.danger):hover,
      .icon-button:not(.danger):focus-visible,
      .task-note-icon:hover,
      .task-note-icon:focus-visible {
        color: var(--icon-neutral-strong);
        background: var(--surface);
        border-color: var(--border);
      }

      .avatar {
        display: inline-grid;
        place-items: center;
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--accent);
        color: #fff;
        overflow: hidden;
        font-size: 11px;
        font-weight: 800;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.18);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .user-cell,
      .profile-preview {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 30px;
      }

      .profile-preview {
        flex-wrap: wrap;
      }

      .color-field {
        display: grid;
        grid-template-columns: 46px minmax(110px, 1fr);
        gap: 8px;
        align-items: center;
      }

      .swatch {
        display: inline-block;
        width: 22px;
        height: 22px;
        border-radius: 6px;
        border: 1px solid var(--border);
        vertical-align: middle;
      }

      .tag-picker {
        display: grid;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        padding: 10px;
        background: var(--surface);
      }

      .tag-option-list {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-remove {
        border: 0;
        background: transparent;
        padding: 0 0 0 5px;
        color: inherit;
      }

      .pay-row {
        cursor: pointer;
      }

      .pay-row:hover {
        background: rgba(127, 143, 156, 0.06);
      }

      .group-heading {
        margin: 14px 0 8px;
        padding: 8px 10px;
        border-radius: var(--radius-sm);
        background: var(--surface-muted);
        color: var(--text);
        font-weight: 800;
      }

      .side-pane {
        display: grid;
        gap: 6px;
        align-self: start;
        position: sticky;
        top: var(--side-pane-top);
        max-height: none;
        overflow: visible;
        scrollbar-gutter: stable;
        overscroll-behavior: contain;
      }

      .side-pane .sidebar-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-height: 34px;
      }

      .sidebar-head-actions {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
      }

      .side-pane .sidebar-body {
        display: grid;
        gap: 6px;
      }

      .side-pane button {
        text-align: left;
      }

      .side-pane .sidebar-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .side-pane .sidebar-short {
        display: none;
        min-width: 24px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane {
        width: 42px;
        padding: 8px 5px;
        overflow: hidden;
        align-items: center;
        justify-items: center;
        scrollbar-width: none;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane::-webkit-scrollbar,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane::-webkit-scrollbar {
        width: 0;
        height: 0;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane button,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane button {
        text-align: center;
        padding-left: 6px;
        padding-right: 6px;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-text,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-body,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-group .sidebar-children,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short,
      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head strong,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-text,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-body,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-group .sidebar-children,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head strong {
        display: none;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-short {
        display: inline-flex;
      }

      .side-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head,
      .settings-layout[data-sidebar-collapsed="true"] .side-pane .sidebar-head {
        justify-content: center;
        width: 100%;
      }

      .side-pane .sidebar-group {
        display: grid;
        gap: 6px;
      }

      .side-pane .sidebar-children {
        display: grid;
        gap: 4px;
        padding-left: 12px;
      }

      .side-pane .sidebar-children button {
        padding-left: 10px;
      }

      .spinner {
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        display: inline-block;
        animation: spin 0.8s linear infinite;
        vertical-align: middle;
      }

      .status-spinner {
        margin-right: 8px;
      }

      .button-spinner {
        width: 12px;
        height: 12px;
        margin-right: 6px;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .side-pane button.active {
        background: var(--surface-muted);
        border-color: var(--accent);
        color: var(--accent-strong);
      }

      .empty,
      .loading,
      .error {
        padding: 28px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        color: var(--muted);
      }

      .error {
        color: var(--danger);
        border-color: #dfb7b7;
      }

      .auth-shell {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 28px 20px;
        background:
          radial-gradient(circle at top left, rgba(35, 93, 87, 0.18), transparent 32%),
          radial-gradient(circle at bottom right, rgba(16, 65, 61, 0.16), transparent 34%),
          linear-gradient(180deg, #f4f7f9 0%, #ebeff3 100%);
      }

      body[data-theme="dark"] .auth-shell {
        background:
          radial-gradient(circle at top left, rgba(87, 172, 161, 0.16), transparent 28%),
          radial-gradient(circle at bottom right, rgba(18, 26, 31, 0.92), transparent 30%),
          linear-gradient(180deg, #11171c 0%, #0b1014 100%);
      }

      .auth-card {
        width: min(940px, 100%);
        display: grid;
        grid-template-columns: minmax(0, 1.05fr) minmax(320px, 420px);
        gap: 0;
        border: 1px solid var(--border);
        border-radius: 24px;
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 24px 72px rgba(21, 34, 50, 0.16);
      }

      .auth-panel {
        padding: 34px;
      }

      .auth-panel.hero {
        position: relative;
        display: grid;
        align-content: start;
        gap: 18px;
        color: #fff;
        background:
          linear-gradient(135deg, rgba(19, 33, 45, 0.88), rgba(20, 77, 71, 0.9)),
          radial-gradient(circle at top right, rgba(255, 255, 255, 0.14), transparent 28%);
      }

      .auth-brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
      }

      .auth-brand .brand-mark {
        width: 42px;
        height: 42px;
        font-size: 15px;
      }

      .auth-panel.hero h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 44px);
        line-height: 1.02;
        letter-spacing: -0.04em;
      }

      .auth-panel.hero p {
        margin: 0;
        max-width: 54ch;
        color: rgba(255, 255, 255, 0.82);
        font-size: 15px;
      }

      .auth-bullets {
        display: grid;
        gap: 10px;
        margin: 6px 0 0;
        padding: 0;
        list-style: none;
        color: rgba(255, 255, 255, 0.9);
      }

      .auth-bullets li {
        display: flex;
        gap: 10px;
        align-items: flex-start;
      }

      .auth-bullets li::before {
        content: "•";
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.2;
      }

      .auth-panel.login {
        display: grid;
        gap: 18px;
      }

      .auth-panel.login h2 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }

      .auth-panel.login p {
        margin: 0;
        color: var(--muted);
      }

      .auth-button-slot {
        display: grid;
        gap: 12px;
        justify-items: start;
        min-height: 48px;
      }

      .auth-note {
        padding: 14px 16px;
        border-radius: var(--radius-md);
        background: var(--surface-muted);
        color: var(--muted);
      }

      .auth-error {
        display: none;
        padding: 12px 14px;
        border: 1px solid #dfb7b7;
        border-radius: var(--radius-md);
        background: #fff7f7;
        color: var(--danger);
      }

      body[data-theme="dark"] .auth-error {
        background: rgba(103, 37, 37, 0.2);
      }

      .auth-error.visible {
        display: block;
      }

      .auth-meta {
        display: grid;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }

      .auth-meta code {
        padding: 1px 6px;
        border-radius: 999px;
        background: var(--surface-muted);
        color: var(--text);
      }

      .error-hint {
        margin-top: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .status-line {
        min-height: 22px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 2px 12px;
        color: var(--muted);
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 18px;
        background: rgba(16, 24, 32, 0.38);
        backdrop-filter: blur(4px) saturate(1.05);
        -webkit-backdrop-filter: blur(4px) saturate(1.05);
        z-index: 20;
      }

      .modal {
        width: min(760px, 100%);
        max-height: 92vh;
        overflow: auto;
        background: var(--modal-surface);
        border: 1px solid var(--modal-border);
        border-radius: var(--radius-lg);
        box-shadow: 0 22px 64px rgba(0, 0, 0, 0.28);
        padding: 20px;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .modal-header h3 {
        margin: 0;
      }

      .pay-detail-modal .modal-header {
        position: sticky;
        top: 0;
        z-index: 2;
        margin-bottom: 16px;
        padding: 2px 0 16px;
        background: var(--modal-surface);
        border-bottom: 1px solid var(--modal-border);
      }

      .collapsible-section {
        border: 1px solid var(--modal-border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
        overflow: hidden;
      }

      .collapsible-section + .collapsible-section {
        margin-top: 12px;
      }

      .collapsible-section > summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        list-style: none;
        cursor: pointer;
        font-weight: 800;
        color: var(--text);
      }

      .collapsible-section > summary::-webkit-details-marker {
        display: none;
      }

      .collapsible-section > summary::after {
        content: "▸";
        color: var(--muted);
        font-size: 14px;
        line-height: 1;
      }

      .collapsible-section[open] > summary::after {
        content: "▾";
      }

      .collapsible-meta {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .collapsible-body {
        padding: 0 16px 16px;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .metric-card {
        display: grid;
        gap: 4px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: var(--surface);
        box-shadow: var(--shadow-soft);
      }

      .metric-card strong {
        font-size: 18px;
      }

      .project-dashboard-layout {
        display: grid;
        gap: 14px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .project-summary-row {
        cursor: pointer;
      }

      .project-summary-row:hover {
        background: rgba(127, 143, 156, 0.06);
      }

      .stack {
        display: grid;
        gap: 12px;
      }

      .grouped-day {
        border-top: 1px solid var(--border);
        padding: 12px 0;
      }

      .grouped-day:first-child {
        border-top: 0;
      }

      .day-heading {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 800;
        color: var(--muted);
      }

      .admin-grid {
        display: grid;
        grid-template-columns: minmax(260px, 0.8fr) minmax(320px, 1.2fr);
        gap: 16px;
      }

      .hidden {
        display: none !important;
      }

        .icon-button:not(.danger):hover,

      @media (max-width: 720px) {

    </style>
  </head>
  <body>
    <div id="app" class="loading">Loading Trust Ops...</div>
    <div id="modal-root"></div>
    <div id="action-popover-root"></div>

    <script>
      const AUTH_CONFIG = {
        clientId: document.querySelector('meta[name="google-oauth-client-id"]')?.content || "",
        githubAuthUrl: document.querySelector('meta[name="trust-ops-github-auth-url"]')?.content || "",
        webAppUrl: document.querySelector('meta[name="trust-ops-web-app-url"]')?.content || "",
        initialAuthToken: document.querySelector('meta[name="trust-ops-initial-auth-token"]')?.content || ""
      };

      const state = {
        tab: "board",
        data: null,
        auth: {
          idToken: "",
          email: "",
          name: "",
          picture: "",
          loading: false,
          initialized: false,
          error: ""
        },
        boardFilters: {},
        boardGrouping: "",
        selectedBoardViewId: "",
        boardSidebarCollapsed: false,
        timeFilters: {},
        timeMode: "Log",
        timeEntryType: "Task",
        timeSidebarCollapsed: false,
        payFilters: { rangeMode: "current" },
        paySidebarCollapsed: false,
        projectFilters: { rangeMode: "current", includeArchived: false, projectId: "" },
        projectSidebarCollapsed: false,
        projectTasksExpanded: false,
        projectEntriesModal: null,
        tableSorts: {},
        boardGroupExpanded: {},
        taskTreeExpanded: {},
        projectTreeExpanded: {},
        settingsSection: "profile",
        settingsSidebarCollapsed: false,
        settingsGroupOpen: true,
        loadingCount: 0,
        busyLabel: "",
        pendingCategorySave: null,
        pendingMigrationImport: null,
        status: "",
        migrationSourceType: "sheet",
        migrationImportMode: "append",
        migrationSpreadsheetId: ""
      };

      const AUTH_TOKEN_STORAGE_KEY = "trust-ops:auth-token";
      const STORAGE_FALLBACK = Object.create(null);
      const RETRYABLE_SERVER_METHODS = {
        getInitialData: true,
        refreshAppData: true,
        getBoardData: true,
        getProjectDashboard: true,
        getProjectDetail: true,
        getTimeEntries: true,
        getTrackerData: true,
        getPaySummary: true,
        getPaySummaryDetail: true,
        getPayPeriodForDate: true,
        getAuthDiagnostic: true,
        diagnoseUserAccess: true,
        getLegacyMigrationPreview: true
      };

      function storageKey(name) {
        return `trust-ops:${state.data?.context?.userId || "anonymous"}:${name}`;
      }

      function safeStorageGet(areaAccessor, key, fallback = "") {
        try {
          const area = typeof areaAccessor === "function" ? areaAccessor() : areaAccessor;
          if (!area) return fallback;
          const value = area.getItem(key);
          return value === null ? fallback : value;
        } catch (error) {
          return Object.prototype.hasOwnProperty.call(STORAGE_FALLBACK, key) ? STORAGE_FALLBACK[key] : fallback;
        }
      }

      function safeStorageSet(areaAccessor, key, value) {
        const normalized = String(value ?? "");
        try {
          const area = typeof areaAccessor === "function" ? areaAccessor() : areaAccessor;
          if (!area) return normalized;
          if (normalized) {
            area.setItem(key, normalized);
          } else {
            area.removeItem(key);
          }
        } catch (error) {
          if (normalized) {
            STORAGE_FALLBACK[key] = normalized;
          } else {
            delete STORAGE_FALLBACK[key];
          }
        }
        return normalized;
      }

      function loadStoredAuthToken() {
        return safeStorageGet(() => window.sessionStorage, AUTH_TOKEN_STORAGE_KEY, "");
      }

      function saveStoredAuthToken(token) {
        safeStorageSet(() => window.sessionStorage, AUTH_TOKEN_STORAGE_KEY, token);
      }

      function currentAppUrl() {
        return String(window.location.href || "").split("#")[0];
      }

      function canonicalAppUrl(value) {
        const text = String(value || "").trim();
        if (!text) return "";
        try {
          const url = new URL(text);
          url.hash = "";
          url.search = "";
          url.pathname = url.pathname.replace(/\/u\/\d+(?=\/)/g, "");
          url.pathname = url.pathname.replace(/\/{2,}/g, "/");
          return url.toString();
        } catch (error) {
          return text.replace(/\/u\/\d+(?=\/)/g, "/").split("#")[0].split("?")[0];
        }
      }

      function clearLocationHash() {
        try {
          window.history.replaceState({}, document.title, currentAppUrl());
        } catch (error) {}
      }

      function readAuthTokenFromWindowName() {
        try {
          const raw = String(window.name || "");
          if (!raw) return "";
          const parsed = JSON.parse(raw);
          const token = parsed?.trust_ops_token || "";
          if (token) {
            window.name = "";
          }
          return token;
        } catch (error) {
          return "";
        }
      }

      function readAuthTokenFromLocation() {
        const searchParams = new URLSearchParams(String(window.location.search || ""));
        const hash = String(window.location.hash || "").replace(/^#/, "");
        const hashParams = hash ? new URLSearchParams(hash) : new URLSearchParams();
        const token = searchParams.get("trust_ops_token") || searchParams.get("id_token") || searchParams.get("auth_token") || searchParams.get("token") || hashParams.get("trust_ops_token") || hashParams.get("id_token") || hashParams.get("auth_token") || hashParams.get("token") || "";
        if (token) {
          try {
            const url = new URL(currentAppUrl());
            url.searchParams.delete("trust_ops_token");
            url.searchParams.delete("id_token");
            url.searchParams.delete("auth_token");
            url.searchParams.delete("token");
            history.replaceState({}, document.title, `${url.pathname}${url.search}${url.hash}`);
          } catch (error) {
            clearLocationHash();
          }
        }
        return token;
      }

      function persistAuthToken(token) {
        const normalized = String(token || "").trim();
        state.auth.idToken = normalized;
        saveStoredAuthToken(normalized);
        return normalized;
      }

      function buildGithubAuthUrl() {
        if (!AUTH_CONFIG.githubAuthUrl) return "";
        const url = new URL(AUTH_CONFIG.githubAuthUrl);
        url.searchParams.set("client_id", AUTH_CONFIG.clientId || "");
        url.searchParams.set("return_url", canonicalAppUrl(AUTH_CONFIG.webAppUrl || currentAppUrl()));
        url.searchParams.set("app_name", organizationName());
        return url.toString();
      }

      function loadStoredBool(name, fallback = false) {
        const value = safeStorageGet(() => window.localStorage, storageKey(name), null);
        if (value === null) return fallback;
        return value === "true";
      }

      function saveStoredBool(name, value) {
        safeStorageSet(() => window.localStorage, storageKey(name), String(Boolean(value)));
      }

      function loadStoredString(name, fallback = "") {
        const value = safeStorageGet(() => window.localStorage, storageKey(name), null);
        return value === null ? fallback : value;
      }

      function saveStoredString(name, value) {
        safeStorageSet(() => window.localStorage, storageKey(name), String(value ?? ""));
      }

      function busyLabelForMethod(name) {
        const text = String(name || "").toLowerCase();
        if (text.includes("import")) return "Importing...";
        if (text.startsWith("get") || text.startsWith("refresh") || text.startsWith("list") || text.startsWith("load")) return "Loading...";
        if (text.includes("save") || text.includes("create") || text.includes("update") || text.includes("remove") || text.includes("delete") || text.includes("archive") || text.includes("approve") || text.includes("reject") || text.includes("share") || text.includes("lock") || text.includes("unlock")) return "Saving...";
        return "Working...";
      }

      function setBusy(message) {
        state.loadingCount += 1;
        state.busyLabel = message || state.busyLabel || "Loading...";
        renderBusyState();
      }

      function clearBusy() {
        state.loadingCount = Math.max(0, state.loadingCount - 1);
        if (!state.loadingCount) {
          state.busyLabel = "";
        }
        renderBusyState();
      }

      function renderBusyState() {
        const line = document.querySelector("[data-status-line]");
        if (line) line.innerHTML = state.loadingCount ? `<span class="spinner status-spinner"></span>${escapeHtml(state.busyLabel || "Loading...")}` : escapeHtml(state.status);
      }

      function currentAuthToken() {
        return state.auth.idToken || loadStoredAuthToken();
      }

      function isAuthFailure(error) {
        const message = String(error?.message || error || "");
        return /Google Sign-In|Google OAuth client ID|GitHub Pages auth|not authorized for Trust Ops|inactive:|archived:|verified email|wrong client|403|restricted access|page not available/i.test(message);
      }

      function isRetryableServerMethod(name) {
        return Boolean(RETRYABLE_SERVER_METHODS[String(name || "")]);
      }

      function isRetryableServerError(error) {
        const message = String(error?.message || error || "");
        return /NetworkError|HTTP 0|Failed to fetch|Load failed|The network connection was lost|Gateway Timeout|Service Unavailable|temporarily unavailable/i.test(message);
      }

      function mobileRecoveryHint(message) {
        const text = String(message || "");
        if (!/(403|restricted access|page not available|NetworkError|HTTP 0|Failed to fetch|Load failed)/i.test(text)) {
          return "";
        }
        return "If you opened Trust Ops inside another app or with multiple Google accounts signed in, open the GitHub Pages login directly in Safari or Chrome. A private or incognito tab can help avoid account and cookie conflicts.";
      }

      function showFatalError(message) {
        const root = document.getElementById("app");
        if (!root) return;
        root.className = "error";
        root.innerHTML = `
          <div class="error">
            <strong>Trust Ops crashed while loading.</strong><br>
            ${escapeHtml(message || "Unknown error")}
            ${mobileRecoveryHint(message) ? `<div class="error-hint">${escapeHtml(mobileRecoveryHint(message))}</div>` : ""}
          </div>`;
      }

      function clearAuthState(message = "") {
        state.auth.idToken = "";
        state.auth.email = "";
        state.auth.name = "";
        state.auth.picture = "";
        state.auth.loading = false;
        state.auth.initialized = false;
        state.auth.error = message || "";
        state.data = null;
        saveStoredAuthToken("");
        clearLocationHash();
      }

      function callServer(name, ...args) {
        const busyMessage = busyLabelForMethod(name);
        const maxRetries = isRetryableServerMethod(name) ? 2 : 0;
        setBusy(busyMessage);
        return new Promise((resolve, reject) => {
          const authToken = currentAuthToken();
          const invoke = (remainingRetries) => {
            google.script.run
              .withSuccessHandler((result) => {
                clearBusy();
                resolve(result);
              })
              .withFailureHandler((error) => {
                if (remainingRetries > 0 && isRetryableServerError(error)) {
                  window.setTimeout(() => invoke(remainingRetries - 1), 650);
                  return;
                }
                clearBusy();
                if (isAuthFailure(error)) {
                  clearAuthState(error.message || String(error));
                  renderAuthScreen(error.message || String(error));
                }
                reject(error);
              })
              .invokeServer(name, authToken, args);
          };
          invoke(maxRetries);
        });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function money(value) {
        return Number(value || 0).toLocaleString(undefined, { style: "currency", currency: "USD" });
      }

      function parseJson(value, fallback = {}) {
        try {
          return JSON.parse(value || "{}") || fallback;
        } catch (error) {
          return fallback;
        }
      }

      function normalizeHex(value, fallback = "#1f6f68") {
        const text = String(value || "").trim();
        return /^#[0-9a-fA-F]{6}$/.test(text) ? text.toLowerCase() : fallback;
      }

      function cssEscape(value) {
        return window.CSS && CSS.escape ? CSS.escape(String(value)) : String(value).replace(/"/g, '\\"');
      }

      function settingMap() {
        return Object.fromEntries((state.data?.settings || []).map((setting) => [setting["Setting Key"], setting["Setting Value"]]));
      }

      function organizationName() {
        return state.data?.organizationName || settingMap()[`ORGANIZATION_NAME`] || state.data?.appName || "Trust Ops";
      }

      function taskStatusColors() {
        return state.data?.visualSettings?.taskStatusColors || {};
      }

      function projectStatusColors() {
        return state.data?.visualSettings?.projectStatusColors || {};
      }

      function badgeStyleForStatus(status) {
        const color = taskStatusColors()[status];
        return color ? ` style="color: ${escapeHtml(color)}; border-color: ${escapeHtml(color)}; background: ${escapeHtml(color)}18;"` : "";
      }

      function badgeStyleForProjectStatus(status) {
        const color = projectStatusColors()[status];
        return color ? ` style="color: ${escapeHtml(color)}; border-color: ${escapeHtml(color)}; background: ${escapeHtml(color)}18;"` : "";
      }

      function initials(name) {
        return String(name || "?").split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join("").toUpperCase() || "?";
      }

      function avatarForUser(user, size = "") {
        const color = normalizeHex(user?.["Profile Color"], "#1f6f68");
        const imageUrl = user?.["Profile Image URL"] || user?.["Google Profile Photo URL"] || "";
        const style = `background:${escapeHtml(color)}`;
        return `<span class="avatar ${escapeHtml(size)}" style="${style}" title="${escapeHtml(user?.["Full Name"] || user?.Email || "")}">${imageUrl ? `<img alt="" src="${escapeHtml(imageUrl)}">` : escapeHtml(initials(user?.["Full Name"] || user?.Email))}</span>`;
      }

      function findUser(userId) {
        return (state.data.users || []).find((user) => String(user["User ID"]) === String(userId)) || null;
      }

      function renderColorField(name, value, fallback = "#1f6f68") {
        const color = normalizeHex(value, fallback);
        return `<div class="color-field" data-color-field>
          <input type="color" data-color-wheel="${escapeHtml(name)}" value="${escapeHtml(color)}" aria-label="${escapeHtml(name)} color">
          <input name="${escapeHtml(name)}" data-color-hex="${escapeHtml(name)}" value="${escapeHtml(color)}" pattern="^#[0-9a-fA-F]{6}$" maxlength="7">
        </div>`;
      }

      function renderAssigneeChips(task) {
        const ids = selectedList(task["Assignee User IDs"]);
        const names = selectedList(task.Assignees);
        const chips = ids.length ? ids : names;
        if (!chips.length) return '<span class="badge">Unassigned</span>';
        return `<span class="person-chip-list">${chips.map((assigneeIdOrName, index) => {
          const user = ids.length
            ? findUser(assigneeIdOrName)
            : (state.data.users || []).find((item) =>
                String(item["Full Name"] || "").toLowerCase() === String(assigneeIdOrName || "").toLowerCase() ||
                String(item.Email || "").toLowerCase() === String(assigneeIdOrName || "").toLowerCase()
              ) || null;
          const label = user?.["Full Name"] || names[index] || assigneeIdOrName;
          const color = normalizeHex(user?.["Profile Color"], "#1f6f68");
          return `<span class="person-chip" style="color:${escapeHtml(color)}; border-color:${escapeHtml(color)}; background:${escapeHtml(color)}18;">${escapeHtml(label)}</span>`;
        }).join("")}</span>`;
      }

      function renderProjectStatusBadge(status) {
        return `<span class="badge ${escapeHtml(String(status || "").toLowerCase())}"${badgeStyleForProjectStatus(status)}>${escapeHtml(status || "")}</span>`;
      }

      function projectDisplayName(project) {
        return project?.["Display Name"] || project?.["Project Name"] || "";
      }

      function taskDisplayName(task) {
        return task?.["Display Name"] || task?.Title || "";
      }

      function projectTreeStateKey(projectId) {
        return String(projectId || "");
      }

      function isProjectNodeExpanded(projectId) {
        return Boolean(state.projectTreeExpanded?.[projectTreeStateKey(projectId)]);
      }

      function setProjectNodeExpanded(projectId, expanded) {
        state.projectTreeExpanded = Object.assign({}, state.projectTreeExpanded, {
          [projectTreeStateKey(projectId)]: Boolean(expanded)
        });
      }

      function taskTreeStateKey(tableKey, taskId) {
        return `${String(tableKey || "board")}:${String(taskId || "")}`;
      }

      function isTaskNodeExpanded(tableKey, taskId) {
        const key = taskTreeStateKey(tableKey, taskId);
        if (Object.prototype.hasOwnProperty.call(state.taskTreeExpanded || {}, key)) {
          return Boolean(state.taskTreeExpanded[key]);
        }
        return tableKey === "projectTasks";
      }

      function setTaskNodeExpanded(tableKey, taskId, expanded) {
        state.taskTreeExpanded = Object.assign({}, state.taskTreeExpanded, {
          [taskTreeStateKey(tableKey, taskId)]: Boolean(expanded)
        });
      }

      function taskProjectMatchesFilter(task, projectId, projectsById) {
        const selectedProjectId = String(projectId || "");
        if (!selectedProjectId) return true;
        if (String(task["Project ID"] || "") === selectedProjectId) return true;
        const project = (projectsById || {})[String(task["Project ID"] || "")];
        return Boolean(project && String(project["Parent Project ID"] || "") === selectedProjectId);
      }

      function rootProjectOptions(excludeProjectId = "") {
        return (state.data.projects || []).filter((project) => !String(project["Parent Project ID"] || "") && String(project["Project ID"]) !== String(excludeProjectId || ""));
      }

      function rootTaskOptions(excludeTaskId = "") {
        return (state.data.tasks || []).filter((task) => !String(task["Parent Task ID"] || "") && String(task["Task ID"]) !== String(excludeTaskId || ""));
      }

      function syncTaskParentFields(form) {
        if (!form) return;
        const parentTaskId = form.parentTaskId?.value || "";
        const projectSelect = form.projectId;
        const parentTask = (state.data.tasks || []).find((task) => String(task["Task ID"]) === String(parentTaskId));
        if (projectSelect) {
          if (parentTask) {
            projectSelect.value = parentTask["Project ID"] || "";
            projectSelect.disabled = true;
          } else {
            projectSelect.disabled = false;
          }
        }
      }

      function options(items, valueKey, labelKey, selectedValue, includeBlank, blankLabel = "All") {
        const blank = includeBlank ? `<option value="">${escapeHtml(blankLabel)}</option>` : "";
        return blank + (items || []).map((item) => {
          const value = item[valueKey];
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(item[labelKey] || value)}</option>`;
        }).join("");
      }

      function constantOptions(values, selectedValue, includeBlank) {
        const blank = includeBlank ? '<option value="">All</option>' : "";
        return blank + (values || []).map((value) => {
          const selected = String(value) === String(selectedValue || "") ? "selected" : "";
          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(value)}</option>`;
        }).join("");
      }

      function selectedList(value) {
        return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
      }

      function renderCheckboxList(name, items, valueKey, labelKey, selectedValues) {
        const selected = new Set(selectedValues || []);
        return `<div class="checkbox-list">${(items || []).map((item) => `
          <label class="checkbox-row">

            <span>${escapeHtml(item[labelKey] || item[valueKey])}</span>
          </label>`).join("")}</div>`;
      }

      function tableSortConfig(tableKey) {
        return state.tableSorts?.[tableKey] || null;
      }

      function normalizeSortValue(value) {
        if (value === null || value === undefined) return { type: 2, value: "" };
        if (typeof value === "number" && Number.isFinite(value)) return { type: 0, value };
        const text = String(value).trim();
        if (!text) return { type: 2, value: "" };
        const numericText = text.replace(/[$,%]/g, "").trim();
        if (/^-?\d+(\.\d+)?$/.test(numericText)) {
          return { type: 0, value: Number(numericText) };
        }
        const dateValue = Date.parse(text);
        if (!Number.isNaN(dateValue) && /^\d{4}-\d{2}-\d{2}/.test(text)) {
          return { type: 0, value: dateValue };
        }
        return { type: 1, value: text.toLowerCase() };
      }

      function compareSortValues(left, right, direction) {
        const multiplier = direction === "desc" ? -1 : 1;
        if (left.type !== right.type) {
          return (left.type - right.type) * multiplier;
        }
        if (left.value < right.value) return -1 * multiplier;
        if (left.value > right.value) return 1 * multiplier;
        return 0;
      }

      function sortTableRows(rows, tableKey, columns) {
        const sort = tableSortConfig(tableKey);
        const accessor = sort && sort.key ? columns?.[sort.key] : null;
        if (!accessor) return (rows || []).slice();
        return (rows || []).slice().sort((left, right) => compareSortValues(
          normalizeSortValue(accessor(left)),
          normalizeSortValue(accessor(right)),
          sort.direction || "asc"
        ));
      }

      function setTableSort(tableKey, columnKey, defaultDirection = "asc") {
        const current = tableSortConfig(tableKey);
        const direction = current && current.key === columnKey
          ? (current.direction === "asc" ? "desc" : "asc")
          : defaultDirection;
        state.tableSorts = Object.assign({}, state.tableSorts, {
          [tableKey]: { key: columnKey, direction: direction }
        });
      }

      function renderSortHeader(tableKey, columnKey, label, defaultDirection = "asc") {
        const sort = tableSortConfig(tableKey);
        const active = sort && sort.key === columnKey;
        const direction = active ? (sort.direction || defaultDirection) : "";
        const indicator = active ? (direction === "desc" ? "&#9660;" : "&#9650;") : "&nbsp;";
        return `
          <th class="sortable-th">
            <button type="button" class="sort-header" data-sort-table="${escapeHtml(tableKey)}" data-sort-column="${escapeHtml(columnKey)}" data-sort-direction="${escapeHtml(defaultDirection)}" aria-sort="${active ? (direction === "desc" ? "descending" : "ascending") : "none"}">

      function buildTaskActionItems(task) {
        const taskId = task["Task ID"];

      function renderPayPeriodOptions(selectedValue, includeBlank) {
        const currentPeriodId = String(state.data?.currentPayPeriod?.["Pay Period ID"] || "");

          return `<option value="${escapeHtml(value)}" ${selected}>${escapeHtml(`${prefix} ${period["Pay Period Label"] || value}${current}`)}</option>`;
        }).join("");

      const MODAL_Z_INDEX_BASE = 1000;
      const MODAL_Z_INDEX_STEP = 20;
      const ACTION_POPOVER_Z_INDEX_DEFAULT = 2500;
      const ACTION_POPOVER_Z_INDEX_OFFSET = 8;

      function parseZIndex(value, fallback = 0) {
        const parsed = Number.parseInt(String(value || ""), 10);
        return Number.isFinite(parsed) ? parsed : fallback;
      }

      function modalBackdropZIndex(modal, fallbackLevel = 0) {
        if (!modal) return MODAL_Z_INDEX_BASE + (fallbackLevel * MODAL_Z_INDEX_STEP);
        const inline = parseZIndex(modal.style?.zIndex, 0);
        if (inline) return inline;
        const level = Number.parseInt(String(modal.dataset.modalLevel || ""), 10);
        if (Number.isFinite(level) && level > 0) {
          return MODAL_Z_INDEX_BASE + ((level - 1) * MODAL_Z_INDEX_STEP);
        }
        const computed = parseZIndex(window.getComputedStyle(modal).zIndex, 0);
        return computed || (MODAL_Z_INDEX_BASE + (fallbackLevel * MODAL_Z_INDEX_STEP));
      }

      function syncModalStacking() {
        const modals = Array.from(document.querySelectorAll("#modal-root .modal-backdrop"));
        modals.forEach((modal, index) => {
          const zIndex = MODAL_Z_INDEX_BASE + (index * MODAL_Z_INDEX_STEP);
          modal.dataset.modalLevel = String(index + 1);
          modal.style.zIndex = String(zIndex);
          if (index > 0) {
            modal.style.background = "rgba(16, 24, 32, 0.26)";
          } else {
            modal.style.background = "";
          }
        });
        return modals;
      }

      function setModal(html) {
        document.getElementById("modal-root").innerHTML = html;
        syncModalStacking();
      }

      function pushModal(html) {
        const root = document.getElementById("modal-root");
        root.insertAdjacentHTML("beforeend", html);
        syncModalStacking();
      }

      function closeTopModal() {
        const modals = document.querySelectorAll("#modal-root .modal-backdrop");
        if (!modals.length) return;
        const removed = modals[modals.length - 1];
        removed.remove();
        syncModalStacking();
        if (removed.dataset.projectEntriesModal === "true" && !document.querySelector("#modal-root .modal-backdrop[data-project-entries-modal='true']")) {
          state.projectEntriesModal = null;
        }
      }

      function clearModals() {
        closeActionMenus();
        document.getElementById("modal-root").innerHTML = "";
        state.projectEntriesModal = null;
      }

      const ACTION_POPOVER_CLOSE_DELAY_MS = 85;
      let actionPopoverCloseTimer = null;
      let activeActionPopover = null;
      const supportsHoverInteraction = Boolean(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);

      function getActionPopoverRoot() {
        return document.getElementById("action-popover-root");
      }

      function clearActionPopoverCloseTimer() {
        if (actionPopoverCloseTimer) {
          clearTimeout(actionPopoverCloseTimer);
          actionPopoverCloseTimer = null;
        }
      }

      function scheduleActionPopoverClose() {
        clearActionPopoverCloseTimer();
        actionPopoverCloseTimer = setTimeout(() => {
          closeActionMenus();
        }, ACTION_POPOVER_CLOSE_DELAY_MS);
      }

      function getActionPopoverSurface(eventTarget) {
        if (!eventTarget) return null;
        return eventTarget.closest("[data-action-popover], [data-action-popover-floating]");
      }

      function isInsideActiveActionPopover(node) {
        if (!node) return false;
        const root = getActionPopoverRoot();
        const floating = root ? root.querySelector("[data-action-popover-floating]") : null;
        return Boolean(
          (activeActionPopover && activeActionPopover.contains(node)) ||
          (floating && floating.contains(node))
        );
      }

      function closeActionMenus() {
        clearActionPopoverCloseTimer();
        activeActionPopover = null;
        const root = getActionPopoverRoot();
        if (root) {
          root.innerHTML = "";
          root.style.zIndex = String(ACTION_POPOVER_Z_INDEX_DEFAULT);
        }
        document.querySelectorAll("[data-action-popover]").forEach((menu) => {
          menu.dataset.open = "false";
          menu.dataset.hoverOpen = "false";
          menu.dataset.measuring = "false";
          menu.dataset.openDirection = "";
        });
        document.querySelectorAll("[data-action-menu-trigger]").forEach((button) => {
          button.setAttribute("aria-expanded", "false");
        });
      }

      function getActionPopoverBoundaryRect() {
        const shell = document.querySelector(".app-shell");
        if (shell) return shell.getBoundingClientRect();
        return { top: 0, left: 0, right: window.innerWidth, bottom: window.innerHeight };
      }

      function measureActionPopover(popover) {
        if (!popover) return "down";
        const trigger = popover.querySelector("[data-action-menu-trigger]");
        const root = getActionPopoverRoot();
        const menu = root ? root.querySelector("[data-action-popover-floating]") : null;
        if (!trigger || !menu) return "down";
        const rect = trigger.getBoundingClientRect();
        const boundaryRect = getActionPopoverBoundaryRect();
        menu.style.visibility = "hidden";
        menu.style.left = "0px";
        menu.style.top = "0px";
        menu.style.maxHeight = "";
        menu.style.overflowY = "visible";
        const menuRect = menu.getBoundingClientRect();
        const menuHeight = Math.ceil(menuRect.height || 0);
        const menuWidth = Math.ceil(menuRect.width || 0);
        const gap = 6;
        const padding = 8;
        const spaceBelow = boundaryRect.bottom - rect.bottom - gap - padding;
        const spaceAbove = rect.top - boundaryRect.top - gap - padding;
        let openUp = false;
        if (spaceBelow >= menuHeight) {
          openUp = false;
        } else if (spaceAbove >= menuHeight) {
          openUp = true;
        } else {
          openUp = spaceAbove > spaceBelow;
        }
        const availableHeight = Math.max(64, Math.floor(openUp ? spaceAbove : spaceBelow));
        const displayHeight = Math.min(menuHeight, availableHeight);
        const top = openUp ? rect.top - gap - displayHeight : rect.bottom + gap;
        const left = Math.min(
          Math.max(boundaryRect.left + padding, rect.right - menuWidth),
          Math.max(boundaryRect.left + padding, boundaryRect.right - menuWidth - padding)
        );
        popover.dataset.openDirection = openUp ? "up" : "down";
        menu.dataset.openDirection = popover.dataset.openDirection;
        menu.style.left = `${Math.max(boundaryRect.left + padding, Math.round(left))}px`;
        menu.style.top = `${Math.max(boundaryRect.top + padding, Math.round(top))}px`;
        menu.style.maxHeight = `${availableHeight}px`;
        menu.style.overflowY = menuHeight > availableHeight ? "auto" : "visible";
        menu.style.visibility = "visible";
        return popover.dataset.openDirection;
      }

      function renderActionPopoverOverlay(popover) {
        const root = getActionPopoverRoot();
        if (!root || !popover) return null;
        const template = popover.querySelector(".action-popover-menu");
        if (!template) return null;
        const sourceBackdrop = popover.closest(".modal-backdrop");
        const stackSource = sourceBackdrop?.dataset.stackSource || (sourceBackdrop?.dataset.projectEntriesModal === "true" ? "project-entries" : "");
        root.innerHTML = `
          <div class="action-popover action-popover-floating" data-action-popover-floating${stackSource ? ` data-stack-source="${escapeHtml(stackSource)}"` : ""} aria-hidden="false">
            ${template.innerHTML}
          </div>`;
        return root.querySelector("[data-action-popover-floating]");
      }

      function syncActionPopoverStacking(popover, floating) {
        const root = getActionPopoverRoot();
        if (!root) return;
        const sourceModal = popover?.closest(".modal-backdrop") || activeActionPopover?.closest(".modal-backdrop") || null;
        const sourceZIndex = sourceModal ? modalBackdropZIndex(sourceModal) : ACTION_POPOVER_Z_INDEX_DEFAULT;
        const rootZIndex = sourceModal ? sourceZIndex + ACTION_POPOVER_Z_INDEX_OFFSET : ACTION_POPOVER_Z_INDEX_DEFAULT;
        root.style.zIndex = String(rootZIndex);
        if (floating) {
          floating.style.zIndex = String(rootZIndex + 1);
        }
      }

      function openActionPopover(popover, mode = "click") {
        if (!popover) return;
        const trigger = popover.querySelector("[data-action-menu-trigger]");
        if (!trigger) return;
        closeActionMenus();
        activeActionPopover = popover;
        popover.dataset.openDirection = popover.dataset.openDirection || "down";
        if (mode === "hover") popover.dataset.hoverOpen = "true";
        else popover.dataset.open = "true";
        popover.dataset.measuring = "true";
        trigger.setAttribute("aria-expanded", "true");
        const floating = renderActionPopoverOverlay(popover);
        syncActionPopoverStacking(popover, floating);
        requestAnimationFrame(() => {
          if (!popover.isConnected) return;
          if (!floating || activeActionPopover !== popover) return;
          syncActionPopoverStacking(popover, floating);
          measureActionPopover(popover);
          popover.dataset.measuring = "false";
        });
      }

      function setActionPopoverState(popover, open, mode = "click") {
        if (!popover) return;
        if (!open) {
          closeActionMenus();
          return;
        }
        openActionPopover(popover, mode);
      }

      function toggleActionPopover(popover) {
        if (!popover) return;
        const isOpen = popover.dataset.open === "true";
        if (isOpen) closeActionMenus();
        else setActionPopoverState(popover, true, "click");

      function syncActionPopoverPlacement() {
        if (!activeActionPopover) return;
        document.querySelectorAll("[data-action-popover][data-open='true'], [data-action-popover][data-hover-open='true']").forEach((popover) => {

      async function loadInitial() {

          if (windowNameToken) {
            persistAuthToken(windowNameToken);
          } else {
            const locationToken = readAuthTokenFromLocation();
            if (locationToken) {
              persistAuthToken(locationToken);
            } else {
              state.auth.idToken = loadStoredAuthToken();
