                <span>Configured client ID: <code>${escapeHtml(AUTH_CONFIG.clientId || "missing")}</code></span>
                <span>GitHub Pages auth URL: <code>${escapeHtml(AUTH_CONFIG.githubAuthUrl || "missing")}</code></span>
                <span>Stored token lives only in this browser session, and falls back to in-memory storage if browser storage is blocked.</span>
              </div>
            </div>
          </section>`;
      }

      function signOut() {
        clearModals();
        state.tab = "board";
        clearAuthState("");
        renderAuthScreen("");
      }

      async function refreshData(parts = {}) {
        setStatus("Saving...");
        const payload = {
          taskFilters: state.boardFilters,
          timeFilters: state.timeFilters,
          payFilters: safePayFiltersForRefresh(),
          projectFilters: safeProjectFiltersForRefresh()
        };
        const fresh = await callServer("refreshAppData", payload);
        Object.assign(state.data, fresh);
        applyUserPreferences();
        setStatus(parts.message || "Updated.");
        render();
      }

      async function refreshBoardData(message = "Board updated.") {
        const fresh = await callServer("getBoardData", state.boardFilters);
        Object.assign(state.data, fresh);
        setStatus(message);
        render();
      }

      async function refreshTrackerData(message = "Time tracker refreshed.") {
        state.data.tracker = await callServer("getTrackerData", state.timeFilters);
        setStatus(message);
        render();
      }

      async function refreshPaySummaryData(message = "Pay summary refreshed.") {
        state.data.paySummary = await callServer("getPaySummary", safePayFiltersForRefresh());
        setStatus(message);
        render();
      }

      async function refreshProjectDashboardData(message = "Project dashboard refreshed.") {
        state.data.projectDashboard = await callServer("getProjectDashboard", safeProjectFiltersForRefresh());
        setStatus(message);
        render();
      }

      function upsertLocalTag(tag) {
        const tags = state.data.tags || [];
        const index = tags.findIndex((item) => item["Tag ID"] === tag["Tag ID"]);
        if (index === -1) tags.push(tag);
        else tags[index] = tag;
        tags.sort((a, b) => String(a.Tag).localeCompare(String(b.Tag)));
        state.data.tags = tags;
      }

      let stickyLayoutObserver = null;
      let stickyLayoutObservedTopbar = null;
      let stickyLayoutObservedRegion = null;

      function syncStickyOffsets() {
        const appTopbar = document.querySelector(".app-topbar");
        const stickyRegion = document.querySelector(".sticky-region");
        const appTopbarHeight = appTopbar ? Math.ceil(appTopbar.getBoundingClientRect().height) : 0;
        const stickyRegionHeight = stickyRegion ? Math.ceil(stickyRegion.getBoundingClientRect().height) : 0;

        document.documentElement.style.setProperty("--app-topbar-height", `${appTopbarHeight}px`);
        document.documentElement.style.setProperty("--sticky-region-height", `${stickyRegionHeight}px`);

        if (!window.ResizeObserver) return;
        if (!stickyLayoutObserver) {
          stickyLayoutObserver = new ResizeObserver(() => syncStickyOffsets());
        }

        if (stickyLayoutObservedTopbar !== appTopbar) {
          if (stickyLayoutObservedTopbar) stickyLayoutObserver.unobserve(stickyLayoutObservedTopbar);
          if (appTopbar) stickyLayoutObserver.observe(appTopbar);
          stickyLayoutObservedTopbar = appTopbar;
        }

        if (stickyLayoutObservedRegion !== stickyRegion) {
          if (stickyLayoutObservedRegion) stickyLayoutObserver.unobserve(stickyLayoutObservedRegion);
          if (stickyRegion) stickyLayoutObserver.observe(stickyRegion);
          stickyLayoutObservedRegion = stickyRegion;
        }
      }

      function render() {
        const data = state.data;
        if (!data) {
          renderAuthScreen(state.auth.error || "");
          return;
        }
        closeActionMenus();
        applyUserPreferences();
        const tabs = [
          ["board", "Assignment Board"],
          ["projects", "Projects"],
          ["time", "Time Tracker"],
          ["pay", "Pay Summary"]
        ];
        tabs.push(["settings", "Settings"]);
        document.getElementById("app").className = "app-shell";
        document.getElementById("app").innerHTML = `
          <div class="app-topbar">
            <header>
              <div class="brand">
                <div class="brand-mark">TO</div>
                <div>
                  <h1>${escapeHtml(organizationName())}</h1>
                  <p>Tasks, time, pay periods, and administration</p>
                </div>
              </div>
              <div class="user-chip user-chip-current">${avatarForUser(data.currentUser)}<span>${escapeHtml(data.context.fullName)} / ${escapeHtml(data.context.role)}</span><button type="button" class="link" data-action="sign-out">Sign out</button></div>
            </header>
            <nav>
              ${tabs.map(([id, label]) => `<button class="${state.tab === id ? "active" : ""}" data-tab="${id}">${label}</button>`).join("")}
            </nav>
          </div>
          <main>
            <div class="status-line" data-status-line>${state.loadingCount ? `<span class="spinner status-spinner"></span>${escapeHtml(state.busyLabel || "Loading...")}` : escapeHtml(state.status)}</div>
            ${renderActiveTab()}
          </main>
        `;
        syncStickyOffsets();
        renderBusyState();
        syncMigrationMode();
      }

      function renderActiveTab() {
        if (state.tab === "time") return renderTimeTracker();
        if (state.tab === "pay") return renderPaySummary();
        if (state.tab === "projects") return renderProjectDashboard();
        if (state.tab === "settings") return renderSettings();
        return renderBoard();
      }

      function applyBoardFilters(tasks) {
        const filters = state.boardFilters;
        const search = String(filters.search || "").toLowerCase();
        const projectsById = (state.data.projects || []).reduce((acc, project) => {
          acc[String(project["Project ID"] || "")] = project;
          return acc;
        }, {});
        return (tasks || []).filter((task) => {
          if (filters.status && task.Status !== filters.status) return false;
          if (filters.projectId && !taskProjectMatchesFilter(task, filters.projectId, projectsById)) return false;
          if (filters.priority && task.Priority !== filters.priority) return false;
          if (filters.assigneeUserId && !String(task["Assignee User IDs"] || "").split(",").map((id) => id.trim()).includes(filters.assigneeUserId)) return false;
          if (filters.tag && selectedList(task.Tags).indexOf(filters.tag) === -1) return false;
          if (search) {
            const haystack = [task.Title, task["Display Name"], task.Notes, task.Status, task.Assignees, task["Project Display Name"], task["Project Name"], task.Priority, task.Tags].join(" ").toLowerCase();
            if (!haystack.includes(search)) return false;
          }
          return true;
        });
      }

      function selectedBoardView() {
        return (state.data.boardViews || []).find((view) => String(view["Board View ID"]) === String(state.selectedBoardViewId)) || null;
      }

      function canModifyBoardView(view) {
        if (!view) return false;
        return String(view["Owner User ID"]) === String(state.data.context.userId) || state.data.permissions.canManageBoardViews;
      }

      function buildBoardViewPayload(form) {
        const view = selectedBoardView();
        const canUpdate = canModifyBoardView(view);
        return {
          viewId: canUpdate ? state.selectedBoardViewId : "",
          viewName: form.viewName.value,
          visibility: canUpdate ? form.visibility.value : "Private",
          filters: state.boardFilters,
          grouping: state.boardGrouping
        };
      }

      function groupTaskKey(task) {
        const grouping = state.boardGrouping || "";
        if (grouping === "Status") return task.Status || "No status";
        if (grouping === "Project") return task["Project Display Name"] || task["Project Name"] || "No project";
        if (grouping === "Assignee") return task.Assignees || "Unassigned";
        if (grouping === "Priority") return task.Priority || "No priority";
        if (grouping === "Tag") return task.Tags || "No tag";
        if (grouping === "Due Week") return task["Due Date"] ? task["Due Date"].slice(0, 10) : "No due date";
        return "";
      }

      function renderBoardResults(tasks) {
        if (!tasks.length) return '<div class="empty">No tasks match the current filters.</div>';
        if (!state.boardGrouping) return renderTaskTable(tasks, "board");
        const grouped = tasks.reduce((acc, task) => {
          const key = groupTaskKey(task);
          acc[key] = acc[key] || [];
          acc[key].push(task);
          return acc;
        }, {});
        return `<div class="grouped-board">${Object.keys(grouped).sort().map((key) => {
          const expanded = isBoardGroupExpanded(key);
          return `
            <section class="board-group">
              <button type="button" class="board-group-toggle" data-action="toggle-board-group" data-board-group-key="${escapeHtml(key)}">
                <strong>${escapeHtml(key)} <span class="badge">${grouped[key].length}</span></strong>
                <span class="sort-indicator">${expanded ? "&#9660;" : "&#9654;"}</span>
              </button>
              <div class="board-group-body" ${expanded ? "" : "hidden"}>
                ${renderTaskTable(grouped[key], "board")}
              </div>
            </section>`;
        }).join("")}</div>`;
      }

      function updateBoardResultsOnly() {
        const count = applyBoardFilters(state.data.tasks).length;
        const toolbarCount = document.querySelector('section.toolbar p');
        if (toolbarCount) toolbarCount.textContent = `${count} visible task${count === 1 ? "" : "s"}`;
        const container = document.getElementById("board-results");
        if (!container) return;
        container.innerHTML = renderBoardResults(applyBoardFilters(state.data.tasks));
      }

      function hierarchyRoots(rows, parentKey, idKey) {
        const byId = (rows || []).reduce((acc, row) => {
          acc[String(row[idKey] || "")] = row;
          return acc;
        }, {});
        return (rows || []).filter((row) => {
          const parentId = String(row[parentKey] || "");
          return !parentId || !byId[parentId];
        });
      }

      function hierarchyChildren(rows, parentKey, parentId) {
        return (rows || []).filter((row) => String(row[parentKey] || "") === String(parentId || ""));
      }

      function hierarchyLevelStyle(level) {
        return ` style="--hierarchy-level:${Number(level || 0)};"`;
      }

      function renderBoard() {
        const data = state.data;
        const tasks = applyBoardFilters(data.tasks);
        const view = selectedBoardView();
        const canDeleteSelectedView = canModifyBoardView(view);
        return `
          <div class="sticky-region">
            <section class="toolbar">
              <div>
                <h2>Assignment Board</h2>
                <p>${tasks.length} visible task${tasks.length === 1 ? "" : "s"}</p>
              </div>
              <div class="actions">
                ${data.permissions.canCreateTask ? renderIcon("new-task", "", "", "Create Task", "&#10133;", false) : ""}
              </div>
            </section>
          </div>
          <section class="side-layout" data-sidebar-collapsed="${state.boardSidebarCollapsed ? "true" : "false"}">
            ${renderLayoutSidebar("Filters", "boardSidebarCollapsed", `
              <label>Saved View <select data-action="load-board-view">
                <option value="">Select view</option>
                ${(data.boardViews || []).map((item) => `<option value="${escapeHtml(item["Board View ID"])}" ${String(item["Board View ID"]) === String(state.selectedBoardViewId) ? "selected" : ""}>${escapeHtml(item["View Name"])} (${escapeHtml(item.Visibility)})</option>`).join("")}
              </select></label>
              <label>Search <input data-filter="search" value="${escapeHtml(state.boardFilters.search || "")}" placeholder="Task, notes, tags"></label>
              <label>Status <select data-filter="status">${constantOptions(data.constants.taskStatuses, state.boardFilters.status, true)}</select></label>
              <label>Project <select data-filter="projectId">${options(data.projects, "Project ID", "Display Name", state.boardFilters.projectId, true)}</select></label>
              <label>Assignee <select data-filter="assigneeUserId">${options(data.users, "User ID", "Full Name", state.boardFilters.assigneeUserId, true)}</select></label>
              <label>Priority <select data-filter="priority">${constantOptions(data.constants.priorities, state.boardFilters.priority, true)}</select></label>
              <label>Tag <select data-filter="tag">${options(data.tags || [], "Tag", "Tag", state.boardFilters.tag, true)}</select></label>
              <label>Group By <select data-board-grouping>
                ${constantOptions(["", "Status", "Project", "Assignee", "Priority", "Due Week", "Tag"], state.boardGrouping, false)}
              </select></label>
            `, `
              ${renderIcon("save-board-view", "", "", "Save View", "&#128190;")}
              ${canDeleteSelectedView ? renderIcon("delete-board-view", "", "", "Delete View", "&#128465;", true) : ""}
              ${renderIcon("clear-board-filters", "", "", "Clear Filters", "&#10006;")}
            `)}
            <div>
              <section class="panel" id="board-results">
                ${renderBoardResults(tasks)}
              </section>
            </div>
          </section>
        `;
      }

      function renderTaskTable(tasks, tableKey = "board") {
        const sortColumns = tableKey === "projectTasks" ? {
          task: (task) => taskDisplayName(task),
          status: (task) => task.Status,
          assignees: (task) => task.Assignees || selectedList(task["Assignee User IDs"]).join(", "),
          priority: (task) => task.Priority
        } : {
          task: (task) => taskDisplayName(task),
          status: (task) => task.Status,
          assignees: (task) => task.Assignees || selectedList(task["Assignee User IDs"]).join(", "),
          project: (task) => task["Project Display Name"] || task["Project Name"],
          priority: (task) => task.Priority,
          due: (task) => task["Due Date"]
        };
        const isProjectTaskTable = tableKey === "projectTasks";
        const rootTasks = hierarchyRoots(tasks, "Parent Task ID", "Task ID");
        function renderTaskNode(task, level = 0) {
          const hasChildren = Number(task["Child Task Count"] || 0) > 0 && !String(task["Parent Task ID"] || "");
          const expanded = isTaskNodeExpanded(tableKey, task["Task ID"]);
          const childTasks = hasChildren ? sortTableRows(hierarchyChildren(tasks, "Parent Task ID", task["Task ID"]), tableKey, sortColumns) : [];
          return `
            <tr class="${level ? "hierarchy-child-row" : "hierarchy-parent-row"}" data-task-id="${escapeHtml(task["Task ID"])}" data-task-level="${escapeHtml(level)}">
              <td data-label="Task">
                <div class="hierarchy-cell"${hierarchyLevelStyle(level)}>
                  ${hasChildren ? `<button type="button" class="hierarchy-toggle" data-action="toggle-task-node" data-task-id="${escapeHtml(task["Task ID"])}" aria-label="${expanded ? "Collapse" : "Expand"} subtasks">${expanded ? "&#9660;" : "&#9654;"}</button>` : `<span class="hierarchy-toggle-spacer"></span>`}
                  <div class="hierarchy-main">
                    <div class="hierarchy-title-row">
                      <strong>${escapeHtml(taskDisplayName(task))}</strong>
                      ${renderHierarchyTitleBadges(task.Notes, task["Child Task Count"], "subtask")}
                    </div>
                    ${task["Parent Task ID"] && !level ? `<div class="hierarchy-subtitle">Parent: ${escapeHtml(task["Parent Task Title"] || task["Parent Task ID"])}</div>` : ""}
                    <div class="hierarchy-meta">
                      ${task["Child Task Count"] ? `<span class="badge">${escapeHtml(task["Progress Percent"])}%</span>` : ""}
                      ${task.Tags ? `<span class="badge">${escapeHtml(task.Tags)}</span>` : ""}
                    </div>
                  </div>
                </div>
              </td>
              <td data-label="Status"><span class="badge ${escapeHtml(String(task.Status).toLowerCase())}"${badgeStyleForStatus(task.Status)}>${escapeHtml(task.Status)}</span></td>
              <td data-label="Assignees">${renderAssigneeChips(task)}</td>
              ${isProjectTaskTable ? "" : `<td data-label="Project">${escapeHtml(task["Project Display Name"] || task["Project Name"])}</td>`}
              <td data-label="Priority"><span class="badge ${escapeHtml(String(task.Priority).toLowerCase())}">${escapeHtml(task.Priority)}</span></td>
              ${isProjectTaskTable ? "" : `<td data-label="Due">${escapeHtml(task["Due Date"])}</td>`}
              <td data-label="Actions">
                ${renderTaskActionMenu(task)}
              </td>
            </tr>
            ${expanded ? childTasks.map((child) => renderTaskNode(child, level + 1)).join("") : ""}`;
        }
        return `
          <div class="table-wrap" data-popover-boundary data-task-table-key="${escapeHtml(tableKey)}">
            <table class="${isProjectTaskTable ? "project-task-table" : "board-table"}">
              <thead>
                <tr>
                  ${renderSortHeader(tableKey, "task", "Task")}
                  ${renderSortHeader(tableKey, "status", "Status")}
                  ${renderSortHeader(tableKey, "assignees", "Assignees")}
                  ${isProjectTaskTable ? "" : renderSortHeader(tableKey, "project", "Project")}
                  ${renderSortHeader(tableKey, "priority", "Priority")}
                  ${isProjectTaskTable ? "" : renderSortHeader(tableKey, "due", "Due")}
                  ${renderActionsHeader()}
                </tr>
              </thead>
              <tbody>
                ${sortTableRows(rootTasks, tableKey, sortColumns).map((task) => renderTaskNode(task, 0)).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      function renderTimeLockFields(period) {
        const locked = String(period?.Locked) === "true" || period?.Status === "Locked";
        if (!locked) return "";
        if (state.data.permissions.canOverrideLockedPeriod) {
          return '<label>Override Reason <input name="overrideReason" placeholder="Required for locked-period override"></label>';
        }
        return '<label>Request Reason <input name="requestReason" placeholder="Required for locked-period request"></label>';
      }

      function renderTimeSourceBadge(entrySource) {
        const source = String(entrySource || "Logged");
        const label = source === "Clocked" ? "Clocked" : "Logged";
        return `<span class="badge" title="Entry source">${escapeHtml(label)}</span>`;
      }

      function renderTimeEntrySubtitle(entry) {
        if ((entry["Entry Source"] || "Logged") !== "Clocked") return "";
        const inAt = entry["Clock In At"] || "";
        const outAt = entry["Clock Out At"] || "";
        return `<div class="hierarchy-subtitle">${escapeHtml(inAt)}${outAt ? ` - ${escapeHtml(outAt)}` : ""}</div>`;
      }

      function toDateTimeInputValue(value) {
        return String(value || "").replace(" ", "T").slice(0, 19);
      }

      function renderActivePunchBanner(activePunch) {
        if (!activePunch) return "";
        const inAt = activePunch["Clock In At"] || "";
        const outAt = activePunch["Clock Out At"] || "";
        return `
          <div class="panel" style="margin-bottom:14px;border-style:dashed;">
            <strong>Active punch</strong>
            <div class="help">Started ${escapeHtml(inAt)}${outAt ? ` and ended ${escapeHtml(outAt)}` : ""}</div>
            <div class="help">${escapeHtml(activePunch["Task / Category"] || "Unassigned")} &middot; ${escapeHtml(activePunch["Project Name"] || "")}</div>
          </div>`;
      }

      function findClientPayPeriodForDate(dateValue) {
        const date = String(dateValue || "");
        return (state.data.payPeriods || []).find((period) => date >= String(period["Start Date"]) && date <= String(period["End Date"])) || null;
      }

      function renderTimeTracker() {
        const data = state.data;
        const tracker = data.tracker || {};
        const targetUserId = tracker.targetUserId || state.timeFilters.userId || data.context.userId;
        const canSelectUser = data.permissions.canCreateTimeForAnyUser;
        const entries = tracker.entries || [];
        const totalHours = entries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
        const selectedPeriod = tracker.selectedPayPeriod || data.currentPayPeriod || {};
        const periodLocked = String(selectedPeriod.Locked) === "true" || selectedPeriod.Status === "Locked";
        const selectedUser = (data.users || []).find((user) => user["User ID"] === targetUserId) || data.currentUser;
        const defaultEntryDate = selectedPeriod["Start Date"] || new Date().toISOString().slice(0, 10);
        const mode = state.timeMode || "Log";
        const activePunch = tracker.activePunch || null;
        const punchMode = mode === "Punch";
        const punchButtonLabel = punchMode ? (activePunch ? "Clock Out" : "Clock In") : "Save Time";
        const entryType = state.timeEntryType || "Task";
        const showTaskFields = entryType === "Task";
        return `
          <section class="toolbar">
            <div>
              <h2>Time Tracker</h2>
              <p>${entries.length === 1 ? "1 entry" : `${entries.length} entries`} &middot; ${totalHours.toFixed(2)} selected-period hours${activePunch ? ` &middot; active punch on ${escapeHtml(activePunch["Clock In At"] || "")}` : ""}</p>
            </div>
          </section>
          <section class="side-layout" data-sidebar-collapsed="${state.timeSidebarCollapsed ? "true" : "false"}">
            ${renderLayoutSidebar("Filters", "timeSidebarCollapsed", `
              ${canSelectUser ? `<label>User <select data-time-filter="userId">${options(data.users, "User ID", "Full Name", targetUserId, false)}</select></label>` : `<label>User <input value="${escapeHtml(selectedUser["Full Name"] || data.context.fullName)}" disabled></label>`}
              <label>Entries Period <select data-time-filter="payPeriodId">${renderPayPeriodOptions(state.timeFilters.payPeriodId, false)}</select></label>
            `)}
            <div class="stack">
              ${renderActivePunchBanner(activePunch)}
              <section class="panel">
                <h3>${punchMode ? "Punch Time" : "Log Time"}</h3>
                <form data-form="time-entry" class="stack">
                  <div class="form-grid">
                    <label>User <input value="${escapeHtml(selectedUser["Full Name"] || data.context.fullName)}" disabled></label>
                    <label>Mode <select name="timeMode">
                      <option value="Log" ${mode === "Log" ? "selected" : ""}>Log</option>
                      <option value="Punch" ${mode === "Punch" ? "selected" : ""}>Punch</option>
                    </select></label>
                    <label>Entry Type <select name="entryType">
                      <option value="Task" ${entryType === "Task" ? "selected" : ""}>Task Time</option>
                      <option value="General Time" ${entryType === "General Time" ? "selected" : ""}>General Time</option>
                    </select></label>
                    ${punchMode ? "" : `<label>Date <input name="date" type="date" value="${escapeHtml(defaultEntryDate)}"></label>`}
                    ${punchMode ? "" : `<label>Hours <input name="hours" type="number" min="0.1" max="24" step="0.1" required></label>`}
                  </div>
                  ${punchMode && activePunch ? `
                    <div class="panel" style="box-shadow:none;margin:0;background:var(--surface-muted);">
                      <h3 style="margin-top:0;">Open Punch</h3>
                      <div class="help">${escapeHtml(activePunch["Task / Category"] || "Unassigned")} &middot; ${escapeHtml(activePunch["Project Name"] || "")}</div>
                      <div class="help">In at ${escapeHtml(activePunch["Clock In At"] || "")}</div>
                      ${tracker.activePunchWarning ? `<div class="help" style="color:var(--warning);">${escapeHtml(tracker.activePunchWarning)}</div>` : ""}
                    </div>
                    <div class="help">Use Transfer to end the current punch and start another at the same time.</div>
                    <div class="form-grid two ${showTaskFields ? "" : "hidden"}" data-time-mode="task">
                      <label>Task <select name="taskId">${options(tracker.availableTasks || [], "Task ID", "Display Name", "", false)}</select></label>
                      <label>Notes <input name="notes" placeholder="Optional notes for the new punch"></label>
                    </div>
                    <div class="form-grid two ${showTaskFields ? "hidden" : ""}" data-time-mode="general">
                      <label>Category <select name="categoryId">${options(tracker.categories || [], "Category ID", "Category", "", false)}</select></label>
                      <label>Notes <input name="generalNotes" placeholder="Optional notes for the new punch"></label>
                    </div>
                    <div class="actions">
                      <button class="secondary" type="submit" data-punch-action="clockOut">Clock Out</button>
                      <button class="primary" type="submit" data-punch-action="transfer">Transfer</button>
                    </div>
                  ` : punchMode ? `
                    <div class="form-grid two ${showTaskFields ? "" : "hidden"}" data-time-mode="task">
                      <label>Task <select name="taskId">${options(tracker.availableTasks || [], "Task ID", "Display Name", "", false)}</select></label>
                      <label>Notes <input name="notes" placeholder="Optional notes"></label>
                    </div>
                    <div class="form-grid two ${showTaskFields ? "hidden" : ""}" data-time-mode="general">
                      <label>Category <select name="categoryId">${options(tracker.categories || [], "Category ID", "Category", "", false)}</select></label>
                      <label>Notes <input name="generalNotes" placeholder="Optional notes"></label>
                    </div>
                  ` : `
                    <div class="form-grid two ${showTaskFields ? "" : "hidden"}" data-time-mode="task">
                      <label>Task <select name="taskId">${options(tracker.availableTasks || [], "Task ID", "Display Name", "", false)}</select></label>
                      <label>Notes <input name="notes" placeholder="Optional notes"></label>
                    </div>
                    <div class="form-grid two ${showTaskFields ? "hidden" : ""}" data-time-mode="general">
                      <label>Category <select name="categoryId">${options(tracker.categories || [], "Category ID", "Category", "", false)}</select></label>
                      <label>Notes <input name="generalNotes" placeholder="Optional notes"></label>
                    </div>
                    <div data-time-lock-fields>${renderTimeLockFields(periodLocked ? selectedPeriod : null)}</div>
                  `}
                  <div class="actions"><button class="primary" type="submit">${punchButtonLabel}</button></div>
                </form>
              </section>
              <section class="panel">
                <h3>Entries</h3>
                ${entries.length ? renderEntries(entries) : '<div class="empty">No time entries for this selection.</div>'}
                ${tracker.requests?.length ? `<h3>Pending Requests</h3>${renderTimeRequests(tracker.requests)}` : ""}
              </section>
            </div>
          </section>
        `;
      }

      function renderEntries(entries) {
        if (state.data.permissions.canViewAllTime) {
          const byUser = entries.reduce((acc, entry) => {
            const key = entry["User Name"] || "Unknown user";
            acc[key] = acc[key] || [];
            acc[key].push(entry);
            return acc;
          }, {});
          return Object.keys(byUser).sort().map((userName) => `
            <div class="group-heading">${escapeHtml(userName)}</div>
            ${renderEntriesByDay(byUser[userName])}
          `).join("");
        }
        return renderEntriesByDay(entries);
      }

      function renderEntriesByDay(entries) {
        const grouped = entries.reduce((acc, entry) => {
          const key = entry.Date || "No date";
          acc[key] = acc[key] || [];
          acc[key].push(entry);
          return acc;
        }, {});
        return Object.keys(grouped).sort().reverse().map((date) => {
          const dayEntries = grouped[date];
          const total = dayEntries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
          return renderCollapsibleSection(
            date,
            renderTimeEntriesTable(dayEntries, "timeEntries"),
            `${total.toFixed(2)} hours`,
            true
          );
        }).join("");
      }

      function renderTimeRequests(requests) {
        const sortedRequests = sortTableRows(requests, "timeRequests", {
          request: (request) => `${request["Request Type"] || ""} ${request.Status || ""}`,
          user: (request) => request["Requested By Name"],
          payPeriod: (request) => request["Pay Period Label"],
          reason: (request) => request.Reason
        });
        return `
          <div class="table-wrap" data-popover-boundary>
            <table class="time-table">
              <thead><tr>${renderSortHeader("timeRequests", "request", "Request")}${renderSortHeader("timeRequests", "user", "User")}${renderSortHeader("timeRequests", "payPeriod", "Pay Period")}${renderSortHeader("timeRequests", "reason", "Reason")}${renderActionsHeader()}</tr></thead>
              <tbody>${sortedRequests.map((request) => `
                <tr>
                  <td data-label="Request">${escapeHtml(request["Request Type"])} &middot; ${escapeHtml(request.Status)}</td>
                  <td data-label="User">${escapeHtml(request["Requested By Name"])}</td>
                  <td data-label="Pay Period">${escapeHtml(request["Pay Period Label"])}</td>
                  <td data-label="Reason">${escapeHtml(request.Reason)}</td>
                  <td data-label="Actions">

                      { action: "approve-time-request", symbol: "&#10003;", label: "Approve", attrs: { "data-request-id": request["Time Edit Request ID"] } },
                      { action: "reject-time-request", symbol: "&#10005;", label: "Reject", danger: true, attrs: { "data-request-id": request["Time Edit Request ID"] } }
                    ] : [], "Time request actions")}
                  </td>
                </tr>`).join("")}</tbody>
            </table>
          </div>`;
      }

      function renderTimeEntriesTable(entries, tableKey) {
        const sortedEntries = sortTableRows(entries, tableKey, {
          entry: (entry) => entry["Task / Category"],
          project: (entry) => entry["Project Name"],
          hours: (entry) => entry.Hours,
          payPeriod: (entry) => entry["Pay Period Label"]
        });
        return `
          <div class="table-wrap" data-popover-boundary>
            <table class="time-table">
              <thead><tr>${renderSortHeader(tableKey, "entry", "Entry")}${renderSortHeader(tableKey, "project", "Project")}${renderSortHeader(tableKey, "hours", "Hours")}${renderSortHeader(tableKey, "payPeriod", "Pay Period")}${renderActionsHeader()}</tr></thead>

                  <tr>
                    <td data-label="Entry">

                      </span>
                      ${renderTimeEntrySubtitle(entry)}
                    </td>
                    <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                    <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                    <td data-label="Pay Period">${escapeHtml(entry["Pay Period Label"])}</td>
                    <td data-label="Actions">
                      ${renderActionMenu([
                        entry._permissions?.canEdit ? { action: "edit-time", symbol: "&#9998;", label: "Edit time entry", attrs: { "data-entry-id": entry["Time Entry ID"] } } : null,
                        entry._permissions?.canDelete ? { action: "delete-time", symbol: "&#128465;", label: "Delete time entry", danger: true, attrs: { "data-entry-id": entry["Time Entry ID"] } } : null
                      ].filter(Boolean), "Time entry actions")}
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;

      function rangeOptions(selected) {
        const fixed = [
          ["current", "Current Pay Period"],
          ["last", "Last Pay Period"]
        ];
        const ranges = [
          ["last-week", "Last Week"],
          ["this-year", "This Year"],
          ["last-year", "Last Year"],
          ["last-month", "Last Month"],
          ["ytd", "Year to Date"],
          ["all-time", "All Time"],
          ["custom", "Custom Range"]
        ];
        const normalized = String(selected || "").startsWith("period:") ? "current" : String(selected || "current");
        return fixed.concat(ranges).map(([value, label]) => `<option value="${escapeHtml(value)}" ${String(value) === normalized ? "selected" : ""}>${escapeHtml(label)}</option>`).join("");
      }

      function normalizedRangeMode(mode) {
        const value = String(mode || "current");
        if (value === "current" || value === "last" || value === "last-week" || value === "this-year" || value === "last-year" || value === "last-month" || value === "ytd" || value === "all-time" || value === "custom") {
          return value;
        }
        return "current";
      }

      function payRangeOptions() {
        return rangeOptions(normalizedRangeMode(state.payFilters.rangeMode));
      }

      function projectRangeOptions() {
        return rangeOptions(normalizedRangeMode(state.projectFilters.rangeMode));
      }

      function buildPayFilters(extra = {}) {
        const rangeMode = normalizedRangeMode(state.payFilters.rangeMode);
        const filters = {
          userId: normalizedPayUserId(),
          rangeMode: rangeMode
        };
        if (rangeMode === "custom") {
          filters.startDate = state.payFilters.startDate || "";
          filters.endDate = state.payFilters.endDate || "";
        }
        return Object.assign(filters, extra);
      }

      function safePayFiltersForRefresh() {
        const filters = buildPayFilters();
        if (filters.rangeMode === "custom" && !(filters.startDate && filters.endDate)) {
          return {
            userId: normalizedPayUserId(),
            rangeMode: "current"
          };
        }
        return filters;
      }

      function normalizedPayUserId() {
        const payUsers = state.data?.payUsers || [];
        const selected = String(state.payFilters.userId || "");
        return payUsers.some((user) => String(user["User ID"]) === selected) ? selected : "";
      }

      function safeProjectFiltersForRefresh() {
        const filters = Object.assign({}, state.projectFilters);
        if (filters.rangeMode === "custom" && !(filters.startDate && filters.endDate)) {
          return {
            projectId: filters.projectId || "",
            includeArchived: Boolean(filters.includeArchived),
            rangeMode: "current"
          };
        }
        filters.rangeMode = normalizedRangeMode(filters.rangeMode);
        return filters;
      }

                <div class="metric-card"><span>Locked</span><strong>${summary.locked ? "Yes" : "No"}</strong></div>

          </div>
          <section class="side-layout" data-sidebar-collapsed="${state.paySidebarCollapsed ? "true" : "false"}">
            ${renderLayoutSidebar("Filters", "paySidebarCollapsed", `

            <div class="stack">
              <section class="panel">
                ${summary.summaries?.length ? `

                      <thead><tr>${renderSortHeader("paySummary", "user", "User")}${renderSortHeader("paySummary", "totalHours", "Total Hours")}${renderSortHeader("paySummary", "payType", "Pay Type")}${renderSortHeader("paySummary", "rate", "Rate/Salary")}${renderSortHeader("paySummary", "effectiveHourly", "Effective Hourly")}${renderSortHeader("paySummary", "grossPay", "Gross Pay")}</tr></thead>
                      <tbody>
                        ${sortedSummaries.map((row) => `
                          <tr class="pay-row" data-action="open-pay-detail" data-user-id="${escapeHtml(row["User ID"])}">
                            <td data-label="User"><span class="user-cell">${avatarForUser(findUser(row["User ID"]) || row)}${escapeHtml(row["User Name"])}</span></td>
                            <td data-label="Total Hours">${escapeHtml(row["Total Hours"])}</td>

      function renderProjectDashboard() {
        const data = state.data;

                ].filter(Boolean), "Project actions")}
              </td>
            </tr>
            ${expanded ? childProjects.map((childProject) => renderProjectNode(childProject, level + 1)).join("") : ""}`;

                <div class="metric-card"><span>Hours</span><strong>${escapeHtml(dashboard.summary.totalHours || 0)}</strong></div>
              </div>
            </section>
          </div>
          <section class="side-layout" data-sidebar-collapsed="${state.projectSidebarCollapsed ? "true" : "false"}">
            ${renderLayoutSidebar("Filters", "projectSidebarCollapsed", `
              <label>Project <select data-project-filter="projectId">

                </div>` : ""}

            <div class="stack">
              <section class="panel">
              ${(dashboard.projects || []).length ? `
                  <div class="table-wrap" data-popover-boundary>

          ["projects", "Projects", data.permissions.canManageProjects],

        ].filter((section) => section[2]);

          ["profile", "Profile", true],
          ["organization-group", "Organization", organizationChildren.length],
          ["settings", "App Settings", data.permissions.canManageSettings],
          ["import", "Import", data.permissions.canImportLegacyData]

          <section class="toolbar">
            <div>
              <h2>Settings</h2>
              <p>Profile, organization settings, application settings, and imports</p>
            </div>
          </section>
          <section class="settings-layout" data-sidebar-collapsed="${state.settingsSidebarCollapsed ? "true" : "false"}">

              ${sections.map(([id, label]) => {
                if (id === "organization-group") {

      function duplicateFieldsForKind(kind, record) {
        const row = record || {};
        const fields = {
          project: [
            ["Project", row["Project Name"] || row.Project || row.Name || ""],
            ["Status", row.Status || ""],
            ["Active", row.Active || ""]
          ],
          user: [
            ["Full Name", row["Full Name"] || row.FullName || row.User || row.Name || ""],
            ["Email", row.Email || ""],
            ["Role", row.Role || ""],
            ["Pay Type", row["Pay Type"] || row.PayType || ""]
          ],
          tag: [
            ["Tag", row.Tag || row["Tag Name"] || row.Name || ""],
            ["Color", row.Color || ""],
            ["Description", row.Description || ""]
          ],
          category: [
            ["Category", row.Category || ""],
            ["Default Project", row["Default Project"] || row.Project || ""]
          ],
          task: [
            ["Title", row.Title || row.Task || ""],
            ["Project", row["Project Name"] || row.Project || ""],
            ["Due Date", row["Due Date"] || row.Due || ""],
            ["Status", row.Status || ""]
          ],
          timeEntry: [
            ["Date", row.Date || ""],
            ["User", row["User Name"] || row.User || ""],
            ["Entry Type", row["Entry Type"] || ""],
            ["Task / Category", row["Task / Category"] || row.Task || row.Title || row.Category || ""],
            ["Project", row["Project Name"] || row.Project || ""],
            ["Hours", row.Hours || ""]
          ],
          payPeriod: [
            ["Pay Period", row["Pay Period"] || row["Pay Period Label"] || ""],
            ["Start Date", row["Start Date"] || row["Start Pay Period"] || ""],
            ["End Date", row["End Date"] || row["End Pay Period"] || ""]
          ],
          paySummary: [
            ["User", row["User Name"] || row.User || row["Full Name"] || ""],
            ["Pay Period", row["Pay Period"] || row["Pay Period Label"] || ""],
            ["Total Hours", row["Total Hours"] || row.Total || row.Hours || ""],
            ["Gross Pay", row["Gross Pay"] || row.Pay || ""]
          ]
        };
        return fields[kind] || Object.entries(row).slice(0, 4).map(([label, value]) => [label, value]);
      }

      function duplicateKindTitle(kind) {
        const labels = {
          project: "Project",
          user: "User",
          tag: "Tag",
          category: "Time Category",
          task: "Task",
          timeEntry: "Time Entry",
          payPeriod: "Pay Period",
          paySummary: "Pay Summary"
        };
        return labels[kind] || kind;

      function renderDuplicateComparison(duplicate, index) {
        return `
          <section class="panel" style="box-shadow:none;margin:0;">
            <div class="toolbar" style="margin-bottom:8px;">
              <div>
                <h3>${escapeHtml(duplicateKindTitle(duplicate.kind))}</h3>
                <p>${escapeHtml(duplicate.label || duplicate.fingerprint || "")}</p>
              </div>
              <label style="min-width:160px;">Decision
                <select data-duplicate-decision="${index}">
                  <option value="keep">Keep Original</option>
                  <option value="replace">Replace</option>
                </select>
              </label>
            </div>
            <div class="detail-grid">
              <div class="panel" style="box-shadow:none;margin:0;">
                <h3>Existing</h3>
                ${duplicateFieldsForKind(duplicate.kind, duplicate.existing).map(([label, value]) => `<div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(value)}</div>`).join("")}
              </div>
              <div class="panel" style="box-shadow:none;margin:0;">
                <h3>Incoming</h3>
                ${duplicateFieldsForKind(duplicate.kind, duplicate.incoming).map(([label, value]) => `<div><strong>${escapeHtml(label)}:</strong> ${escapeHtml(value)}</div>`).join("")}
              </div>
            </div>
          </section>`;
      }

      function openLegacyDuplicateReview(preview, payload) {
        state.pendingMigrationImport = { payload, preview };
        const duplicates = preview.duplicates || [];
        setModal(`
          <div class="modal-backdrop">
            <div class="modal stack" style="width:min(1080px,100%);">
              <div class="modal-header">
                <h3>Duplicate Records Found</h3>
                <button type="button" data-action="close-modal">Close</button>
              </div>
              <p>${escapeHtml(duplicates.length)} potential duplicate${duplicates.length === 1 ? "" : "s"} were found. Choose what to do for each one, or apply the same choice to every duplicate.</p>
              <label class="checkbox-row"><input type="checkbox" data-duplicate-apply-all> Apply the first decision to every duplicate</label>
              <div class="stack" style="max-height:58vh;overflow:auto;">
                ${duplicates.map((duplicate, index) => renderDuplicateComparison(duplicate, index)).join("")}
              </div>
              <div class="actions">
                <button type="button" class="primary" data-action="confirm-legacy-import">Import with these choices</button>
              </div>
            </div>
          </div>`);
      }

      function syncDuplicateApplyAll() {
        const applyAll = document.querySelector("[data-duplicate-apply-all]")?.checked;
        if (!applyAll) return;
        const first = document.querySelector("[data-duplicate-decision='0']");
        const value = first?.value || "keep";
        document.querySelectorAll("[data-duplicate-decision]").forEach((select) => {
          select.value = value;
        });
      }

      function activeTags() {
        return (state.data.tags || []).filter((tag) => String(tag.Active) !== "false");
      }

      function renderTagPicker(selectedTags) {
        const selected = selectedTags || [];
        return `<div class="tag-picker" data-tag-picker>
          <input type="hidden" name="tags" value="${escapeHtml(selected.join(", "))}">
          <div class="chip-list" data-tag-chips></div>
          <input data-tag-search placeholder="Search or create tag" autocomplete="off">
          <div class="tag-option-list" data-tag-options></div>
        </div>`;
      }

      function updateTagPicker(picker) {
        const hidden = picker.querySelector('input[name="tags"]');
        const searchInput = picker.querySelector("[data-tag-search]");
        const query = String(searchInput?.value || "").trim().toLowerCase();
        const selected = selectedList(hidden.value);
        picker.querySelector("[data-tag-chips]").innerHTML = selected.map((tag) => `
          <span class="badge">${escapeHtml(tag)}<button type="button" class="chip-remove" data-action="remove-tag-selection" data-tag-name="${escapeHtml(tag)}" title="Remove ${escapeHtml(tag)}" aria-label="Remove ${escapeHtml(tag)}">&times;</button></span>

      function effectivePermissionsForUser(userId) {
        return (state.data.userPermissions || []).find((row) => String(row["User ID"]) === String(userId))?.Permissions || {};

      function permissionMatrixGroups() {
        const groups = state.data.constants.permissionGroups || [];
        if (groups.length) return groups;
        const capabilities = state.data.constants.permissionCapabilities || [];
        return capabilities.length ? [{
          key: "all",
          label: "Permissions",
          capabilities
        }] : [];
      }

      function permissionLabel(capability) {
        return String(capability || "").replace(/^Can /, "");
      }

      function renderPermissionSwitch(label, inputAttrs, checked, options = {}) {
        const rowClass = options.rowClass ? ` ${options.rowClass}` : "";
        return `<label class="permission-switch-row${rowClass}">
          <span class="permission-switch-text">${escapeHtml(label)}</span>
          <span class="permission-switch-control">
            <input type="checkbox"${inputAttrs ? ` ${inputAttrs}` : ""}${checked ? " checked" : ""}>
            <span class="permission-switch-ui" aria-hidden="true"></span>
          </span>
        </label>`;
      }

      function syncPermissionSwitchVisual(input, checked, mixed) {
        if (!input) return;
        input.checked = Boolean(checked);
        input.indeterminate = Boolean(mixed);
        input.dataset.toggleState = mixed ? "mixed" : checked ? "on" : "off";
      }

      function permissionGroupSection(form, groupKey) {
        return Array.from(form.querySelectorAll("[data-permission-group-section]")).find((section) => section.dataset.permissionGroupKey === String(groupKey)) || null;
      }

      function syncPermissionMatrix(form) {
        if (!form) return;
        const groups = permissionMatrixGroups();
        const permissionInputs = Array.from(form.querySelectorAll('[name="permission"]'));
        const totalPermissions = permissionInputs.length;
        const enabledPermissions = permissionInputs.filter((input) => input.checked).length;
        const masterToggle = form.querySelector("[data-permission-master-toggle]");
        syncPermissionSwitchVisual(masterToggle, enabledPermissions === totalPermissions && totalPermissions > 0, enabledPermissions > 0 && enabledPermissions < totalPermissions);
        const masterBadge = form.querySelector("[data-permission-master-badge]");
        if (masterBadge) {
          masterBadge.textContent = `${enabledPermissions} enabled`;
        }
        groups.forEach((group) => {
          const section = permissionGroupSection(form, group.key);
          if (!section) return;
          const groupInputs = Array.from(section.querySelectorAll('[name="permission"]'));
          const groupEnabled = groupInputs.filter((input) => input.checked).length;
          const groupToggle = section.querySelector("[data-permission-group-toggle]");
          syncPermissionSwitchVisual(groupToggle, groupEnabled === groupInputs.length && groupInputs.length > 0, groupEnabled > 0 && groupEnabled < groupInputs.length);
          const badge = section.querySelector("[data-permission-group-badge]");
          if (badge) {
            badge.textContent = `${groupEnabled} enabled`;
          }
        });
      }

      function setPermissionInputs(form, selector, checked) {
        Array.from(form.querySelectorAll(selector)).forEach((input) => {
          input.checked = checked;
          input.indeterminate = false;
          input.dataset.toggleState = checked ? "on" : "off";
        });
      }

      function setPermissionGroupExpanded(section, expanded) {
        if (!section) return;
        const body = section.querySelector("[data-permission-group-body]");
        const summary = section.querySelector("[data-permission-group-summary]");
        const icon = section.querySelector("[data-permission-group-icon]");
        if (body) {
          body.hidden = !expanded;
        }
        if (summary) {
          summary.setAttribute("aria-expanded", expanded ? "true" : "false");
        }
        if (icon) {
          icon.innerHTML = expanded ? "&#9660;" : "&#9654;";
        }
        section.dataset.permissionGroupExpanded = expanded ? "true" : "false";
      }

      function renderPermissionGroup(group, permissions) {
        const enabledCount = (group.capabilities || []).filter((capability) => Boolean(permissions[capability])).length;
        const sectionId = `permission-group-${group.key}`;
        const isExpanded = false;
        return `
          <section class="permission-group" data-permission-group-section data-permission-group-key="${escapeHtml(group.key)}" data-permission-group-expanded="${isExpanded ? "true" : "false"}">
            <div class="permission-group-head">
              <button type="button" class="permission-group-summary" data-action="toggle-permission-group-view" data-permission-group-key="${escapeHtml(group.key)}" data-permission-group-summary aria-controls="${escapeHtml(sectionId)}" aria-expanded="${isExpanded ? "true" : "false"}">
                <span class="permission-group-summary-main">
                  <span class="permission-group-title">${escapeHtml(group.label)}</span>
                  <span class="badge permission-group-badge" data-permission-group-badge>${escapeHtml(`${enabledCount} enabled`)}</span>
                </span>
                <span class="permission-group-summary-icon" data-permission-group-icon aria-hidden="true">&#9654;</span>
              </button>
              ${renderPermissionSwitch(
                "Enable all",
                `data-permission-group-toggle="true" data-permission-group-key="${escapeHtml(group.key)}" aria-label="Enable all ${escapeHtml(group.label)} permissions"`,
                enabledCount === (group.capabilities || []).length && (group.capabilities || []).length > 0,
                { rowClass: "permission-switch-inline" }
              )}
            </div>
            <div id="${escapeHtml(sectionId)}" class="permission-group-body" data-permission-group-body hidden>
              <div class="permission-group-items">
                ${(group.capabilities || []).map((capability) => renderPermissionSwitch(
                  permissionLabel(capability),
                  `name="permission" value="${escapeHtml(capability)}" data-permission-capability="${escapeHtml(capability)}" data-permission-group-key="${escapeHtml(group.key)}"`,
                  Boolean(permissions[capability])
                )).join("")}
              </div>
            </div>
          </section>`;
      }

      function renderUserPermissionControls(user) {
        if (!state.data.userPermissions?.length) return "";
        if (!user || !user["User ID"]) return "";
        if (user.Role === "Owner") return "";
        const permissions = effectivePermissionsForUser(user?.["User ID"]);
        const groups = permissionMatrixGroups();
        const allCapabilities = groups.reduce((list, group) => list.concat(group.capabilities || []), []);
        const enabledCount = allCapabilities.filter((capability) => Boolean(permissions[capability])).length;
        return `<section class="panel permission-matrix" style="box-shadow:none;margin:0;">
          <h3>Permissions</h3>
          <div class="permission-matrix-toolbar">
            ${renderPermissionSwitch(
              "Enable all permissions",
              `data-permission-master-toggle="true" aria-label="Enable all permissions"`,
              enabledCount === allCapabilities.length && allCapabilities.length > 0,
              { rowClass: "permission-switch-inline" }
            )}
            <span class="badge permission-matrix-badge" data-permission-master-badge>${escapeHtml(`${enabledCount} enabled`)}</span>
          </div>
          <div class="stack">
            ${groups.map((group) => renderPermissionGroup(group, permissions)).join("")}
          </div>
        </section>`;
      }

        const payType = form.payType?.value || "None";

        const salaryFrequency = form.salaryFrequency;
        if (hourlyRate) hourlyRate.disabled = payType !== "Hourly";
        if (salaryAmount) salaryAmount.disabled = payType !== "Salary";
        if (salaryFrequency) salaryFrequency.disabled = payType !== "Salary";
        if (form.trackPay && form.trackTime) {
          if (form.trackPay.checked) {
            form.trackTime.checked = true;
            form.trackTime.disabled = true;
          } else {
            form.trackTime.disabled = false;
          }

        const userId = String(userFilter.userId || "");
        const userKey = String(userFilter.userKey || "");
        if (userId) return String(entry["User ID"] || "") === userId;
        if (userKey) {
          return String(entry["User ID"] || "") === userKey || String(entry["User Name"] || "") === userKey;
        }
        return true;
      }

      function projectEntriesForUser(entries, userFilter) {
        return (entries || []).filter((entry) => projectEntryMatchesUser(entry, userFilter));
      }

      function renderProjectUserTotalsList(projectDetail) {
        const rows = projectDetail?.userTotals || [];
        if (!rows.length) return `<div class="empty">No user time in this range.</div>`;
        const tableKey = "projectUserTotals";
        const sortedRows = sortTableRows(rows, tableKey, {
          name: (row) => row.label,
          hours: (row) => row.hours
        });
        return `
          <div class="table-wrap" data-popover-boundary>
            <table class="time-table project-user-entries-table">
              <thead><tr>${renderSortHeader(tableKey, "name", "Name")}${renderSortHeader(tableKey, "hours", "Hours")}${renderActionsHeader()}</tr></thead>
              <tbody>
                ${sortedRows.map((row) => `
                  <tr>
                    <td data-label="Name">${escapeHtml(row.label)}</td>
                    <td data-label="Hours">${escapeHtml(row.hours)}</td>
                    <td data-label="Actions">
                      ${row.userId || row.key ? renderIcon("view-project-user-entries", "", "", "View Entries", "&#128065;", false, {
                        "data-project-id": projectDetail?.project?.["Project ID"] || "",
                        "data-user-id": row.userId || "",
                        "data-user-key": row.key || row.userId || "",
                        "data-user-label": row.label || ""
                      }) : ""}
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>`;
      }

      function renderProjectEntriesTable(entries, tableKey = "projectEntries") {
        const sortedEntries = sortTableRows(entries, tableKey, {
          date: (entry) => entry.Date,
          entry: (entry) => entry["Task / Category"],
          project: (entry) => entry["Project Name"],
          hours: (entry) => entry.Hours,
          payPeriod: (entry) => entry["Pay Period Label"]
        });
        return `
          <div class="table-wrap" data-popover-boundary>
            <table class="time-table project-entries-table">
              <thead><tr>${renderSortHeader(tableKey, "date", "Date", "desc")}${renderSortHeader(tableKey, "entry", "Entry")}${renderSortHeader(tableKey, "project", "Project")}${renderSortHeader(tableKey, "hours", "Hours")}${renderSortHeader(tableKey, "payPeriod", "Pay Period")}${renderActionsHeader()}</tr></thead>
              <tbody>
                ${sortedEntries.map((entry) => `
                  <tr>
                    <td data-label="Date">${escapeHtml(entry.Date)}</td>
                    <td data-label="Entry">
                      <span class="task-title-row">
                        <strong>${escapeHtml(entry["Task / Category"])}</strong>
                        ${renderTimeSourceBadge(entry["Entry Source"])}
                        ${renderNoteIcon(entry.Notes, "Time entry note")}
                      </span>
                      ${renderTimeEntrySubtitle(entry)}
                    </td>
                    <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                    <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                    <td data-label="Pay Period">${escapeHtml(entry["Pay Period Label"])}</td>
                    <td data-label="Actions">
                      ${renderActionMenu([
                        entry._permissions?.canEdit ? { action: "edit-time", symbol: "&#9998;", label: "Edit time entry", attrs: { "data-entry-id": entry["Time Entry ID"] } } : null,
                        entry._permissions?.canDelete ? { action: "delete-time", symbol: "&#128465;", label: "Delete time entry", danger: true, attrs: { "data-entry-id": entry["Time Entry ID"] } } : null
                      ].filter(Boolean), "Time entry actions")}
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>`;
      }

      function openProjectEntriesModal(projectDetail, userFilter = {}, options = {}) {
        if (!projectDetail?.project) return;
        const user = userFilter.userId ? findUser(userFilter.userId) : null;
        const userLabel = userFilter.userLabel || user?.["Full Name"] || userFilter.userKey || "Unknown user";
        const filteredEntries = projectEntriesForUser(projectDetail.entries || [], userFilter);
        const totalHours = filteredEntries.reduce((sum, entry) => sum + Number(entry.Hours || 0), 0);
        const modalState = {
          projectId: projectDetail.project["Project ID"] || "",
          userId: userFilter.userId || "",
          userKey: userFilter.userKey || userFilter.userId || "",
          userLabel: userLabel
        };
        state.projectEntriesModal = modalState;
        const html = `
          <div class="modal-backdrop" data-project-entries-modal="true" data-project-id="${escapeHtml(modalState.projectId)}" data-user-id="${escapeHtml(modalState.userId)}" data-user-key="${escapeHtml(modalState.userKey)}" ${options.stackSource ? `data-stack-source="${escapeHtml(options.stackSource)}"` : ""}>
            <div class="modal stack">
              <div class="modal-header">
                <h3>${escapeHtml(userLabel)} Entries</h3>
                <button type="button" data-action="close-modal">Close</button>
              </div>
              <div class="profile-preview" style="margin-bottom:12px;">
                ${user ? avatarForUser(user) : ""}
                <strong>${escapeHtml(projectDisplayName(projectDetail.project))}</strong>
                <span>${escapeHtml(projectDetail.range?.label || "")}</span>
              </div>
              <div class="metric-grid" style="margin-bottom:12px;">
                <div class="metric-card"><span>Hours</span><strong>${escapeHtml(totalHours.toFixed(2))}</strong></div>
                <div class="metric-card"><span>Entries</span><strong>${escapeHtml(filteredEntries.length)}</strong></div>
                <div class="metric-card"><span>Scope</span><strong>${escapeHtml(projectDetail.summary?.["Display Name"] || projectDisplayName(projectDetail.project))}</strong></div>
                <div class="metric-card"><span>Range</span><strong>${escapeHtml(projectDetail.range?.label || "")}</strong></div>
              </div>
              ${filteredEntries.length ? renderProjectEntriesTable(filteredEntries, "projectEntries") : '<div class="empty">No entries for this user in the selected project range.</div>'}
            </div>
          </div>`;
        if (options.stack) pushModal(html);
        else setModal(html);
      }

      function renderCollapsibleSection(title, bodyHtml, meta = "", open = false, titleIsHtml = false) {
        return `
          <details class="collapsible-section"${open ? " open" : ""}>
            <summary>
              <span>${titleIsHtml ? title : escapeHtml(title)}</span>
              ${meta ? `<span class="collapsible-meta">${escapeHtml(meta)}</span>` : ""}
            </summary>
            <div class="collapsible-body">${bodyHtml}</div>
          </details>`;
      }

      function openPaySummaryDetailModal(detail) {
        const taskTotalCount = (detail.taskTotals || []).length;
        const projectTotalCount = (detail.projectTotals || []).length;
        const entryCount = (detail.entries || []).length;
        pushModal(`
          <div class="modal-backdrop">
            <div class="modal stack pay-detail-modal">
              <div class="modal-header"><h3>Pay Details</h3><button type="button" data-action="close-modal">Close</button></div>
              <div class="profile-preview">${avatarForUser(detail.user)}<strong>${escapeHtml(detail.user["Full Name"])}</strong><span>${escapeHtml(detail.range.label)}</span></div>
              <div class="form-grid two">
                <div class="panel" style="box-shadow:none;margin:0;"><h3>Total Hours</h3><strong>${escapeHtml(detail.metrics.totalHours)}</strong></div>
                <div class="panel" style="box-shadow:none;margin:0;"><h3>Average Hours / Week</h3><strong>${escapeHtml(detail.metrics.averageHoursPerWeek)}</strong></div>
              </div>
              ${renderCollapsibleSection("Task Time", renderHoursList(detail.taskTotals, "No task time in this range.", "payDetailTaskTotals"), `${taskTotalCount} item${taskTotalCount === 1 ? "" : "s"}`)}
              ${renderCollapsibleSection("Project Time", renderHoursList(detail.projectTotals, "No project time in this range.", "payDetailProjectTotals"), `${projectTotalCount} item${projectTotalCount === 1 ? "" : "s"}`)}
              ${renderCollapsibleSection("Entries", `<div class="table-wrap" data-popover-boundary><table>
                <thead><tr>${renderSortHeader("payDetailEntries", "date", "Date")}${renderSortHeader("payDetailEntries", "entry", "Entry")}${renderSortHeader("payDetailEntries", "project", "Project")}${renderSortHeader("payDetailEntries", "hours", "Hours")}</tr></thead>
                <tbody>${sortTableRows(detail.entries || [], "payDetailEntries", {
                  date: (entry) => entry.Date,
                  entry: (entry) => entry["Task / Category"],
                  project: (entry) => entry["Project Name"],
                  hours: (entry) => entry.Hours
                }).map((entry) => `<tr>
                  <td data-label="Date">${escapeHtml(entry.Date)}</td>
                  <td data-label="Entry">
                    <span class="task-title-row">
                      <strong>${escapeHtml(entry["Task / Category"])}</strong>
                      ${renderTimeSourceBadge(entry["Entry Source"])}
                    </span>
                    ${renderTimeEntrySubtitle(entry)}
                  </td>
                  <td data-label="Project">${escapeHtml(entry["Project Name"])}</td>
                  <td data-label="Hours">${escapeHtml(entry.Hours)}</td>
                </tr>`).join("")}</tbody>
              </table></div>`, `${entryCount} item${entryCount === 1 ? "" : "s"}`)}
            </div>
          </div>`);
